<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Tablets</title>
    <style>
        /* Estilos generales de la página */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* Fondo blanco */
            color: #DACCAA; /* Color de texto base */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Estilo del título */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            text-align: center;
            color: #DACCAA; 
        }

        /* Contenedor de la cuadrícula de botones */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 botones en horizontal */
            gap: 20px;
            max-width: 1000px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Estilos de los botones */
        .btn {
            background-color: #DACCAA; 
            color: #ffffff; /* Texto blanco en los botones */
            text-decoration: none;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        /* Efecto al pasar el mouse por encima */
        .btn:hover {
            transform: translateY(-5px);
            opacity: 0.85;
        }

        /* Adaptación para tablets (2 columnas) */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Adaptación para celulares (1 columna) */
        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Simulador de Tablets</h1>

    <div class="grid-container">
        <a href="https://yaryur-nestle.github.io/canal-moderno/tablet01" target="_blank" class="btn">NIDO Redvital La Yaguara</a>
        <a href="https://yaryur-nestle.github.io/canal-moderno/tablet02" target="_blank" class="btn">RECETAS Redvital La Yaguara</a>
        <a href="https://yaryur-nestle.github.io/canal-moderno/tablet03" target="_blank" class="btn">MULTIMARCA Garzón Hiperahorro</a>
        <a href="https://yaryur-nestle.github.io/canal-moderno/tablet04" target="_blank" class="btn">NIDO Redvital San Diego</a>
        <a href="https://yaryur-nestle.github.io/canal-moderno/tablet05" target="_blank" class="btn">NIDO Redvital Kromi Market</a>
        <a href="https://yaryur-nestle.github.io/canal-moderno/tablet06" target="_blank" class="btn">MULTIMARCA Luxor Círculo Militar</a>
    </div>

</body>
</html>
