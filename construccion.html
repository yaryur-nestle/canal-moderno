<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yar-Yur System</title>
    
    <script src="https://code.highcharts.com/maps/highmaps.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.1/proj4.js"></script>
    <script src="https://code.highcharts.com/mapdata/countries/ve/ve-all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* =========================================
           NORMALIZACIÓN Y CONTENEDOR 16:9 (NUEVO)
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #ffffff; /* Este color crea las barras blancas a los lados/arriba/abajo */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor Maestro que fuerza el 16:9 */
        #aspect-ratio-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            /* La magia matemática para mantener la proporción: */
            max-width: calc(100vh * (16 / 9));
            max-height: calc(100vw * (9 / 16));
            overflow: hidden;
            background-color: #f4f4f9; /* Fondo de base del sistema */
            box-shadow: 0 0 30px rgba(0,0,0,0.15); /* Sombra para resaltar la app sobre el fondo blanco */
        }

        .spa-view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* =========================================
           VISTA 1: LOGIN
           ========================================= */
        #login-view { background-color: #000000; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #ffffff; padding: 40px; border-radius: 12px; text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box h2 { color: #333; margin-bottom: 20px; font-weight: 800; text-transform: uppercase;}
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: #b39c6e; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .login-box button:hover { background: #968157; }
        #login-error { color: red; margin-top: 10px; font-size: 14px; display: none; }

        /* =========================================
           VISTA 1.5: BIENVENIDA / START
           ========================================= */
        #welcome-view { background-color: #000000; justify-content: center; align-items: center; z-index: 9998; color: white; }
        
        #rotate-device-msg { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; }
        #rotate-device-msg svg { width: 80px; height: 80px; animation: rotatePhone 2s infinite ease-in-out; }
        @keyframes rotatePhone { 
            0% { transform: rotate(0deg); } 
            50% { transform: rotate(-90deg); } 
            100% { transform: rotate(-90deg); } 
        }
        #rotate-device-msg p { font-size: 1.4rem; font-weight: 600; color: #daccaa; max-width: 80%; }

        #start-container { display: none; justify-content: center; align-items: center; text-align: center; flex-direction: column; }
        .pulse-btn { 
            background-color: #b39c6e; color: #fff; border: 2px solid #daccaa; border-radius: 12px; 
            padding: 25px 50px; font-size: 1.8rem; font-weight: 900; text-transform: uppercase; 
            cursor: pointer; box-shadow: 0 0 15px rgba(179, 156, 110, 0.5); 
            animation: slowPulse 2.5s infinite; transition: transform 0.3s, background-color 0.3s; 
            line-height: 1.4; letter-spacing: 1px;
        }
        .pulse-btn:hover { background-color: #968157; transform: scale(1.02); animation-play-state: paused; }
        @keyframes slowPulse {
            0% { box-shadow: 0 0 0 0 rgba(179, 156, 110, 0.7); transform: scale(1); }
            50% { box-shadow: 0 0 0 25px rgba(179, 156, 110, 0); transform: scale(1.03); }
            100% { box-shadow: 0 0 0 0 rgba(179, 156, 110, 0); transform: scale(1); }
        }

        /* =========================================
           VISTA 2: MAPA (Canal Moderno)
           ========================================= */
        #map-view { background-color: #f4f4f9; justify-content: center; align-items: center; }
        /* Cambiado vw/vh por % para que responda al contenedor maestro */
        #app-container { width: 90%; height: 90%; background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; overflow: hidden; transition: width 0.3s, height 0.3s, border-radius 0.3s; }
        :fullscreen #app-container { width: 100%; height: 100%; border-radius: 0; border: none; }
        #map { width: 100%; height: 100%; position: relative; z-index: 1; background-color: transparent;}
        #capa-superior { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; user-select: none; object-fit: cover; opacity: 1; transition: opacity 0.4s ease-in-out; }

        /* Controles y Paneles del Mapa */
        #hamburger-btn { position: absolute; top: 20px; cursor: pointer; z-index: 10002; right: 20px; width: 32px; height: 22px; display: flex; flex-direction: column; justify-content: space-between; background: none; border: none; }
        #hamburger-btn span { display: block; height: 3px; width: 100%; background-color: #b39c6e; border-radius: 3px; transition: all 0.3s; transform-origin: right center; }
        #hamburger-btn.open span:nth-child(1) { transform: rotate(-45deg) translateY(-2px); width: 16px; }
        #hamburger-btn.open span:nth-child(2) { transform: scaleX(1); }
        #hamburger-btn.open span:nth-child(3) { transform: rotate(45deg) translateY(2px); width: 16px; }

        .side-panel { position: absolute; top: 0; right: -350px; width: 320px; height: 100%; background-color: #ffffff; box-shadow: -4px 0 15px rgba(0,0,0,0.1); z-index: 10000; transition: right 0.3s ease-in-out; display: flex; flex-direction: column; padding: 60px 20px 20px 20px; overflow-y: auto; }
        .side-panel.active { right: 0; }
        
        #close-info-btn { position: absolute; top: 15px; left: 20px; background: none; border: none; font-size: 28px; color: #999; cursor: pointer; transition: color 0.2s; }
        #close-info-btn:hover { color: #ff2a2a; }

        .panel-header { text-align: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 20px; }
        #panel-subtitle { font-size: 18px; font-weight: 900; color: #daccaa; margin-bottom: 15px; text-transform: uppercase; }
        #panel-title { font-size: 22px; font-weight: 600; color: #333; }
        .panel-images-container { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .panel-images-container a { display: block; width: 100%; text-align: center; outline: none; }
        .panel-images-container img { width: 200px; height: 200px; object-fit: cover; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); transition: transform 0.2s; cursor: pointer; }
        .panel-images-container img:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .panel-footer-logo { margin-top: auto; padding-top: 25px; text-align: center; }
        #panel-logo-img { max-width: 180px; max-height: 80px; object-fit: contain; }

        .accordion-btn { background: none; border: none; border-bottom: 2px solid #f0f0f0; font-size: 20px; font-weight: 600; color: #daccaa; width: 100%; text-align: left; padding: 15px 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: color 0.2s; }
        .accordion-btn:hover { color: #b39c6e; }
        .accordion-content { display: none; flex-direction: column; gap: 15px; padding: 20px 0; }
        .accordion-content.open { display: flex; }
        .filter-wrapper { display: flex; flex-direction: column; width: 100%; margin-bottom: 5px; }
        .filter-img-btn { border: 2px solid transparent; border-radius: 8px; padding: 10px; cursor: pointer; transition: all 0.2s ease; background-color: #fcfcfc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .filter-img-btn:hover { transform: translateY(-2px); }
        .filter-img-btn.active-filter { border-color: #b39c6e; background-color: #fdfbf7; }
        .marca-btn { aspect-ratio: 1 / 1; width: 180px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
        .marca-btn img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .sucursal-btn { text-align: center; }
        .sucursal-btn img { max-width: 100%; height: 60px; object-fit: contain; }
        .filter-results { display: none; flex-direction: column; gap: 8px; padding: 12px 10px; background-color: #fafafa; border-radius: 8px; border-left: 4px solid #daccaa; margin-top: 10px; }
        .filter-results.active { display: flex; }
        .filter-results a { color: #daccaa; font-weight: 700; text-decoration: none; font-size: 14px; display: block; padding: 4px 0; cursor: pointer;}
        .filter-results a:hover { color: #b39c6e; text-decoration: underline; }

        /* =========================================
           VISTA 3: MONITOR INTERACTIVO
           ========================================= */
        #monitor-view { background-color: #000000; }
        #btn-volver-mapa { position: absolute; top: 15px; left: 15px; padding: 10px 20px; background: rgba(179, 156, 110, 0.8); color: #fff; border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 1000; transition: background 0.3s; }
        #btn-volver-mapa:hover { background: rgba(179, 156, 110, 1); }

        /* Cambiado vw/vh por % para que responda al contenedor maestro */
        .flip-container { perspective: 1500px; width: 100%; height: 100%; }
        .flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1s cubic-bezier(0.68, -0.15, 0.265, 1.15); }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        
        .front, .back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; }
        .front { background-color: #ffffff; pointer-events: auto; }
        .back { transform: rotateY(180deg); background-color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; pointer-events: none;}
        .flip-container.flipped .front { pointer-events: none; }
        .flip-container.flipped .back { pointer-events: auto; }

        .base-img, .person-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .person-img { opacity: 0; transition: opacity 1.5s ease-in-out; }
        .person-img.active { opacity: 1; }

        .click-zone { position: absolute; top: 0; height: 100%; width: 33.33%; cursor: pointer; z-index: 50; }
        .click-zone.left { left: 0; }
        .click-zone.center { left: 33.33%; }
        .click-zone.right { right: 0; }

        /* En Vivo Overlay */
        .live-overlay { position: absolute; top: 50%; left: 40%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; z-index: 100; pointer-events: none; }
        .en-vivo-badge { color: #ff3333; border: 3px solid #ff3333; border-radius: 50px; padding: 5px 25px; font-weight: 900; font-size: 1.8rem; letter-spacing: 2px; box-shadow: 0 0 10px #ff3333, inset 0 0 10px #ff3333; animation: heartbeat 2s infinite; margin-bottom: 10px; }
        @keyframes heartbeat { 0%, 20%, 40%, 100% { transform: scale(1); opacity: 1; } 10%, 30% { transform: scale(1.1); opacity: 0.8; } }
        .live-count { font-size: 4.5rem; font-weight: 900; color: #000; text-transform: uppercase; }
        .live-timer { font-size: 3.5rem; font-weight: 900; color: #d4af37; text-shadow: 3px 3px 6px rgba(0,0,0,0.9); }
        .live-timer.recorded { color: #2aa12a; animation: timerPulseTwice 0.8s forwards; }
        @keyframes timerPulseTwice { 0% { transform: scale(1); } 30%, 75% { transform: scale(1.3); } 50% { transform: scale(1.05); } 100% { transform: scale(1.2); } }
        .live-datetime { font-size: 1.3rem; color: #bbb; margin-top: 5px; font-weight: 600; }
        .fade-out-up { animation: fadeOutUp 0.5s forwards ease-in; }
        @keyframes fadeOutUp { 0% { opacity: 1; transform: translateY(-50%); } 100% { opacity: 0; transform: translateY(-70%); } }

        /* Contenido Trasero (Gráficos) */
        .back-content { background: #f8f9fa; padding: 40px 60px; border-radius: 20px; width: 95%; max-width: 1400px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: 1px solid #e0e0e0; text-align: center; position: relative; }
        .top-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 5px; }
        .top-controls h1 { color: #111; letter-spacing: 3px; margin: 0; text-transform: uppercase; font-weight: 800; font-size: 2.2rem; }
        .subtitle { color: #666; margin-bottom: 20px; font-weight: bold; text-transform: uppercase; font-size: 1.2rem; }
        
        .icon-btn { background: #fff; border: 2px solid #ddd; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .icon-btn:hover { background: #f0f0f0; transform: scale(1.1); }
        .metric-toggle { position: absolute; top: 0; right: 0; width: 55px; height: 55px; border-color: #ccc; }

        .chart-layout { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 50vh; overflow: hidden; }
        .nav-arrow { background: rgba(0,0,0,0.05); border: none; border-radius: 12px; width: 50px; height: 100px; cursor: pointer; transition: background 0.3s; z-index: 10; }
        .nav-arrow:hover { background: rgba(0,0,0,0.15); transform: scale(1.05); }
        .nav-arrow:disabled { opacity: 0; pointer-events: none; }
        .chart-container { position: relative; height: 100%; flex-grow: 1; padding: 0 20px; }
        
        .slide-out-left { animation: slideOutLeft 0.4s forwards; }
        .slide-in-right { animation: slideInRight 0.4s forwards; }
        .slide-out-right { animation: slideOutRight 0.4s forwards; }
        .slide-in-left { animation: slideInLeft 0.4s forwards; }
        @keyframes slideOutLeft { to { transform: translateX(-100%); opacity: 0; } }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { to { transform: translateX(100%); opacity: 0; } }
        @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .hint { margin-top: 25px; color: #888; font-size: 0.9rem; animation: pulse 2s infinite; cursor: pointer; padding: 10px 20px; display: inline-block; border-radius: 8px; transition: background-color 0.3s; }
        .hint:hover { background-color: rgba(0,0,0,0.05); color: #333; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; transform: scale(1.02); } 100% { opacity: 0.8; } }
    </style>
</head>
<body>

    <div id="aspect-ratio-wrapper">

        <div id="login-view" class="spa-view">
            <div class="login-box">
                <h2>Yar-Yur System</h2>
                <input type="email" id="email-input" placeholder="Correo electrónico">
                <input type="password" id="password-input" placeholder="Contraseña">
                <button id="btn-login">Ingresar al Sistema</button>
                <div id="login-error">Credenciales incorrectas.</div>
            </div>
        </div>

        <div id="welcome-view" class="spa-view">
            <div id="rotate-device-msg">
                <svg viewBox="0 0 24 24" fill="none" stroke="#b39c6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <path d="M12 18h.01"></path>
                </svg>
                <p>Por favor, gira tu dispositivo a modo horizontal para disfrutar la experiencia.</p>
            </div>
            <div id="start-container">
                <button id="btn-start-system" class="pulse-btn">INICIAR YAR-YUR SYSTEM NESTLÉ<br>Canal Moderno</button>
            </div>
        </div>

        <div id="map-view" class="spa-view">
            <div id="app-container">
                <div id="map"></div>
                <img src="CAPA.png" id="capa-superior" alt="Capa Decorativa">
                
                <button id="hamburger-btn">
                    <span></span><span></span><span></span>
                </button>

                <div id="nav-panel" class="side-panel">
                    <h2 style="color: #333; margin-bottom: 20px; font-size: 22px;">Filtros de Búsqueda</h2>
                    <div class="accordion-item">
                        <button class="accordion-btn">Marcas <span>+</span></button>
                        <div class="accordion-content">
                            <div class="filter-wrapper"><div class="filter-img-btn marca-btn" data-type="marca" data-val="NIDO.png"><img src="NIDO.png" alt="NIDO"></div><div class="filter-results"></div></div>
                            <div class="filter-wrapper"><div class="filter-img-btn marca-btn" data-type="marca" data-val="RECETAS.png"><img src="RECETAS.png" alt="RECETAS"></div><div class="filter-results"></div></div>
                            <div class="filter-wrapper"><div class="filter-img-btn marca-btn" data-type="marca" data-val="MULTIMARCA.png"><img src="MULTIMARCA.png" alt="Multimarca"></div><div class="filter-results"></div></div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <button class="accordion-btn">Sucursales <span>+</span></button>
                        <div class="accordion-content">
                            <div class="filter-wrapper"><div class="filter-img-btn sucursal-btn" data-type="sucursal" data-val="logo-REDVITAL.jpg"><img src="logo-REDVITAL.jpg" alt="REDVITAL"></div><div class="filter-results"></div></div>
                            <div class="filter-wrapper"><div class="filter-img-btn sucursal-btn" data-type="sucursal" data-val="logo-LUXOR.jpg"><img src="logo-LUXOR.jpg" alt="LUXOR"></div><div class="filter-results"></div></div>
                            <div class="filter-wrapper"><div class="filter-img-btn sucursal-btn" data-type="sucursal" data-val="logo-KROMI.jpg"><img src="logo-KROMI.jpg" alt="KROMI"></div><div class="filter-results"></div></div>
                            <div class="filter-wrapper"><div class="filter-img-btn sucursal-btn" data-type="sucursal" data-val="logo-GARZON.jpg"><img src="logo-GARZON.jpg" alt="Garzón"></div><div class="filter-results"></div></div>
                        </div>
                    </div>
                </div>

                <div id="info-panel" class="side-panel">
                    <button id="close-info-btn">&times;</button>
                    <div class="panel-header">
                        <div id="panel-subtitle">ESTADO</div>
                        <h2 id="panel-title">Nombre Sucursal</h2>
                    </div>
                    <div id="panel-images" class="panel-images-container"></div>
                    <div class="panel-footer-logo"><img id="panel-logo-img" src="" alt="Logo Aliado"></div>
                </div>
            </div>
        </div>

        <div id="monitor-view" class="spa-view">
            <button id="btn-volver-mapa">Volver al Mapa</button>

            <div class="flip-container" id="flip-container">
                <div class="flipper">
                    
                    <div class="front">
                        <img id="monitor-bg" src="" class="base-img" alt="Exhibidor">
                        
                        <img src="" class="person-img" id="img-1-1">
                        <img src="" class="person-img" id="img-1-2">
                        <img src="" class="person-img" id="img-1-3">
                        <img src="" class="person-img" id="img-1-4">
                        <img src="" class="person-img" id="img-1-5">

                        <img src="" class="person-img" id="img-2-1">
                        <img src="" class="person-img" id="img-2-2">
                        <img src="" class="person-img" id="img-2-3">
                        <img src="" class="person-img" id="img-2-4">
                        <img src="" class="person-img" id="img-2-5">

                        <img src="" class="person-img" id="img-3-1">
                        <img src="" class="person-img" id="img-3-2">
                        <img src="" class="person-img" id="img-3-3">
                        <img src="" class="person-img" id="img-3-4">
                        <img src="" class="person-img" id="img-3-5">

                        <div class="live-overlay" id="live-overlay" style="display: none;">
                            <div class="en-vivo-badge">EN VIVO</div>
                            <div class="live-count" id="live-count">1 persona</div>
                            <div class="live-timer" id="live-timer">0.0</div>
                            <div class="live-datetime" id="live-datetime">--</div>
                        </div>

                        <div class="click-zone left" onclick="flipToChart(1)"></div>
                        <div class="click-zone center" onclick="flipToChart(2)"></div>
                        <div class="click-zone right" onclick="flipToChart(3)"></div>
                    </div>

                    <div class="back">
                        <div class="back-content">
                            <button id="btn-metric" class="icon-btn metric-toggle" title="Cambiar Métrica">
                                <svg id="icon-chrono" viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0012 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
                                <svg id="icon-user" viewBox="0 0 24 24" style="display:none;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            </button>

                            <div class="top-controls">
                                <button id="btn-zoom-out" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/></svg></button>
                                <h1 id="chart-title">YAR-YUR SYSTEM</h1>
                                <button id="btn-zoom-in" class="icon-btn" style="display:none;"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2z"/></svg></button>
                            </div>
                            <div id="chart-subtitle" class="subtitle">HORA: --</div>

            let h = date.getHours(), m = date.getMinutes(), ampm = h >= 12 ? 'pm' : 'am';

        function updateChartDisplay(skipAnimation = false) {

                for(let i=0; i<60; i++) { let d = new Date(date); d.setMinutes(i); labels.push(formatHourAMPM(d, true)); }

                for(let i=1; i<=daysInMonth; i++) labels.push(`${i}`);

            }
            else if (currentViewLevel === 'year') {
                titlePrefix = "AÑO:"; titleSuffix = date.getFullYear().toString();
                labels = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                dataBuckets = new Array(12).fill(0); countBuckets = new Array(12).fill(0);
            }

            const duracionesRealesMap = new Map(); 
            let colaSimulada = [];
            
            events.forEach(ev => {
                const prev = ev.conteoAnterior || 0, act = ev.conteoActual;
                if (act > prev) { for(let k = 0; k < (act - prev); k++) colaSimulada.push(ev); } 
                else if (act < prev) {
                    for(let k = 0; k < (prev - act); k++) {
                        if (colaSimulada.length > 0) {
                            const llegada = colaSimulada.shift();
                            if (!duracionesRealesMap.has(llegada)) duracionesRealesMap.set(llegada, []);
                            duracionesRealesMap.get(llegada).push((ev.timestamp - llegada.timestamp) / 1000);
                        }
                    }
                }
            });

            const now = new Date(); let isCurrentView = false;
            if (currentViewLevel === 'hour') isCurrentView = (date.getHours() === now.getHours() && date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear());
            if (currentViewLevel === 'day') isCurrentView = (date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear());
            if (currentViewLevel === 'month') isCurrentView = (date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear());
            if (currentViewLevel === 'year') isCurrentView = (date.getFullYear() === now.getFullYear());

            events.forEach(ev => {
                const evDate = new Date(ev.timestamp);
                if (currentViewLevel === 'hour' && (evDate.getFullYear() !== date.getFullYear() || evDate.getMonth() !== date.getMonth() || evDate.getDate() !== date.getDate() || evDate.getHours() !== date.getHours())) return;
                if (currentViewLevel === 'day' && (evDate.getFullYear() !== date.getFullYear() || evDate.getMonth() !== date.getMonth() || evDate.getDate() !== date.getDate())) return;
                if (currentViewLevel === 'month' && (evDate.getFullYear() !== date.getFullYear() || evDate.getMonth() !== date.getMonth())) return;
                if (currentViewLevel === 'year' && (evDate.getFullYear() !== date.getFullYear())) return;

                const conteoPrevio = ev.conteoAnterior || 0;
                
                if (ev.conteoActual > conteoPrevio) {
                    const nuevas = ev.conteoActual - conteoPrevio;
                    let idx = 0;
                    if (currentViewLevel === 'hour') idx = evDate.getMinutes();
                    else if (currentViewLevel === 'day') idx = evDate.getHours();
                    else if (currentViewLevel === 'month') idx = evDate.getDate() - 1;
                    else if (currentViewLevel === 'year') idx = evDate.getMonth();

                    if (currentMetric === 'count') { dataBuckets[idx] += nuevas; } 
                    else {
                        const tiempos = duracionesRealesMap.get(ev) || [];
                        for (let k = 0; k < nuevas; k++) {
                            let duracion = (k < tiempos.length) ? tiempos[k] : (isCurrentView ? (Date.now() - ev.timestamp) / 1000 : 0);
                            dataBuckets[idx] += duracion; countBuckets[idx] += 1;
                        }
                    }
                }
            });

            if (currentMetric === 'time') { for(let i = 0; i < dataBuckets.length; i++) { if (countBuckets[i] > 0) dataBuckets[i] = Math.round(dataBuckets[i] / countBuckets[i]); } }

            document.getElementById('chart-subtitle').innerText = `${titlePrefix} ${titleSuffix}`;
            const idxLevel = VIEW_LEVELS.indexOf(currentViewLevel);
            document.getElementById('btn-zoom-in').style.display = idxLevel > 0 ? 'flex' : 'none';
            document.getElementById('btn-zoom-out').style.display = idxLevel < VIEW_LEVELS.length - 1 ? 'flex' : 'none';

            mainChart.data.labels = labels;

            else mainChart.options.animation = { duration: 400, easing: 'easeOutQuart' };

        document.getElementById('btn-metric').addEventListener('click', () => { currentMetric = currentMetric === 'count' ? 'time' : 'count'; document.getElementById('icon-chrono').style.display = currentMetric === 'count' ? 'block' : 'none'; document.getElementById('icon-user').style.display = currentMetric === 'time' ? 'block' : 'none'; updateChartDisplay(); });
        document.getElementById('btn-zoom-out').addEventListener('click', () => { let idx = VIEW_LEVELS.indexOf(currentViewLevel); if (idx < VIEW_LEVELS.length - 1) { currentViewLevel = VIEW_LEVELS[idx + 1]; updateChartDisplay(); } });
        document.getElementById('btn-zoom-in').addEventListener('click', () => { let idx = VIEW_LEVELS.indexOf(currentViewLevel); if (idx > 0) { currentViewLevel = VIEW_LEVELS[idx - 1]; currentViewDate = new Date(); updateChartDisplay(); } });

        function changeTime(direction) { 
            const wrapper = document.getElementById('chart-wrapper');
            wrapper.classList.add(direction < 0 ? 'slide-out-right' : 'slide-out-left');
            setTimeout(() => {
                const d = new Date(currentViewDate);
                if (currentViewLevel === 'hour') d.setHours(d.getHours() + direction);
                if (currentViewLevel === 'day') d.setDate(d.getDate() + direction);
                if (currentViewLevel === 'month') d.setMonth(d.getMonth() + direction);
                if (currentViewLevel === 'year') d.setFullYear(d.getFullYear() + direction);
                currentViewDate = d;
                updateChartDisplay(true); 
                wrapper.classList.remove('slide-out-right', 'slide-out-left');
                wrapper.classList.add(direction < 0 ? 'slide-in-left' : 'slide-in-right');
                setTimeout(() => { wrapper.classList.remove('slide-in-left', 'slide-in-right'); }, 400); 
            }, 400);
        }

        document.getElementById('btn-prev').addEventListener('click', () => changeTime(-1));
        document.getElementById('btn-next').addEventListener('click', () => changeTime(1));

        window.flipToChart = function(zoneId) {
            tabletActualEnGrafico = zoneId;
            currentViewLevel = 'hour'; currentViewDate = new Date(); currentMetric = 'count'; 
            document.getElementById('icon-chrono').style.display = 'block'; document.getElementById('icon-user').style.display = 'none';
            updateChartDisplay();
            document.getElementById('flip-container').classList.add('flipped');
        }

        window.flipToFront = function() {
            document.getElementById('flip-container').classList.remove('flipped');
            setTimeout(() => { tabletActualEnGrafico = null; }, 500); 
        }

        /* --- OVERLAY EN VIVO Y SILUETAS --- */
        function renderTimer() {
            const diff = Date.now() - overlayStartTime;
            document.getElementById('live-timer').innerText = (diff / 1000).toFixed(1);
            const d = new Date();
            document.getElementById('live-datetime').innerText = `${d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' })} | ${d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        }

        function updateLiveOverlay() {
            const total = conteosActuales[1] + conteosActuales[2] + conteosActuales[3];
            const overlayEl = document.getElementById('live-overlay'), countEl = document.getElementById('live-count'), timerEl = document.getElementById('live-timer');

            if (total > 0) {
                clearTimeout(stopTimeout1); clearTimeout(stopTimeout2);
                if (!isOverlayActive) {
                    isOverlayActive = true; overlayEl.classList.remove('fade-out-up'); overlayEl.style.display = 'flex';
                    timerEl.classList.remove('recorded'); overlayStartTime = Date.now(); overlayTimerInterval = setInterval(renderTimer, 47); 
                }
                countEl.innerText = total === 1 ? "1 persona" : `${total} personas`;
            } else {
                if (isOverlayActive) {
                    isOverlayActive = false; clearInterval(overlayTimerInterval); timerEl.classList.add('recorded'); 
                    stopTimeout1 = setTimeout(() => {
                        overlayEl.classList.add('fade-out-up'); 
                        stopTimeout2 = setTimeout(() => { overlayEl.style.display = 'none'; overlayEl.classList.remove('fade-out-up'); }, 500); 
                    }, 1500); 
                }
            }
        }

        function actualizarSiluetas(zoneId, nuevoConteo) {
            const objetivo = Math.min(nuevoConteo, 5); 
            let activasActuales = estadoVisual[zoneId];

            if (objetivo > activasActuales.length) {
                const cantidadAEncender = objetivo - activasActuales.length;
                let inactivas = [1,2,3,4,5].filter(id => !activasActuales.includes(id)).sort(() => Math.random() - 0.5);
                for (let j = 0; j < cantidadAEncender; j++) {
                    const imgId = inactivas[j];
                    if (imgId) { document.getElementById(`img-${zoneId}-${imgId}`).classList.add('active'); activasActuales.push(imgId); }
                }
            } else if (objetivo < activasActuales.length) {
                const cantidadAApagar = activasActuales.length - objetivo;
                activasActuales = activasActuales.sort(() => Math.random() - 0.5);
                const paraApagar = activasActuales.splice(0, cantidadAApagar); 
                for (let j = 0; j < paraApagar.length; j++) { document.getElementById(`img-${zoneId}-${paraApagar[j]}`).classList.remove('active'); }
            }
            estadoVisual[zoneId] = activasActuales; 
        }

    </script>
</body>
