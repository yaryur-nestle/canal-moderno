<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TABLET 03 - ANALÍTICAS</title>
  <style>
    body { margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; color: white; font-family: 'Courier New', Courier, monospace; }
    .scene { position: relative; width: 100vw; height: 100vh; perspective: 1000px; }
    
    .fullscreen-btn {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 150px;
      height: 80px;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
    }

    .card { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
    .card.is-flipped { transform: rotateY(180deg); }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background-color: #000; }
    
    .face-front { background-image: url('TABLET 03.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; }
    .face-back { transform: rotateY(180deg); }
    
    .flip-btn { 
      position: absolute; bottom: 12%; right: 5%; z-index: 50; 
      background: rgba(0, 255, 255, 0.15); border: 1px solid #00FFFF; color: #00FFFF; 
      width: 50px; height: 50px; border-radius: 50%; cursor: pointer; 
      display: flex; justify-content: center; align-items: center; 
      backdrop-filter: blur(5px); box-shadow: 0 0 10px rgba(0, 255, 255, 0.2); 
      transition: all 0.3s ease;
      opacity: 0; 
      pointer-events: none; 
    }
    .card.is-flipped ~ .flip-btn { opacity: 1; pointer-events: auto; }
    .flip-btn:hover { background: rgba(0, 255, 255, 0.4); transform: scale(1.1); box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
    
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { z-index: 10; }
    
    .panel { position: absolute; z-index: 30; display: flex; flex-direction: column; gap: 10px; padding: 20px; }
    .left { top: 0; left: 0; }
    .right { top: 0; right: 0; align-items: flex-end; }
    .counter-box { padding: 10px 20px; border-radius: 4px; font-weight: bold; font-size: 1.1rem; backdrop-filter: blur(8px); border: 1px solid; min-width: 150px; text-shadow: 0 0 5px currentColor; transition: all 0.3s ease; }
    
    #face-counter { background: rgba(0, 255, 0, 0.15); color: #00FF00; border-color: #00FF00; }
    #total-counter { background: rgba(0, 255, 255, 0.15); color: #00FFFF; border-color: #00FFFF; }
    #time-counter { background: rgba(255, 255, 0, 0.15); color: #FFFF00; border-color: #FFFF00; }
    #avg-counter { background: rgba(255, 0, 255, 0.15); color: #FF00FF; border-color: #FF00FF; }
    #barcode-counter { background: rgba(255, 165, 0, 0.25); color: #FFA500; border-color: #FFA500; display: none; transform: scale(1.1); }
    
    /* Retícula de Escaneo para obligar al usuario a alejar el producto */
    #scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 30%;
      border: 2px dashed rgba(255, 165, 0, 0.5);
      border-radius: 10px;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 10px;
      box-sizing: border-box;
      pointer-events: none;
    }
    #scan-guide span {
      color: rgba(255, 165, 0, 0.8);
      font-size: 0.9rem;
      font-weight: bold;
      text-shadow: 0 0 5px black;
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 4px;
    }

    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; background: rgba(0,0,0,0.9); padding: 20px; border: 1px solid #00FFFF; color: #00FFFF; font-weight: bold; font-size: 1.2rem; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="scene">
    <button id="fullscreen-btn" class="fullscreen-btn" title="Pantalla Completa"></button>

    <div id="card" class="card">
      <div class="face face-front">
        <video id="front-video" src="video.mp4" playsinline preload="metadata" style="display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 5; transform: scaleX(1);"></video>
      </div>
      
      <div class="face face-back">
        <div id="loading">SISTEMA INICIANDO...</div>
        
        <div class="panel left">
          <div id="face-counter" class="counter-box">ACTUAL: 0</div>
          <div id="total-counter" class="counter-box">HISTÓRICO: 0</div>
        </div>
        <div class="panel right">
          <div id="time-counter" class="counter-box">TIEMPO: 0.0s</div>
          <div id="avg-counter" class="counter-box">PROMEDIO: 0.0s</div>
          <div id="barcode-counter" class="counter-box">CÓDIGO: ---</div>
        </div>
        
        <div id="scan-guide">
          <span>ALEJE EL CÓDIGO AQUÍ</span>
        </div>

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
    </div>
    
    <button id="flip-btn" class="flip-btn" title="Regresar al Frente">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 11 21 7 17 3"></polyline><line x1="21" y1="7" x2="9" y2="7"></line><polyline points="7 13 3 17 7 21"></polyline><line x1="3" y1="17" x2="15" y2="17"></line>
      </svg>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, push, onDisconnect, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
      authDomain: "canal-moderno-2655e.firebaseapp.com",
      databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
      projectId: "canal-moderno-2655e",
      storageBucket: "canal-moderno-2655e.firebasestorage.app",
      messagingSenderId: "947512040134",
      appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const eventosRef = ref(db, 'muebles/tablet_03/eventos');
    const statusRef = ref(db, 'muebles/tablet_03/status');
    const codigosRef = ref(db, 'muebles/tablet_03/codigos_barra');

    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        onDisconnect(statusRef).set('OFFLINE').then(() => { set(statusRef, 'ONLINE'); });
      }
    });

    // --- AUDIO (BIP) ---
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- DETECTOR NATIVO CON ML KIT ---
    let barcodeDetector;
    try {
      if ('BarcodeDetector' in window) {
        barcodeDetector = new BarcodeDetector();
      } else {
        console.warn('BarcodeDetector no soportado.');
      }
    } catch (e) { console.error('Error init BarcodeDetector:', e); }

    // --- MANEJO DE INTERFAZ ---
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });

    const btnFlip = document.getElementById('flip-btn');
    const card = document.getElementById('card');
    const frontVideo = document.getElementById('front-video');
    let isPlayingVideo = false;
    let systemReady = false;
    setTimeout(() => { systemReady = true; }, 2000);
    
    btnFlip.addEventListener('click', () => { card.classList.remove('is-flipped'); });

    let clickCount = 0;
    let clickTimeout;
    document.addEventListener('click', (e) => {
      initAudio();
      if (card.classList.contains('is-flipped')) return;
      if (e.target !== fullscreenBtn && e.target !== btnFlip) {
        clickCount++;
        clearTimeout(clickTimeout);
        if (clickCount >= 5) {
          card.classList.add('is-flipped');
          clickCount = 0;
          if (isPlayingVideo) {
            frontVideo.pause();
            frontVideo.currentTime = 0;
            frontVideo.style.display = 'none';
            isPlayingVideo = false;
          }
          inicioSesionActual = null;
          tiempoSesionActual = 0;
        } else {
          clickTimeout = setTimeout(() => { clickCount = 0; }, 500);
        }
      }
    });

    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const faceElement = document.getElementById('face-counter');
    const totalElement = document.getElementById('total-counter');
    const timeElement = document.getElementById('time-counter');
    const avgElement = document.getElementById('avg-counter');
    const barcodeBox = document.getElementById('barcode-counter');

    let totalHistorico = 0, tiempoAcumuladoTotal = 0, rostrosActivos = [], inicioSesionActual = null, tiempoSesionActual = 0; 
    let currentFacesCount = 0, lastLoggedFaceCount = 0, pendingFaceCount = 0, stabilityTimer = null;

    frontVideo.addEventListener('ended', () => {
      if (currentFacesCount > 0 && !card.classList.contains('is-flipped')) {
        frontVideo.currentTime = 0;
        frontVideo.play().catch(e => console.error(e));
      } else {
        frontVideo.style.display = 'none';
        isPlayingVideo = false;
      }
    });

    // --- RECONOCIMIENTO FACIAL ---
    function onResults(results) {
      document.getElementById('loading').style.display = 'none';
      if (results.image) { 
        canvasElement.width = results.image.width; 
        canvasElement.height = results.image.height; 
      }
      const rostrosActuales = results.multiFaceLandmarks ? results.multiFaceLandmarks.length : 0;
      const ahora = Date.now();
      currentFacesCount = rostrosActuales;

      if (rostrosActuales !== pendingFaceCount) {
        pendingFaceCount = rostrosActuales;
        clearTimeout(stabilityTimer); 
        stabilityTimer = setTimeout(() => {
          if (pendingFaceCount !== lastLoggedFaceCount) {
            push(eventosRef, { timestamp: Date.now(), fecha: new Date().toISOString(), conteoAnterior: lastLoggedFaceCount, conteoActual: pendingFaceCount });
            set(statusRef, 'ONLINE');
            lastLoggedFaceCount = pendingFaceCount;
          }
        }, 1000); 
      }

      if (rostrosActuales > 0) {
        if (!inicioSesionActual) inicioSesionActual = ahora;
        tiempoSesionActual = (ahora - inicioSesionActual) / 1000;
      } else {
        if (inicioSesionActual) {
          tiempoAcumuladoTotal += (ahora - inicioSesionActual) / 1000;
          inicioSesionActual = null; tiempoSesionActual = 0;
        }
      }

      if (systemReady && currentFacesCount > 0 && tiempoSesionActual >= 1.0 && !isPlayingVideo && !card.classList.contains('is-flipped')) {
        isPlayingVideo = true;
        frontVideo.style.display = 'block';
        frontVideo.play().catch(e => console.log(e));
      }

      if (rostrosActuales > rostrosActivos.length) {
        const nuevosRostros = rostrosActuales - rostrosActivos.length;
        for (let i = 0; i < nuevosRostros; i++) rostrosActivos.push({ startTime: ahora, contado: false });
      } else if (rostrosActuales < rostrosActivos.length) { rostrosActivos.splice(rostrosActuales); }

      for (let i = 0; i < rostrosActivos.length; i++) {
        if (!rostrosActivos[i].contado && (ahora - rostrosActivos[i].startTime >= 2000)) {
          totalHistorico++; rostrosActivos[i].contado = true;
        }
      }

      let promedio = totalHistorico > 0 ? ((tiempoAcumuladoTotal + tiempoSesionActual) / totalHistorico) : 0;
      faceElement.innerText = `ACTUAL: ${rostrosActuales}`;
      totalElement.innerText = `HISTÓRICO: ${totalHistorico}`;
      timeElement.innerText = `TIEMPO: ${tiempoSesionActual.toFixed(1)}s`;
      avgElement.innerText = `PROMEDIO: ${promedio.toFixed(1)}s`;

      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    }

    const faceMesh = new window.FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 5, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(onResults);

    let lastScanTime = 0;
    let lastScannedCode = null;
    let codeCooldownTimer = null;

    // --- CANVAS PARA ZOOM DIGITAL ---
    const zoomCanvas = document.createElement('canvas');
    const zoomCtx = zoomCanvas.getContext('2d', { willReadFrequently: true });

    const camera = new window.Camera(videoElement, { 
      onFrame: async () => { 
        await faceMesh.send({image: videoElement}); 
        
        const ahora = Date.now();
        // Procesamos el código de barras 2 veces por segundo usando el detector Nativo (ML Kit)
        if (barcodeDetector && (ahora - lastScanTime > 500)) {
          lastScanTime = ahora;
          
          if (videoElement.videoWidth > 0) {
            // HACK DE ENFOQUE: Tomamos el centro del video (50% del área) y lo escalamos al tamaño completo.
            // Esto actúa como un "Zoom Digital 2x", permitiendo alejar el producto para que la lente enfoque.
            zoomCanvas.width = videoElement.videoWidth;
            zoomCanvas.height = videoElement.videoHeight;
            
            const sx = videoElement.videoWidth * 0.25;
            const sy = videoElement.videoHeight * 0.25;
            const sWidth = videoElement.videoWidth * 0.5;
            const sHeight = videoElement.videoHeight * 0.5;

            // Dibujamos ese cuadrante central expandido en el canvas
            zoomCtx.drawImage(videoElement, sx, sy, sWidth, sHeight, 0, 0, zoomCanvas.width, zoomCanvas.height);

            try {
              // Le pasamos la imagen procesada y aumentada a la poderosa API Nativa
              const barcodes = await barcodeDetector.detect(zoomCanvas);
              
              if (barcodes.length > 0) {
                const code = barcodes[0].rawValue;
                
                if (code !== lastScannedCode) {
                  lastScannedCode = code;
                  playBeep(); 

                  barcodeBox.style.display = 'block';
                  barcodeBox.innerText = `CÓDIGO: ${code}`;
                  
                  push(codigosRef, {
                    codigo: code,
                    timestamp: ahora,
                    fecha: new Date().toISOString(),
                    metodo: 'ml_kit_zoomed'
                  });

                  clearTimeout(codeCooldownTimer);
                  codeCooldownTimer = setTimeout(() => {
                    lastScannedCode = null;
                    barcodeBox.innerText = `ÚLTIMO: ${code}`;
                  }, 4000);
                }
              }
            } catch (err) {
              // Fallo silencioso de lectura
            }
          }
        }
      }, 
      width: 1280, 
      height: 720 
    });
    camera.start();
  </script>
</body>
</html>
