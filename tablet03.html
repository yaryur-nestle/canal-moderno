<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TABLET 03</title>
  <style>
    body { margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; color: white; font-family: 'Courier New', Courier, monospace; }
    
    /* === BOTÓN FULLSCREEN INICIAL === */
    #init-fullscreen-btn {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; 
      background: transparent; border: none; outline: none; cursor: pointer;
    }

    #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 1000; display: flex; justify-content: center; align-items: center; }
    .login-box { border: 1px solid #00FFFF; padding: 40px; background: rgba(0, 255, 255, 0.05); text-align: center; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); border-radius: 8px; backdrop-filter: blur(10px); width: 300px; }
    .login-box h2 { color: #00FFFF; margin-top: 0; margin-bottom: 25px; text-shadow: 0 0 5px #00FFFF; letter-spacing: 2px; }
    .login-box input { display: block; width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 12px; background: rgba(0, 0, 0, 0.8); border: 1px solid #00FFFF; color: #00FFFF; font-family: inherit; font-size: 1rem; text-align: center; }
    .login-box input:focus { outline: none; box-shadow: 0 0 10px rgba(0, 255, 255, 0.5); background: rgba(0, 255, 255, 0.1); }
    .login-box button { background: rgba(0, 255, 255, 0.15); border: 1px solid #00FFFF; color: #00FFFF; padding: 12px 20px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 1rem; width: 100%; transition: all 0.3s; letter-spacing: 1px; }
    .login-box button:hover { background: #00FFFF; color: #000; box-shadow: 0 0 15px #00FFFF; }
    .error-msg { color: #FF0055; margin-top: 15px; font-size: 0.85rem; display: none; text-shadow: 0 0 5px #FF0055; }

    .scene { position: relative; width: 100vw; height: 100vh; perspective: 1000px; display: none; }
    .fullscreen-btn { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 100; width: 150px; height: 80px; background: transparent; border: none; outline: none; cursor: pointer; }

    .card { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
    .card.is-flipped { transform: rotateY(180deg); }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background-color: #000; }
    
    .face-front { background-image: url('TABLET 03 h.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; }
    .face-back { transform: rotateY(180deg); }

    #overlayReceta {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.6); display: none; 
        justify-content: center; align-items: center; z-index: 50; 
    }
    #imgReceta { max-width: 75%; max-height: 75%; object-fit: contain; }
    
    #videoReceta { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        object-fit: cover; 
        background-color: #000;
        transform: none; display: none; z-index: 55; 
    }
    
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { z-index: 10; }
    .panel { position: absolute; z-index: 30; display: flex; flex-direction: column; gap: 10px; padding: 20px; }
    .left { top: 0; left: 0; }
    .right { top: 0; right: 0; align-items: flex-end; }
    .counter-box { padding: 10px 20px; border-radius: 4px; font-weight: bold; font-size: 1.1rem; backdrop-filter: blur(8px); border: 1px solid; min-width: 150px; text-shadow: 0 0 5px currentColor; }
    #face-counter { background: rgba(0, 255, 0, 0.15); color: #00FF00; border-color: #00FF00; }
    #total-counter { background: rgba(0, 255, 255, 0.15); color: #00FFFF; border-color: #00FFFF; }
    #time-counter { background: rgba(255, 255, 0, 0.15); color: #FFFF00; border-color: #FFFF00; }
    #avg-counter { background: rgba(255, 0, 255, 0.15); color: #FF00FF; border-color: #FF00FF; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; background: rgba(0,0,0,0.9); padding: 20px; border: 1px solid #00FFFF; color: #00FFFF; font-weight: bold; font-size: 1.2rem; }
    
    .flip-btn { position: absolute; bottom: 12%; right: 5%; z-index: 50; background: rgba(0, 255, 255, 0.15); border: 1px solid #00FFFF; color: #00FFFF; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); box-shadow: 0 0 10px rgba(0, 255, 255, 0.2); transition: all 0.3s ease; opacity: 0; pointer-events: none; }
    .card.is-flipped ~ .flip-btn { opacity: 1; pointer-events: auto; }
    .flip-btn:hover { background: rgba(0, 255, 255, 0.4); transform: scale(1.1); box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <button id="init-fullscreen-btn" title="Activar Pantalla Completa"></button>

  <div id="login-screen">
    <div class="login-box">
      <h2>SISTEMA MUEBLE 03</h2>
      <form id="login-form">
        <input type="email" id="email" placeholder="Correo Electrónico" required autocomplete="email">
        <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
        <button type="submit" id="login-btn">AUTENTICAR</button>
        <div id="error-msg" class="error-msg">Error de credenciales.</div>
      </form>
    </div>
  </div>

  <div id="app-screen" class="scene">
    <button id="fullscreen-btn" class="fullscreen-btn" title="Pantalla Completa"></button>

    <div id="card" class="card">
      <div class="face face-front">
        <div id="overlayReceta">
            <img id="imgReceta" src="" alt="Receta">
            <video id="videoReceta" preload="auto" muted playsinline style="background-color: #000;"></video>
        </div>
      </div>
      
      <div class="face face-back">
        <div id="loading">SISTEMA INICIANDO...</div>
        <div class="panel left">
          <div id="face-counter" class="counter-box">ACTUAL: 0</div>
          <div id="total-counter" class="counter-box">HISTÓRICO: 0</div>
        </div>
        <div class="panel right">
          <div id="time-counter" class="counter-box">TIEMPO: 0.0s</div>
          <div id="avg-counter" class="counter-box">PROMEDIO: 0.0s</div>
        </div>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
    </div>
    
    <button id="flip-btn" class="flip-btn" title="Regresar al Frente">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 11 21 7 17 3"></polyline><line x1="21" y1="7" x2="9" y2="7"></line><polyline points="7 13 3 17 7 21"></polyline><line x1="3" y1="17" x2="15" y2="17"></line>
      </svg>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, update, push, onDisconnect, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
      authDomain: "canal-moderno-2655e.firebaseapp.com",
      databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
      projectId: "canal-moderno-2655e",
      storageBucket: "canal-moderno-2655e.firebasestorage.app",
      messagingSenderId: "947512040134",
      appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const eventosRef = ref(db, 'muebles/tablet_03/eventos');
    const statusRef = ref(db, 'muebles/tablet_03/status');
    const estadoActualRef = ref(db, 'muebles/tablet_03/estado_actual'); 
    const connectedRef = ref(db, ".info/connected");

    const initFullscreenBtn = document.getElementById('init-fullscreen-btn');
    initFullscreenBtn.addEventListener('click', () => {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
      initFullscreenBtn.remove();
    });

    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const loginForm = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.style.display = 'none';
        appScreen.style.display = 'block';
        conectarBD();
        iniciarCamaraYReconocimiento();
      } else {
        loginScreen.style.display = 'flex';
        appScreen.style.display = 'none';
      }
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('login-btn');
      
      errorMsg.style.display = 'none';
      loginBtn.innerText = 'CARGANDO...';
      
      signInWithEmailAndPassword(auth, email, password)
        .then(() => { loginBtn.innerText = 'AUTENTICAR'; loginForm.reset(); })
        .catch((error) => {
          loginBtn.innerText = 'AUTENTICAR';
          errorMsg.innerText = "Error: Verifica tus credenciales.";
          errorMsg.style.display = 'block';
        });
    });

    function conectarBD() {
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          onDisconnect(statusRef).set('OFFLINE').then(() => { set(statusRef, 'ONLINE'); });
          // Mantenemos update para no borrar la receta activa si la TV la está mostrando
          onDisconnect(estadoActualRef).update({ hayPersonas: false, conteoActual: 0 });
        }
      });
    }

    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    const btnFlip = document.getElementById('flip-btn');
    const card = document.getElementById('card');
    btnFlip.addEventListener('click', () => { card.classList.remove('is-flipped'); });

    let clickCount = 0;
    let clickTimeout;
    document.addEventListener('click', (e) => {
      if(loginScreen.style.display !== 'none') return;
      if (card.classList.contains('is-flipped')) return;

      if (e.target !== fullscreenBtn && e.target !== btnFlip) {
        clickCount++;
        clearTimeout(clickTimeout);
        if (clickCount >= 5) {
          card.classList.add('is-flipped');
          clickCount = 0;
          inicioSesionActual = null;
          tiempoSesionActual = 0;
        } else {
          clickTimeout = setTimeout(() => { clickCount = 0; }, 500);
        }
      }
    });

    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const overlayReceta = document.getElementById('overlayReceta');
    const imgReceta = document.getElementById('imgReceta');
    const videoReceta = document.getElementById('videoReceta');

    let totalHistorico = 0, tiempoAcumuladoTotal = 0, rostrosActivos = [], inicioSesionActual = null, tiempoSesionActual = 0; 
    let currentFacesCount = 0;
    let lastLoggedFaceCount = 0;
    let pendingFaceCount = 0;
    let stabilityTimer = null;
    let camaraIniciada = false;
    let hayPersonasActual = false;

    let isVideoPlaying = false;
    let estadoRecetaPendiente = "";
    
    let ultimaRecetaProcesada = null;
    let ultimoTimestampScan = null; 

    // Al terminar el video localmente, simplemente marcamos el flag en falso.
    // La TV RECETAS será quien actualice Firebase enviando "" a recetaActiva.
    videoReceta.addEventListener('ended', () => {
        isVideoPlaying = false;
    });

    onValue(estadoActualRef, (snapshot) => {
      const estado = snapshot.val();
      if(!estado) return;

      const nuevaReceta = estado.recetaActiva || "";
      const nuevoTimestamp = estado.timestampReceta || null; 

      if (nuevaReceta !== ultimaRecetaProcesada || (nuevoTimestamp && nuevoTimestamp !== ultimoTimestampScan)) {
          ultimaRecetaProcesada = nuevaReceta;
          ultimoTimestampScan = nuevoTimestamp;
          estadoRecetaPendiente = nuevaReceta;
          
          procesarEstadoReceta(estadoRecetaPendiente);
      }
    });

    function procesarEstadoReceta(recetaActiva) {
      if (recetaActiva && recetaActiva !== "") {
        overlayReceta.style.display = 'flex';
        
        // Comprueba si la receta solicitada corresponde a un video
        if (recetaActiva === "02" || recetaActiva === "03") {
          imgReceta.style.display = 'none'; 
          videoReceta.style.display = 'block';

          // Asignación dinámica: la receta "02" abre el video 1 y la receta "03" el video 2
          // Actualizado a VIDEO_1RECETA.mp4 y VIDEO_2RECETA.mp4 para coincidir con la TV
          const targetVideo = recetaActiva === "02" ? "VIDEO_1RECETA.mp4" : "VIDEO_2RECETA.mp4";

          // Solo actualizamos el src si es diferente para no interrumpir la carga
          if (videoReceta.getAttribute('src') !== targetVideo) {
              videoReceta.src = targetVideo;
          }
          
          videoReceta.pause(); 
          videoReceta.currentTime = 0; 
          
          videoReceta.play().catch(e => console.log("Reproducción automática pendiente:", e));
          
          isVideoPlaying = true; 

        } else {
          // Si es receta en imagen (ej: "01" o "04")
          videoReceta.style.display = 'none';
          videoReceta.pause();
          isVideoPlaying = false;
          
          const newImageSrc = `RECETA${recetaActiva}.png`;
          if (imgReceta.getAttribute('src') !== newImageSrc) {
              imgReceta.src = newImageSrc;
          }
          imgReceta.style.display = 'block';
        }
      } else {
        // Cuando la TV manda limpiar la receta ("")
        overlayReceta.style.display = 'none';
        imgReceta.src = '';
        imgReceta.style.display = 'none';
        videoReceta.style.display = 'none';
        videoReceta.pause();
        isVideoPlaying = false;
      }
    }

    function onResults(results) {
      const loadingEl = document.getElementById('loading');
      if(loadingEl) loadingEl.style.display = 'none';
      
      if (results.image) { 
        canvasElement.width = results.image.width; 
        canvasElement.height = results.image.height; 
      }

      const rostrosActuales = results.multiFaceLandmarks ? results.multiFaceLandmarks.length : 0;
      const ahora = Date.now();
      currentFacesCount = rostrosActuales;

      const personasDetectadas = rostrosActuales > 0;
      
      if (personasDetectadas !== hayPersonasActual || rostrosActuales !== pendingFaceCount) {
        hayPersonasActual = personasDetectadas;
        
        // Usamos update() para NO borrar accidentalmente la recetaActiva de la TV
        update(estadoActualRef, {
            hayPersonas: hayPersonasActual,
            conteoActual: rostrosActuales,
            ultimaActividad: Date.now()
        });
      }

      if (rostrosActuales !== pendingFaceCount) {
        pendingFaceCount = rostrosActuales;
        clearTimeout(stabilityTimer); 
        stabilityTimer = setTimeout(() => {
          if (pendingFaceCount !== lastLoggedFaceCount) {
            push(eventosRef, {
              timestamp: Date.now(),
              fecha: new Date().toISOString(),
              conteoAnterior: lastLoggedFaceCount,
              conteoActual: pendingFaceCount
            });
            set(statusRef, 'ONLINE');
            lastLoggedFaceCount = pendingFaceCount;
          }
        }, 1000); 
      }

      if (rostrosActuales > 0) {
        if (!inicioSesionActual) { inicioSesionActual = ahora; }
        tiempoSesionActual = (ahora - inicioSesionActual) / 1000;
      } else {
        if (inicioSesionActual) {
          tiempoAcumuladoTotal += (ahora - inicioSesionActual) / 1000;
          inicioSesionActual = null; tiempoSesionActual = 0;
        }
      }

      if (rostrosActuales > rostrosActivos.length) {
        const nuevosRostros = rostrosActuales - rostrosActivos.length;
        for (let i = 0; i < nuevosRostros; i++) { rostrosActivos.push({ startTime: ahora, contado: false }); }
      } else if (rostrosActuales < rostrosActivos.length) { rostrosActivos.splice(rostrosActuales); }

      for (let i = 0; i < rostrosActivos.length; i++) {
        if (!rostrosActivos[i].contado && (ahora - rostrosActivos[i].startTime >= 2000)) {
          totalHistorico++; rostrosActivos[i].contado = true;
        }
      }

      document.getElementById('face-counter').innerText = `ACTUAL: ${rostrosActuales}`;
      document.getElementById('total-counter').innerText = `HISTÓRICO: ${totalHistorico}`;
      document.getElementById('time-counter').innerText = `TIEMPO: ${tiempoSesionActual.toFixed(1)}s`;
      document.getElementById('avg-counter').innerText = `PROMEDIO: ${(totalHistorico > 0 ? ((tiempoAcumuladoTotal + tiempoSesionActual) / totalHistorico) : 0).toFixed(1)}s`;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.restore();
    }

    function iniciarCamaraYReconocimiento() {
      if (camaraIniciada) return;
      camaraIniciada = true;
      const faceMesh = new window.FaceMesh({locateFile: (file) => { return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`; }});
      faceMesh.setOptions({ maxNumFaces: 5, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      faceMesh.onResults(onResults);
      const camera = new window.Camera(videoElement, { onFrame: async () => { await faceMesh.send({image: videoElement}); }, width: 1280, height: 720 });
      camera.start();
    }
  </script>
</body>
</html>
