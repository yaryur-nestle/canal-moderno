<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TABLET 03</title>
  <style>
    body { margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; color: white; font-family: 'Courier New', Courier, monospace; }
    .scene { position: relative; width: 100vw; height: 100vh; perspective: 1000px; }
    
    /* --- Botón Pantalla Completa Invisible --- */
    .fullscreen-btn {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100; /* Asegura que esté por encima de todo */
      width: 150px; /* Área táctil de 150px de ancho */
      height: 80px; /* Área táctil de 80px de alto */
      background: transparent; /* Totalmente invisible */
      border: none;
      outline: none;
      cursor: pointer;
    }

    .card { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
    .card.is-flipped { transform: rotateY(180deg); }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background-color: #000; }
    .face-back { transform: rotateY(180deg); background-image: url('imagen.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; }
    .flip-btn { position: absolute; bottom: 20px; right: 20px; z-index: 50; background: rgba(0, 255, 255, 0.15); border: 1px solid #00FFFF; color: #00FFFF; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); box-shadow: 0 0 10px rgba(0, 255, 255, 0.2); transition: all 0.3s ease; }
    .flip-btn:hover { background: rgba(0, 255, 255, 0.4); transform: scale(1.1); box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
    .flip-btn.invisible { opacity: 0 !important; box-shadow: none !important; background: transparent !important; transform: none !important; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { z-index: 10; }
    .panel { position: absolute; z-index: 30; display: flex; flex-direction: column; gap: 10px; padding: 20px; }
    .left { top: 0; left: 0; }
    .right { top: 0; right: 0; align-items: flex-end; }
    .counter-box { padding: 10px 20px; border-radius: 4px; font-weight: bold; font-size: 1.1rem; backdrop-filter: blur(8px); border: 1px solid; min-width: 150px; text-shadow: 0 0 5px currentColor; }
    #face-counter { background: rgba(0, 255, 0, 0.15); color: #00FF00; border-color: #00FF00; }
    #total-counter { background: rgba(0, 255, 255, 0.15); color: #00FFFF; border-color: #00FFFF; }
    #time-counter { background: rgba(255, 255, 0, 0.15); color: #FFFF00; border-color: #FFFF00; }
    #avg-counter { background: rgba(255, 0, 255, 0.15); color: #FF00FF; border-color: #FF00FF; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; background: rgba(0,0,0,0.9); padding: 20px; border: 1px solid #00FFFF; color: #00FFFF; font-weight: bold; font-size: 1.2rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="scene">
    
    <button id="fullscreen-btn" class="fullscreen-btn" title="Pantalla Completa"></button>

    <div id="card" class="card">
      <div class="face face-front">
        <div id="loading">SISTEMA INICIANDO...</div>
        <div class="panel left">
          <div id="face-counter" class="counter-box">ACTUAL: 0</div>
          <div id="total-counter" class="counter-box">HISTÓRICO: 0</div>
        </div>
        <div class="panel right">
          <div id="time-counter" class="counter-box">TIEMPO: 0.0s</div>
          <div id="avg-counter" class="counter-box">PROMEDIO: 0.0s</div>
        </div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
      </div>
      <div class="face face-back"></div>
    </div>
    
    <button id="flip-btn" class="flip-btn" title="Alternar Vista">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 11 21 7 17 3"></polyline><line x1="21" y1="7" x2="9" y2="7"></line><polyline points="7 13 3 17 7 21"></polyline><line x1="3" y1="17" x2="15" y2="17"></line>
      </svg>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onDisconnect, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
      authDomain: "canal-moderno-2655e.firebaseapp.com",
      databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
      projectId: "canal-moderno-2655e",
      storageBucket: "canal-moderno-2655e.firebasestorage.app",
      messagingSenderId: "947512040134",
      appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ESTA LÍNEA DEFINE QUE ES LA TABLET 03
    const muebleRef = ref(db, 'muebles/exhibicion_03/metricas');
    const statusRef = ref(db, 'muebles/exhibicion_03/status');

    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        onDisconnect(statusRef).set('OFFLINE').then(() => { set(statusRef, 'ONLINE'); });
      }
    });

    // --- LÓGICA DE PANTALLA COMPLETA ---
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) { /* IE11 */
          document.msExitFullscreen();
        }
      }
    });

    // --- LÓGICA TRANSICIÓN 3D ---
    const btnFlip = document.getElementById('flip-btn');
    const card = document.getElementById('card');
    btnFlip.addEventListener('click', () => { card.classList.toggle('is-flipped'); btnFlip.classList.toggle('invisible'); });

    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const faceElement = document.getElementById('face-counter');
    const totalElement = document.getElementById('total-counter');
    const timeElement = document.getElementById('time-counter');
    const avgElement = document.getElementById('avg-counter');

    let totalHistorico = 0, tiempoAcumuladoTotal = 0, rostrosActivos = [], inicioSesionActual = null, tiempoSesionActual = 0, lastFirebaseUpdate = 0; 

    get(muebleRef).then((snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        totalHistorico = data.historico || 0;
        tiempoAcumuladoTotal = data.tiempoAcumuladoTotal || 0;
        totalElement.innerText = `HISTÓRICO: ${totalHistorico}`;
      }
    });

    const glowCanvas = document.createElement('canvas'); const glowCtx = glowCanvas.getContext('2d'); const glowSize = 20; const puntoRadius = 2.5; const centro = glowSize / 2;
    glowCanvas.width = glowSize; glowCanvas.height = glowSize;
    glowCtx.shadowColor = '#00FFFF'; glowCtx.shadowBlur = 10; glowCtx.fillStyle = '#00FFFF'; glowCtx.beginPath(); glowCtx.arc(centro, centro, puntoRadius, 0, 2 * Math.PI); glowCtx.fill();

    function onResults(results) {
      document.getElementById('loading').style.display = 'none';
      if (results.image) { canvasElement.width = results.image.width; canvasElement.height = results.image.height; }

      const rostrosActuales = results.multiFaceLandmarks ? results.multiFaceLandmarks.length : 0;
      const ahora = Date.now();

      if (rostrosActuales > rostrosActivos.length) {
        const nuevosRostros = rostrosActuales - rostrosActivos.length;
        for (let i = 0; i < nuevosRostros; i++) { rostrosActivos.push({ startTime: ahora, contado: false }); }
      } else if (rostrosActuales < rostrosActivos.length) { rostrosActivos.splice(rostrosActuales); }

      for (let i = 0; i < rostrosActivos.length; i++) {
        if (!rostrosActivos[i].contado && (ahora - rostrosActivos[i].startTime >= 2000)) {
          totalHistorico++; rostrosActivos[i].contado = true;
        }
      }

      if (rostrosActuales > 0) {
        if (!inicioSesionActual) { inicioSesionActual = ahora; }
        tiempoSesionActual = (ahora - inicioSesionActual) / 1000;
      } else {
        if (inicioSesionActual) {
          tiempoAcumuladoTotal += (ahora - inicioSesionActual) / 1000;
          inicioSesionActual = null; tiempoSesionActual = 0;
        }
      }

      let tiempoTotalParaCalculo = tiempoAcumuladoTotal + tiempoSesionActual;
      let promedio = totalHistorico > 0 ? (tiempoTotalParaCalculo / totalHistorico) : 0;

      faceElement.innerText = `ACTUAL: ${rostrosActuales}`;
      totalElement.innerText = `HISTÓRICO: ${totalHistorico}`;
      timeElement.innerText = `TIEMPO: ${tiempoSesionActual.toFixed(1)}s`;
      avgElement.innerText = `PROMEDIO: ${promedio.toFixed(1)}s`;

      if (ahora - lastFirebaseUpdate >= 3000) {
        set(muebleRef, {
          actual: rostrosActuales, historico: totalHistorico, tiempo: tiempoSesionActual.toFixed(1),
          promedio: promedio.toFixed(1), tiempoAcumuladoTotal: tiempoAcumuladoTotal
        });
        lastFirebaseUpdate = ahora;
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.globalCompositeOperation = "lighter"; 
      
      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          window.drawConnectors(canvasCtx, landmarks, window.FACEMESH_TESSELATION, {color: '#00FF0050', lineWidth: 0.8});
          for (let i = 0; i < landmarks.length; i++) {
            const px = landmarks[i].x * canvasElement.width; const py = landmarks[i].y * canvasElement.height;
            canvasCtx.drawImage(glowCanvas, px - centro, py - centro);
          }
        }
      }
      canvasCtx.restore();
    }

    const faceMesh = new window.FaceMesh({locateFile: (file) => { return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`; }});
    faceMesh.setOptions({ maxNumFaces: 5, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(onResults);
    const camera = new window.Camera(videoElement, { onFrame: async () => { await faceMesh.send({image: videoElement}); }, width: 1280, height: 720 });
    camera.start();
  </script>
</body>
</html>
