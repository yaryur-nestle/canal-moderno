<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal Moderno Nestle</title>
    
    <script src="https://code.highcharts.com/maps/highmaps.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.1/proj4.js"></script>
    <script src="https://code.highcharts.com/mapdata/countries/ve/ve-all.js"></script>
    
    <style>
        /* * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* * ESTÉTICA DEL LIENZO BASE */
        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* * CONTENEDOR DEL MAPA */
        #map-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            z-index: 1;
            overflow: hidden; 
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        /* * CAPA SUPERIOR (No interactiva, decorativa) */
        #capa-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999; 
            pointer-events: none;
            user-select: none; 
            object-fit: cover; 
            opacity: 0.1;
        }

        /* * ESTILIZACIÓN DEL POPUP (Sutil, borde fino) */
        .highcharts-tooltip-box {
            fill: none !important; /* Oculta la caja nativa de Highcharts */
            stroke: none !important;
        }

        /* Contenedor principal de la ventana emergente */
        .custom-hc-popup {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            color: #333333;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            padding: 15px;
            text-align: center;
            pointer-events: auto; /* Permite hacer clic en los enlaces internos */
            min-width: 180px;
        }

        /* * ESTRUCTURA DEL CONTENIDO (IMÁGENES PROTAGONISTAS) */
        .popup-images-grid {
            display: flex;
            justify-content: center;
            gap: 15px; 
            margin-bottom: 12px;
        }

        .popup-images-grid a {
            display: block;
            text-decoration: none;
        }

        .popup-images-grid img {
            width: 150px; 
            height: 150px; 
            object-fit: cover;
            border: 1px solid #e0e0e0; 
            border-radius: 6px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: none; 
            cursor: pointer;
        }

        .popup-images-grid img:hover {
            transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .popup-text-label {
            font-size: 18px; 
            font-weight: 600;
            color: #333333;
            text-transform: none; 
            white-space: nowrap;
            text-align: center; 
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
        <img src="CAPA.png" id="capa-superior" alt="Capa Decorativa Superior">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* * 1. DATOS DE LOS NODOS (SUCURSALES) */
            const retailNodes = [
                { 
                    id: 1, sucursal: "Kromi Market", 
                    lat: 10.2225, lon: -68.0160,
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Kromi_Market_Valencia.html" } ]
                },
                { 
                    id: 2, sucursal: "Redvital San Diego", 
                    lat: 10.2540, lon: -67.9510,
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_San_Diego_Valencia.html" } ]
                },
                { 
                    id: 3, sucursal: "Redvital La Yaguara", 
                    lat: 10.4772, lon: -66.9597,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_La_Yaguara.html" },
                        { src: "RECETAS.png", link: "https://yaryur-nestle.github.io/canal-moderno/RECETAS_Redvital_La_Yaguara.html" }
                    ]
                },
                { 
                    id: 4, sucursal: "Garzón Hiperahorro", 
                    lat: 7.7669, lon: -72.2250,
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Garzon_Hiperahorro_San_Cristobal.html" } ]
                },
                { 
                    id: 5, sucursal: "Luxor Círculo Militar", 
                    lat: 10.2670, lon: -67.5950,
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Luxor_Circulo_Militar_Maracay.html" } ]
                }
            ];

            /* * 2. PREPARACIÓN DEL MAPA BASE DE VENEZUELA */
            const mapData = Highcharts.maps['countries/ve/ve-all'];
            const baseData = mapData.features.map(function(feature, index) {
                return [feature.properties['hc-key'], index];
            });

            /* * 3. INICIALIZACIÓN DEL MAPA DE HIGHCHARTS */
            Highcharts.mapChart('map', {
                chart: {
                    map: 'countries/ve/ve-all',
                    backgroundColor: 'transparent'
                },
                title: { text: null },
                credits: { enabled: false },
                legend: { enabled: false },
                mapNavigation: {
                    enabled: true,
                    buttonOptions: { verticalAlign: 'bottom' }
                },
                
                // Configuración Global para evitar que el mapa se ponga "clarito" (pálido)
                plotOptions: {
                    series: {
                        states: {
                            inactive: {
                                opacity: 1 // ESTA ES LA CLAVE: 1 significa 100% visible siempre
                            }
                        }
                    }
                },
                
                tooltip: {
                    useHTML: true,
                    padding: 0,
                    backgroundColor: 'rgba(255,255,255,0)',
                    borderWidth: 0,
                    shadow: false,
                    distance: 15,
                    stickOnContact: true,
                    hideDelay: 300,
                    followPointer: false,
                    formatter: function() {
                        if (this.series.name === 'Estado') {
                            return false;
                        }

                        let imagesHtml = '<div class="popup-images-grid">';
                        this.point.images.forEach(img => {
                            imagesHtml += `
                                <a href="${img.link}" target="_blank">
                                    <img src="${img.src}" alt="Visitar ${this.point.sucursal}">
                                </a>
                            `;
                        });
                        imagesHtml += '</div>';

                        return `
                            <div class="custom-hc-popup">
                                ${imagesHtml}
                                <div class="popup-text-label">${this.point.sucursal}</div>
                            </div>
                        `;
                    }
                },

                /* * 4. INYECCIÓN DEL ECOSISTEMA (Capas) */
                series: [
                    {
                        data: baseData,
                        name: 'Estado',
                        color: '#daccaa',
                        borderColor: '#ffffff',
                        borderWidth: 1,
                        states: {
                            hover: { enabled: false }
                        },
                        dataLabels: {
                            enabled: true,
                            format: '{point.name}',
                            style: { fontSize: '10px', fontWeight: 'normal', textOutline: 'none', color: '#666' }
                        }
                    },
                    {
                        type: 'mappoint',
                        name: 'Sucursales',
                        data: retailNodes,
                        // CONFIGURACIÓN NATIVA DEL MARCADOR (A prueba de fallos)
                        marker: {
                            symbol: 'circle', // Forma geométrica nativa
                            radius: 8,        // Tamaño del punto
                            fillColor: '#ff2a2a', // Color Rojo
                            lineColor: '#ffffff', // Borde Blanco
                            lineWidth: 2,         // Grosor del borde
                            states: {
                                hover: {
                                    radius: 12, // Crece ligeramente al pasar el mouse (Efecto de interacción)
                                    fillColor: '#ff2a2a'
                                }
                            }
                        }
                        // Hemos eliminado el dataLabels tramposo de la gota CSS para evitar conflictos.
                    }
                ]
            });
        });
    </script>
</body>
</html>
