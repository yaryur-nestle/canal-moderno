<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <script src="https://code.highcharts.com/maps/highmaps.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.1/proj4.js"></script>
    <script src="https://code.highcharts.com/mapdata/countries/ve/ve-all.js"></script>
    
    <style>
        /* * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* * CONTENEDOR PRINCIPAL */
        #app-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative; 
            overflow: hidden; 
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: transparent;
            position: relative;
            z-index: 1;
        }

        /* * CAPA SUPERIOR (No interactiva) */
        #capa-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
            user-select: none; 
            object-fit: cover; 
            opacity: 0.1;
        }

        /* * PANEL LATERAL DE INFORMACIÓN */
        #info-panel {
            position: absolute;
            top: 0;
            right: -350px; 
            width: 320px;
            height: 100%;
            background-color: #ffffff;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 10000; 
            transition: right 0.3s ease-in-out; 
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        #info-panel.active {
            right: 0;
        }

        #close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            font-size: 24px;
            color: #999999;
            cursor: pointer;
            transition: color 0.2s;
            margin-bottom: 5px;
        }

        #close-btn:hover {
            color: #ff2a2a;
        }

        /* Textos del Panel */
        .panel-header {
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        #panel-subtitle {
            font-size: 15px;
            font-weight: bold;
            color: #daccaa; /* Mismo color base del mapa */
            /* Se removió el text-transform: uppercase para respetar las mayúsculas/minúsculas */
            letter-spacing: 0.5px;
            margin-bottom: 15px; /* Más separación respecto al título */
        }

        #panel-title {
            font-size: 22px;
            font-weight: 600;
            color: #333333;
        }

        /* Contenedor de Imágenes */
        .panel-images-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .panel-images-container a {
            display: block;
            text-decoration: none;
            width: 100%;
            text-align: center;
        }

        .panel-images-container img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .panel-images-container img:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="map"></div>
        <img src="CAPA.png" id="capa-superior" alt="Capa Decorativa Superior">
        
        <div id="info-panel">
            <button id="close-btn">&times;</button>
            <div class="panel-header">
                <div id="panel-subtitle">Estado: </div>
                <h2 id="panel-title">Nombre Sucursal</h2>
            </div>
            <div id="panel-images" class="panel-images-container">
                </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            let chartInstance = null;
            const panel = document.getElementById('info-panel');
            const panelSubtitle = document.getElementById('panel-subtitle');
            const panelTitle = document.getElementById('panel-title');
            const panelImages = document.getElementById('panel-images');
            const closeBtn = document.getElementById('close-btn');

            // Función para abrir el panel e inyectar datos
            function abrirPanel(sucursal, images, estadoNombre) {
                panelSubtitle.textContent = `Estado: ${estadoNombre}`;
                panelTitle.textContent = sucursal;
                
                panelImages.innerHTML = ''; 

                images.forEach(img => {
                    const enlace = document.createElement('a');
                    enlace.href = img.link;
                    enlace.target = "_blank"; 
                    
                    const imagen = document.createElement('img');
                    imagen.src = img.src;
                    imagen.alt = `Visitar ${sucursal}`;

                    enlace.appendChild(imagen);
                    panelImages.appendChild(enlace);
                });

                panel.classList.add('active');
            }

            // Función para cerrar el panel y restaurar TODA la estética del mapa
            function cerrarPanel() {
                panel.classList.remove('active');
                
                if (chartInstance) {
                    const stateSeries = chartInstance.get('capa-estados');
                    if (stateSeries) {
                        stateSeries.points.forEach(p => {
                            // Restauramos color base, opacidad y bordes finos blancos
                            p.update({ 
                                color: '#daccaa', 
                                opacity: 1, 
                                borderWidth: 1, 
                                borderColor: '#ffffff' 
                            }, false); 
                        });
                        chartInstance.redraw();
                    }
                }
            }

            closeBtn.addEventListener('click', cerrarPanel);

            /* * 1. DATOS DE LOS NODOS (SUCURSALES) */
            const retailNodes = [
                { 
                    id: 1, sucursal: "Kromi Market", 
                    estadoNombre: "Carabobo", estadoId: "ve-ca", 
                    lat: 10.2225, lon: -68.0160,
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Kromi_Market_Valencia.html" } ]
                },
                { 
                    id: 2, sucursal: "Redvital San Diego", 
                    estadoNombre: "Carabobo", estadoId: "ve-ca",
                    lat: 10.2540, lon: -67.9510,
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_San_Diego_Valencia.html" } ]
                },
                { 
                    id: 3, sucursal: "Redvital La Yaguara", 
                    estadoNombre: "Distrito Capital", 
                    estadoId: "ve-df", // CORREGIDO: Highcharts usa "ve-df" para Distrito Federal/Capital
                    lat: 10.4772, lon: -66.9597,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_La_Yaguara.html" },
                        { src: "RECETAS.png", link: "https://yaryur-nestle.github.io/canal-moderno/RECETAS_Redvital_La_Yaguara.html" }
                    ]
                },
                { 
                    id: 4, sucursal: "Garzón Hiperahorro", 
                    estadoNombre: "Táchira", estadoId: "ve-ta",
                    lat: 7.7669, lon: -72.2250,
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Garzon_Hiperahorro_San_Cristobal.html" } ]
                },
                { 
                    id: 5, sucursal: "Luxor Círculo Militar", 
                    estadoNombre: "Aragua", estadoId: "ve-ar",
                    lat: 10.2670, lon: -67.5950,
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Luxor_Circulo_Militar_Maracay.html" } ]
                }
            ];

            /* * 2. PREPARACIÓN DEL MAPA BASE DE VENEZUELA */
            const mapData = Highcharts.maps['countries/ve/ve-all'];
            const baseData = mapData.features.map(function(feature, index) {
                return [feature.properties['hc-key'], index];
            });

            /* * 3. INICIALIZACIÓN DEL MAPA DE HIGHCHARTS */
            chartInstance = Highcharts.mapChart('map', {
                chart: {
                    map: 'countries/ve/ve-all',
                    backgroundColor: 'transparent',
                    events: {
                        click: function () {
                            cerrarPanel();
                        }
                    }
                },
                title: { text: null },
                credits: { enabled: false },
                legend: { enabled: false },
                mapNavigation: {
                    enabled: true,
                    buttonOptions: { verticalAlign: 'bottom' }
                },
                
                plotOptions: {
                    series: {
                        states: { inactive: { opacity: 1 } },
                        point: {
                            events: {
                                click: function () {
                                    if (this.options && this.options.images) {
                                        
                                        // 1. Abrimos el panel
                                        abrirPanel(this.options.sucursal, this.options.images, this.options.estadoNombre);
                                        
                                        // 2. Aplicamos los nuevos efectos dramáticos
                                        const selectedEstadoId = this.options.estadoId;
                                        const chart = this.series.chart;
                                        const stateSeries = chart.get('capa-estados');
                                        
                                        if (stateSeries) {
                                            stateSeries.points.forEach(p => {
                                                if (p['hc-key'] === selectedEstadoId) {
                                                    // Estado Protagonista: Color más oscuro, sin transparencia, borde negro y grueso
                                                    p.update({ 
                                                        color: '#b39c6e', // Beige oscuro
                                                        opacity: 1, 
                                                        borderWidth: 3, 
                                                        borderColor: '#000000' 
                                                    }, false);
                                                } else {
                                                    // Resto del mapa: Restauramos color original por si acaso y aplicamos 10% de opacidad
                                                    p.update({ 
                                                        color: '#daccaa',
                                                        opacity: 0.1, 
                                                        borderWidth: 1, 
                                                        borderColor: '#ffffff' 
                                                    }, false);
                                                }
                                            });
                                            chart.redraw();
                                        }

                                    } else {
                                        cerrarPanel();
                                    }
                                }
                            }
                        }
                    }
                },
                
                tooltip: { enabled: false },

                /* * 4. INYECCIÓN DEL ECOSISTEMA (Capas) */
                series: [
                    {
                        id: 'capa-estados',
                        data: baseData,
                        name: 'Estado',
                        color: '#daccaa',
                        borderColor: '#ffffff',
                        borderWidth: 1,
                        states: { hover: { enabled: false } },
                        dataLabels: {
                            enabled: true,
                            format: '{point.name}',
                            style: { fontSize: '10px', fontWeight: 'normal', textOutline: 'none', color: '#666' }
                        }
                    },
                    {
                        type: 'mappoint',
                        name: 'Sucursales',
                        data: retailNodes,
                        cursor: 'pointer',
                        marker: {
                            symbol: 'circle',
                            radius: 8,
                            fillColor: '#ff2a2a',
                            lineColor: '#ffffff',
                            lineWidth: 2,
                            states: {
                                hover: {
                                    radius: 12,
                                    fillColor: '#ff2a2a'
                                }
                            }
                        }
                    }
                ]
            });
        });
    </script>
</body>
</html>
