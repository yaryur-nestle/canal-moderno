<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <script src="https://code.highcharts.com/maps/highmaps.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.1/proj4.js"></script>
    <script src="https://code.highcharts.com/mapdata/countries/ve/ve-all.js"></script>
    
    <style>
        /* * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* * CONTENEDOR PRINCIPAL */
        #app-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative; 
            overflow: hidden; 
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: transparent;
            position: relative;
            z-index: 1;
        }

        #capa-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
            user-select: none; 
            object-fit: cover; 
            opacity: 0.1;
        }

        /* * BOTÓN DE HAMBURGUESA / FLECHA */
        #hamburger-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 22px;
            cursor: pointer;
            z-index: 10002; /* Por encima de los paneles */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: none;
            border: none;
            padding: 0;
        }

        #hamburger-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #b39c6e; /* Beige oscuro para que se vea bien */
            border-radius: 3px;
            transition: all 0.3s ease-in-out;
            transform-origin: right center;
        }

        /* Animación a Flecha (->) */
        #hamburger-btn.open span:nth-child(1) {
            transform: rotate(-45deg) translateY(-2px);
            width: 16px;
        }
        #hamburger-btn.open span:nth-child(2) {
            transform: scaleX(1); /* Mantiene el centro como el palo de la flecha */
        }
        #hamburger-btn.open span:nth-child(3) {
            transform: rotate(45deg) translateY(2px);
            width: 16px;
        }

        /* * PANELES LATERALES (Clase compartida) */
        .side-panel {
            position: absolute;
            top: 0;
            right: -350px; 
            width: 320px;
            height: 100%;
            background-color: #ffffff;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 10000; 
            transition: right 0.3s ease-in-out; 
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-top: 60px; /* Espacio para el botón hamburguesa */
            overflow-y: auto;
        }

        .side-panel.active {
            right: 0;
        }

        /* * PANEL DE INFORMACIÓN (Puntos Rojos) */
        #close-info-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: none;
            border: none;
            font-size: 28px;
            color: #999999;
            cursor: pointer;
            transition: color 0.2s;
        }

        #close-info-btn:hover { color: #ff2a2a; }

        .panel-header {
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        #panel-subtitle {
            font-size: 15px;
            font-weight: bold;
            color: #daccaa; 
            letter-spacing: 0.5px;
            margin-bottom: 15px; 
        }

        #panel-title {
            font-size: 22px;
            font-weight: 600;
            color: #333333;
        }

        .panel-images-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .panel-images-container a {
            display: block;
            text-decoration: none;
            width: 100%;
            text-align: center;
        }

        .panel-images-container img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .panel-images-container img:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* Footer del Logo del Aliado Comercial */
        .panel-footer-logo {
            margin-top: auto; /* Empuja el footer siempre hacia el fondo */
            padding-top: 25px;
            text-align: center;
        }

        #panel-logo-img {
            max-width: 180px;
            max-height: 80px;
            object-fit: contain;
        }

        /* * PANEL DE MENÚ (Hamburguesa / Filtros) */
        .accordion-btn {
            background: none;
            border: none;
            border-bottom: 2px solid #f0f0f0;
            font-size: 20px;
            font-weight: 600;
            color: #daccaa; /* Color beige del mapa */
            width: 100%;
            text-align: left;
            padding: 15px 5px;
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: color 0.2s;
        }

        .accordion-btn:hover { color: #b39c6e; }

        .accordion-content {
            display: none; 
            flex-direction: column;
            gap: 15px;
            padding: 20px 0;
        }

        .accordion-content.open { display: flex; }

        /* Botones de las imágenes en el menú */
        .filter-img-btn {
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background-color: #fcfcfc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .filter-img-btn img {
            max-width: 100%;
            height: 60px;
            object-fit: contain;
        }

        .filter-img-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
        }

        .filter-img-btn.active-filter {
            border-color: #b39c6e;
            background-color: #fdfbf7;
        }

    </style>
</head>
<body>

    <div id="app-container">
        <div id="map"></div>
        <img src="CAPA.png" id="capa-superior" alt="Capa Decorativa Superior">
        
        <button id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div id="nav-panel" class="side-panel">
            <h2 style="color: #333; margin-bottom: 20px; font-size: 22px;">Filtros de Búsqueda</h2>
            
            <div class="accordion-item">
                <button class="accordion-btn">Marcas <span>+</span></button>
                <div class="accordion-content">
                    <div class="filter-img-btn" data-type="marca" data-val="NIDO.png">
                        <img src="NIDO.png" alt="NIDO">
                    </div>
                    <div class="filter-img-btn" data-type="marca" data-val="RECETAS.png">
                        <img src="RECETAS.png" alt="RECETAS">
                    </div>
                    <div class="filter-img-btn" data-type="marca" data-val="MULTIMARCA.png">
                        <img src="MULTIMARCA.png" alt="Multimarca">
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <button class="accordion-btn">Sucursales <span>+</span></button>
                <div class="accordion-content">
                    <div class="filter-img-btn" data-type="sucursal" data-val="logo-REDVITAL.jpg">
                        <img src="logo-REDVITAL.jpg" alt="REDVITAL">
                    </div>
                    <div class="filter-img-btn" data-type="sucursal" data-val="logo-LUXOR.jpg">
                        <img src="logo-LUXOR.jpg" alt="LUXOR">
                    </div>
                    <div class="filter-img-btn" data-type="sucursal" data-val="logo-KROMI.jpg">
                        <img src="logo-KROMI.jpg" alt="KROMI">
                    </div>
                    <div class="filter-img-btn" data-type="sucursal" data-val="logo-GARZON.jpg">
                        <img src="logo-GARZON.jpg" alt="Garzón">
                    </div>
                </div>
            </div>
        </div>

        <div id="info-panel" class="side-panel">
            <button id="close-info-btn">&times;</button>
            <div class="panel-header">
                <div id="panel-subtitle">Estado: </div>
                <h2 id="panel-title">Nombre Sucursal</h2>
            </div>
            <div id="panel-images" class="panel-images-container">
                </div>
            <div class="panel-footer-logo">
                <img id="panel-logo-img" src="" alt="Logo Aliado">
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            let chartInstance = null;
            
            // Referencias DOM
            const navPanel = document.getElementById('nav-panel');
            const infoPanel = document.getElementById('info-panel');
            const hamburgerBtn = document.getElementById('hamburger-btn');
            const closeInfoBtn = document.getElementById('close-info-btn');

            /* * 1. DATOS DE LOS NODOS (¡Ahora con Logo Integrado!) */
            const retailNodes = [
                { 
                    id: 1, sucursal: "Kromi Market", 
                    estadoNombre: "Carabobo", estadoId: "ve-ca", 
                    lat: 10.2225, lon: -68.0160,
                    logo: "logo-KROMI.jpg",
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Kromi_Market_Valencia.html" } ]
                },
                { 
                    id: 2, sucursal: "Redvital San Diego", 
                    estadoNombre: "Carabobo", estadoId: "ve-ca",
                    lat: 10.2540, lon: -67.9510,
                    logo: "logo-REDVITAL.jpg",
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_San_Diego_Valencia.html" } ]
                },
                { 
                    id: 3, sucursal: "Redvital La Yaguara", 
                    estadoNombre: "Distrito Capital", estadoId: "ve-df",
                    lat: 10.4772, lon: -66.9597,
                    logo: "logo-REDVITAL.jpg",
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_La_Yaguara.html" },
                        { src: "RECETAS.png", link: "https://yaryur-nestle.github.io/canal-moderno/RECETAS_Redvital_La_Yaguara.html" }
                    ]
                },
                { 
                    id: 4, sucursal: "Garzón Hiperahorro", 
                    estadoNombre: "Táchira", estadoId: "ve-ta",
                    lat: 7.7669, lon: -72.2250,
                    logo: "logo-GARZON.jpg",
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Garzon_Hiperahorro_San_Cristobal.html" } ]
                },
                { 
                    id: 5, sucursal: "Luxor Círculo Militar", 
                    estadoNombre: "Aragua", estadoId: "ve-ar",
                    lat: 10.2670, lon: -67.5950,
                    logo: "logo-LUXOR.jpg",
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Luxor_Circulo_Militar_Maracay.html" } ]
                }
            ];

            /* * CONTROLADOR CENTRAL DE LUCES DEL MAPA */
            function iluminarEstados(arrayDeEstadosActivos) {
                if (!chartInstance) return;
                const stateSeries = chartInstance.get('capa-estados');
                if (stateSeries) {
                    stateSeries.points.forEach(p => {
                        if (arrayDeEstadosActivos.length === 0) {
                            // Si el arreglo está vacío, APAGAMOS EL FILTRO (Mapa Normal)
                            p.update({ color: '#daccaa', opacity: 1, borderWidth: 1, borderColor: '#ffffff' }, false);
                        } else {
                            if (arrayDeEstadosActivos.includes(p['hc-key'])) {
                                // ESTADOS QUE COINCIDEN CON EL FILTRO
                                p.update({ color: '#b39c6e', opacity: 1, borderWidth: 3, borderColor: '#000000' }, false);
                            } else {
                                // ESTADOS RESTANTES: Efecto teatro 10%
                                p.update({ color: '#daccaa', opacity: 0.1, borderWidth: 1, borderColor: '#ffffff' }, false);
                            }
                        }
                    });
                    chartInstance.redraw();
                }
            }

            /* * LÓGICA DE APERTURA/CIERRE DE PANELES */
            function abrirMenuFiltros() {
                infoPanel.classList.remove('active'); // Oculta info si estaba abierta
                navPanel.classList.add('active');
                hamburgerBtn.classList.add('open');
            }

            function cerrarPanelesYResetear() {
                navPanel.classList.remove('active');
                infoPanel.classList.remove('active');
                hamburgerBtn.classList.remove('open');
                
                // Quitamos bordes visuales de los botones de filtro
                document.querySelectorAll('.filter-img-btn').forEach(b => b.classList.remove('active-filter'));
                
                // Reseteamos el mapa a su estado original
                iluminarEstados([]);
            }

            function abrirPanelInfo(sucursal, images, estadoNombre, logo) {
                // Cerramos menú de filtros si estaba abierto
                navPanel.classList.remove('active');
                hamburgerBtn.classList.remove('open');

                // Inyectamos textos e imágenes
                document.getElementById('panel-subtitle').textContent = `Estado: ${estadoNombre}`;
                document.getElementById('panel-title').textContent = sucursal;
                document.getElementById('panel-logo-img').src = logo; // Inyecta el logo en el footer
                
                const panelImages = document.getElementById('panel-images');
                panelImages.innerHTML = ''; 
                images.forEach(img => {
                    const enlace = document.createElement('a');
                    enlace.href = img.link;
                    enlace.target = "_blank"; 
                    const imagen = document.createElement('img');
                    imagen.src = img.src;
                    enlace.appendChild(imagen);
                    panelImages.appendChild(enlace);
                });

                // Mostramos el panel de info
                infoPanel.classList.add('active');
            }

            // EVENTOS DE LOS BOTONES DE CIERRE/APERTURA
            hamburgerBtn.addEventListener('click', () => {
                if (hamburgerBtn.classList.contains('open')) {
                    cerrarPanelesYResetear(); // Si era flechita, cierra y resetea
                } else {
                    abrirMenuFiltros(); // Si eran 3 rayas, abre menú
                }
            });

            closeInfoBtn.addEventListener('click', cerrarPanelesYResetear);

            /* * LÓGICA DEL ACORDEÓN DE MENÚ */
            document.querySelectorAll('.accordion-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const content = this.nextElementSibling;
                    const span = this.querySelector('span');
                    
                    if (content.classList.contains('open')) {
                        content.classList.remove('open');
                        span.textContent = '+';
                    } else {
                        content.classList.add('open');
                        span.textContent = '-';
                    }
                });
            });

            /* * LÓGICA DE FILTRADO POR MARCA O SUCURSAL */
            document.querySelectorAll('.filter-img-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Quitar estilo activo de todos y ponérselo al seleccionado
                    document.querySelectorAll('.filter-img-btn').forEach(b => b.classList.remove('active-filter'));
                    this.classList.add('active-filter');

                    const type = this.getAttribute('data-type'); // "marca" o "sucursal"
                    const val = this.getAttribute('data-val');   // ej: "NIDO.png" o "logo-REDVITAL.jpg"
                    
                    let estadosAEncender = new Set(); // Set evita duplicados automáticamente

                    retailNodes.forEach(node => {
                        if (type === 'marca') {
                            // Busca si alguna imagen de la sucursal coincide con la marca seleccionada
                            if (node.images.some(img => img.src === val)) {
                                estadosAEncender.add(node.estadoId);
                            }
                        } else if (type === 'sucursal') {
                            // Busca si el logo de la sucursal coincide
                            if (node.logo === val) {
                                estadosAEncender.add(node.estadoId);
                            }
                        }
                    });

                    // Mandamos la orden a las luces del mapa
                    iluminarEstados(Array.from(estadosAEncender));
                });
            });


            /* * PREPARACIÓN DEL MAPA BASE DE HIGHCHARTS */
            const mapData = Highcharts.maps['countries/ve/ve-all'];
            const baseData = mapData.features.map(function(feature, index) {
                return [feature.properties['hc-key'], index];
            });

            chartInstance = Highcharts.mapChart('map', {
                chart: {
                    map: 'countries/ve/ve-all',
                    backgroundColor: 'transparent',
                    events: {
                        click: function () {
                            cerrarPanelesYResetear(); // Si toca el agua o un espacio vacío, resetea todo.
                        }
                    }
                },
                title: { text: null },
                credits: { enabled: false },
                legend: { enabled: false },
                mapNavigation: {
                    enabled: true,
                    buttonOptions: { verticalAlign: 'bottom' }
                },
                
                plotOptions: {
                    series: {
                        states: { inactive: { opacity: 1 } },
                        point: {
                            events: {
                                click: function () {
                                    if (this.options && this.options.images) {
                                        // 1. Abrimos el panel de información pasando también el LOGO
                                        abrirPanelInfo(
                                            this.options.sucursal, 
                                            this.options.images, 
                                            this.options.estadoNombre,
                                            this.options.logo // <- AQUÍ ENVIAMOS EL LOGO AL PANEL
                                        );
                                        
                                        // 2. Iluminamos SOLAMENTE el estado del punto rojo que se tocó
                                        iluminarEstados([this.options.estadoId]);
                                    } else {
                                        // Tocó un estado de la tierra directamente
                                        cerrarPanelesYResetear();
                                    }
                                }
                            }
                        }
                    }
                },
                
                tooltip: { enabled: false },

                series: [
                    {
                        id: 'capa-estados',
                        data: baseData,
                        name: 'Estado',
                        color: '#daccaa',
                        borderColor: '#ffffff',
                        borderWidth: 1,
                        states: { hover: { enabled: false } },
                        dataLabels: {
                            enabled: true,
                            format: '{point.name}',
                            style: { fontSize: '10px', fontWeight: 'normal', textOutline: 'none', color: '#666' }
                        }
                    },
                    {
                        type: 'mappoint',
                        name: 'Sucursales',
                        data: retailNodes,
                        cursor: 'pointer',
                        marker: {
                            symbol: 'circle',
                            radius: 8,
                            fillColor: '#ff2a2a',
                            lineColor: '#ffffff',
                            lineWidth: 2,
                            states: { hover: { radius: 12, fillColor: '#ff2a2a' } }
                        }
                    }
                ]
            });
        });
    </script>
</body>
</html>
