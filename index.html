<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <script src="https://code.highcharts.com/maps/highmaps.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.1/proj4.js"></script>
    <script src="https://code.highcharts.com/mapdata/countries/ve/ve-all.js"></script>
    
    <style>
        /* * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #map-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            z-index: 1;
            overflow: hidden; 
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        #capa-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999; 
            pointer-events: none;
            user-select: none; 
            object-fit: cover; 
            opacity: 0.1;
        }

        /* * ESTILIZACIÓN DEL POPUP */
        .highcharts-tooltip-box {
            fill: none !important; 
            stroke: none !important;
        }

        .custom-hc-popup {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            color: #333333;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            padding: 15px;
            text-align: center;
            pointer-events: auto; /* IMPORTANTE para permitir clics */
            min-width: 180px;
        }

        .popup-images-grid {
            display: flex;
            justify-content: center;
            gap: 15px; 
            margin-bottom: 12px;
        }

        .popup-images-grid a {
            display: block;
            text-decoration: none;
        }

        .popup-images-grid img {
            width: 150px; 
            height: 150px; 
            object-fit: cover;
            border: 1px solid #e0e0e0; 
            border-radius: 6px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .popup-images-grid img:hover {
            transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .popup-text-label {
            font-size: 18px; 
            font-weight: 600;
            color: #333333;
            text-transform: none; 
            white-space: nowrap;
            text-align: center; 
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
        <img src="CAPA.png" id="capa-superior" alt="Capa Decorativa Superior">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* * 1. DATOS DE LOS NODOS (SUCURSALES) */
            const retailNodes = [
                { 
                    id: 1, sucursal: "Kromi Market", 
                    lat: 10.2225, lon: -68.0160,
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Kromi_Market_Valencia.html" } ]
                },
                { 
                    id: 2, sucursal: "Redvital San Diego", 
                    lat: 10.2540, lon: -67.9510,
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_San_Diego_Valencia.html" } ]
                },
                { 
                    id: 3, sucursal: "Redvital La Yaguara", 
                    lat: 10.4772, lon: -66.9597,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_La_Yaguara.html" },
                        { src: "RECETAS.png", link: "https://yaryur-nestle.github.io/canal-moderno/RECETAS_Redvital_La_Yaguara.html" }
                    ]
                },
                { 
                    id: 4, sucursal: "Garzón Hiperahorro", 
                    lat: 7.7669, lon: -72.2250,
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Garzon_Hiperahorro_San_Cristobal.html" } ]
                },
                { 
                    id: 5, sucursal: "Luxor Círculo Militar", 
                    lat: 10.2670, lon: -67.5950,
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Luxor_Circulo_Militar_Maracay.html" } ]
                }
            ];

            /* * 2. PREPARACIÓN DEL MAPA BASE DE VENEZUELA */
            const mapData = Highcharts.maps['countries/ve/ve-all'];
            const baseData = mapData.features.map(function(feature, index) {
                return [feature.properties['hc-key'], index];
            });

            /* * 3. INICIALIZACIÓN DEL MAPA DE HIGHCHARTS */
            Highcharts.mapChart('map', {
                chart: {
                    map: 'countries/ve/ve-all',
                    backgroundColor: 'transparent'
                },
                title: { text: null },
                credits: { enabled: false },
                legend: { enabled: false },
                mapNavigation: {
                    enabled: true,
                    buttonOptions: { verticalAlign: 'bottom' }
                },
                
                plotOptions: {
                    series: {
                        states: { inactive: { opacity: 1 } }
                    }
                },
                
                // LA MAGIA DE LA VENTANA INTERACTIVA ESTÁ AQUÍ
                tooltip: {
                    useHTML: true,
                    padding: 0,
                    backgroundColor: 'rgba(255,255,255,0)',
                    borderWidth: 0,
                    shadow: false,
                    distance: 15,
                    stickOnContact: true, // Permite mover el mouse hacia la ventana sin que se cierre
                    hideDelay: 400, // Tiempo de gracia antes de ocultarse
                    followPointer: false,
                    style: {
                        pointerEvents: 'auto' // CRÍTICO: Permite hacer clic en la ventana
                    },
                    formatter: function() {
                        // Ignoramos el fondo del mapa
                        if (this.series.name === 'Estado') return false;

                        // Extraemos las propiedades personalizadas de manera segura
                        const opciones = this.point.options;
                        
                        // Si por alguna razón un punto no tiene imágenes, no rompemos el código
                        if (!opciones.images) return false;

                        let imagesHtml = '<div class="popup-images-grid">';
                        opciones.images.forEach(img => {
                            imagesHtml += `
                                <a href="${img.link}" target="_blank">
                                    <img src="${img.src}" alt="Visitar ${opciones.sucursal}">
                                </a>
                            `;
                        });
                        imagesHtml += '</div>';

                        return `
                            <div class="custom-hc-popup">
                                ${imagesHtml}
                                <div class="popup-text-label">${opciones.sucursal}</div>
                            </div>
                        `;
                    }
                },

                /* * 4. INYECCIÓN DEL ECOSISTEMA (Capas) */
                series: [
                    {
                        data: baseData,
                        name: 'Estado',
                        color: '#daccaa',
                        borderColor: '#ffffff',
                        borderWidth: 1,
                        states: { hover: { enabled: false } },
                        dataLabels: {
                            enabled: true,
                            format: '{point.name}',
                            style: { fontSize: '10px', fontWeight: 'normal', textOutline: 'none', color: '#666' }
                        }
                    },
                    {
                        type: 'mappoint',
                        name: 'Sucursales',
                        data: retailNodes,
                        cursor: 'pointer', // Cambia el cursor a "mano" al pasar sobre el punto rojo
                        marker: {
                            symbol: 'circle',
                            radius: 8,
                            fillColor: '#ff2a2a',
                            lineColor: '#ffffff',
                            lineWidth: 2,
                            states: {
                                hover: {
                                    radius: 12, // Crece para dar respuesta visual
                                    fillColor: '#ff2a2a'
                                }
                            }
                        }
                    }
                ]
            });
        });
    </script>
</body>
</html>
