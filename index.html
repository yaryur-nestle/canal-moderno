<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        /* * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* * ESTÉTICA DEL LIENZO BASE */
        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* * CONTENEDOR DEL MAPA (VIÑETA DE CÓMIC) */
        #map-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 6px solid #000000;
            border-radius: 20px;
            box-shadow: 15px 15px 0px #000000;
            position: relative;
            z-index: 1;
        }

        /* Instancia interna donde el motor SVG operará */
        #map {
            width: 100%;
            height: 100%;
            border-radius: 14px; 
            background-color: transparent;
        }

        /* * INGENIERÍA DE MARCADORES PERSONALIZADOS (L.divIcon) */
        .custom-leaflet-icon {
            background: transparent !important;
            border: none !important;
        }

        /* * DISEÑO DEL PIN CARICATURESCO (GOTA INVERTIDA) */
        .comic-marker-pin {
            width: 32px;
            height: 32px;
            background-color: #ff2a2a; 
            border: 4px solid #000000; 
            /* Esto crea la forma de gota: 3 esquinas redondeadas y 1 puntiaguda */
            border-radius: 50% 50% 50% 0; 
            /* Rotamos para que la punta apunte hacia abajo */
            transform: rotate(-45deg);
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,1));
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* Círculo interior blanco del pin */
        .comic-marker-pin::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            /* Ajuste de centrado tomando en cuenta la rotación del padre */
            transform: translate(-50%, -50%);
        }

        /* * MICRO-INTERACCIONES (HOVER STATE DEL PIN) */
        .custom-leaflet-icon:hover .comic-marker-pin {
            transform: rotate(-45deg) scale(1.3);
            background-color: #ffd700; 
            z-index: 1000 !important;
        }

        /* * ESTILIZACIÓN DEL POPUP */
        .leaflet-popup-content-wrapper {
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 15px;
            color: #000000;
            font-family: inherit;
            box-shadow: 8px 8px 0px #000000; 
            padding: 0;
        }

        /* Ocultar la flecha nativa y el botón de cierre */
        .leaflet-popup-tip-container {
            display: none;
        }
        .leaflet-popup-close-button {
            display: none !important;
        }

        .leaflet-popup-content {
            margin: 15px;
            text-align: center;
            /* Asegura que el popup tenga un ancho mínimo generoso para las imágenes */
            min-width: 220px !important; 
        }

        /* * ESTRUCTURA INTERNA DEL CONTENIDO DEL POPUP (IMÁGENES MÁS GRANDES) */
        .popup-images-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
            width: 100%;
        }

        .popup-images-grid a {
            display: block;
            flex: 1 1 auto; /* Permite que las imágenes se expandan a lo ancho */
            width: 100%;
        }

        .popup-images-grid img {
            width: 100%;
            aspect-ratio: 1 / 1; /* Fuerza a que sean perfectamente cuadradas */
            object-fit: cover;
            border: 4px solid #000000;
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 4px 4px 0px rgba(0,0,0,1);
            cursor: pointer;
        }

        .popup-images-grid img:hover {
            transform: translateY(-4px); /* Pequeño salto hacia arriba */
            box-shadow: 6px 8px 0px rgba(0,0,0,1);
        }

        .popup-text-label {
            font-size: 18px; 
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* * 1. INICIALIZACIÓN DEL MAPA */
            const map = L.map('map', {
                center: [7.5, -66.0],     
                zoom: 6,                  
                zoomControl: true,        
                attributionControl: false 
            });

            /* * 2. MOTOR DE RENDERIZADO (TILE LAYER) */
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            /* * 3. MODELADO DE DATOS: INTEGRANDO IMÁGENES Y ENLACES (Corrección "Redvital") */
            const retailNodes = [
                { 
                    id: 1, 
                    sucursal: "Kromi Market", 
                    lat: 10.2225, lng: -68.0160,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Kromi_Market_Valencia.html" }
                    ]
                },
                { 
                    id: 2, 
                    sucursal: "Redvital San Diego", 
                    lat: 10.2540, lng: -67.9510,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_San_Diego_Valencia.html" }
                    ]
                },
                { 
                    id: 3, 
                    sucursal: "Redvital La Yaguara", 
                    lat: 10.4772, lng: -66.9597,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_La_Yaguara.html" },
                        { src: "RECETAS.png", link: "https://yaryur-nestle.github.io/canal-moderno/RECETAS_Redvital_La_Yaguara.html" }
                    ]
                },
                { 
                    id: 4, 
                    sucursal: "Garzón Hiperahorro", 
                    lat: 7.7669, lng: -72.2250,
                    images: [
                        { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Garzon_Hiperahorro_San_Cristobal.html" }
                    ]
                },
                { 
                    id: 5, 
                    sucursal: "Luxor Círculo Militar", 
                    lat: 10.2670, lng: -67.5950,
                    images: [
                        { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Luxor_Circulo_Militar_Maracay.html" }
                    ]
                }
            ];

            /* * 4. INYECCIÓN DEL ECOSISTEMA DE MARCADORES Y POPUPS */
            retailNodes.forEach(node => {
                
                // Nueva configuración del Icono para la forma de Gota
                const customPin = L.divIcon({
                    className: 'custom-leaflet-icon',
                    html: '<div class="comic-marker-pin"></div>',
                    iconSize: [32, 32], 
                    iconAnchor: [16, 32], // Ancla en la punta inferior central
                    popupAnchor: [0, -36] // El popup nace justo por encima de la punta
                });

                const marker = L.marker([node.lat, node.lng], { icon: customPin }).addTo(map);

                // Construcción dinámica de la cuadrícula de imágenes interactiva
                let imagesHtml = '<div class="popup-images-grid">';
                node.images.forEach(img => {
                    imagesHtml += `
                        <a href="${img.link}" target="_blank">
                            <img src="${img.src}" alt="Visitar ${node.sucursal}">
                        </a>
                    `;
                });
                imagesHtml += '</div>';

                // Ensamblaje del contenido HTML del Popup
                const popupContent = `
                    <div>
                        ${imagesHtml}
                        <div class="popup-text-label">${node.sucursal}</div>
                    </div>
                `;

                // Configuración del Popup
                marker.bindPopup(popupContent, {
                    offset: [0, -10]
                });
                
                // Opcional: Hacer que el popup también se abra al pasar el cursor
                marker.on('mouseover', function (e) {
                    this.openPopup();
                });
            });
            
        });
    </script>
</body>
</html>
