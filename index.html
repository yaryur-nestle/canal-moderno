<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        /* * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* * ESTÉTICA DEL LIENZO BASE */
        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* * CONTENEDOR DEL MAPA */
        #map-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 6px solid #000000;
            border-radius: 20px;
            box-shadow: 15px 15px 0px #000000;
            position: relative;
            z-index: 1;
            overflow: hidden; 
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 14px; 
            background-color: transparent;
        }

        /* * CAPA SUPERIOR (No interactiva) */
        #capa-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999; 
            pointer-events: none; /* Ignora clics, permite interactuar con lo de abajo */
            user-select: none; 
            object-fit: cover; 
        }

        /* * INGENIERÍA DE MARCADORES (L.divIcon) */
        .custom-leaflet-icon {
            background: transparent !important;
            border: none !important;
        }

        /* * DISEÑO DE LA GOTA DE UBICACIÓN (SIN SOMBRA) */
        .comic-marker-pin {
            width: 32px;
            height: 32px;
            background-color: #ff2a2a; 
            border: 4px solid #000000; 
            border-radius: 50% 50% 50% 0; 
            transform: rotate(-45deg);
            /* Se eliminó la sombra a petición (filter: drop-shadow...) */
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* Círculo interior blanco */
        .comic-marker-pin::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* * MICRO-INTERACCIONES (HOVER DEL PIN) */
        .custom-leaflet-icon:hover .comic-marker-pin {
            transform: rotate(-45deg) scale(1.3);
            background-color: #ffd700; 
            z-index: 1000 !important;
        }

        /* * ESTILIZACIÓN BASE DEL POPUP */
        .leaflet-popup-content-wrapper {
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 15px;
            color: #000000;
            font-family: inherit;
            box-shadow: 8px 8px 0px #000000; 
            padding: 0;
        }

        /* Ocultamos las puntas y cierres nativos */
        .leaflet-popup-tip-container,
        .leaflet-popup-close-button {
            display: none !important;
        }

        .leaflet-popup-content {
            margin: 15px;
            text-align: center;
        }

        /* * LÓGICA DE INVERSIÓN GRAVITACIONAL DEL POPUP 
         * Esta clase se inyectará dinámicamente con JS si el pin está arriba
         */
        .popup-opens-down {
            bottom: auto !important; /* Anulamos el comportamiento de flotar hacia arriba */
            top: 0 !important;       /* Anclamos el borde superior del popup al pin */
            margin-bottom: 0 !important;
            margin-top: 55px !important; /* Empujamos 55px hacia abajo para que se ubique por debajo de la gota */
        }
        
        .popup-opens-up {
            /* Clase neutra para cuando abre hacia arriba (comportamiento nativo Leaflet) */
        }

        /* * ESTRUCTURA DEL CONTENIDO (IMÁGENES PROTAGONISTAS) */
        .popup-images-grid {
            display: flex;
            justify-content: center;
            gap: 15px; 
            margin-bottom: 12px;
        }

        .popup-images-grid a {
            display: block;
        }

        .popup-images-grid img {
            width: 150px; /* Tamaño enorme garantizado para todas las imágenes */
            height: 150px; 
            object-fit: cover;
            border: 4px solid #000000;
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 4px 4px 0px rgba(0,0,0,1);
            cursor: pointer;
        }

        .popup-images-grid img:hover {
            transform: translateY(-4px); 
            box-shadow: 6px 8px 0px rgba(0,0,0,1);
        }

        .popup-text-label {
            font-size: 18px; 
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center; 
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
        <img src="CAPA.png" id="capa-superior" alt="Capa Decorativa Superior">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* * 1. INICIALIZACIÓN DEL MAPA */
            const map = L.map('map', {
                center: [7.5, -66.0],     
                zoom: 6,                  
                zoomControl: true,        
                attributionControl: false 
            });

            /* * 2. TILE LAYER */
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            /* * 3. DATOS */
            const retailNodes = [
                { 
                    id: 1, 
                    sucursal: "Kromi Market", 
                    lat: 10.2225, lng: -68.0160,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Kromi_Market_Valencia.html" }
                    ]
                },
                { 
                    id: 2, 
                    sucursal: "Redvital San Diego", 
                    lat: 10.2540, lng: -67.9510,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_San_Diego_Valencia.html" }
                    ]
                },
                { 
                    id: 3, 
                    sucursal: "Redvital La Yaguara", 
                    lat: 10.4772, lng: -66.9597,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_La_Yaguara.html" },
                        { src: "RECETAS.png", link: "https://yaryur-nestle.github.io/canal-moderno/RECETAS_Redvital_La_Yaguara.html" }
                    ]
                },
                { 
                    id: 4, 
                    sucursal: "Garzón Hiperahorro", 
                    lat: 7.7669, lng: -72.2250,
                    images: [
                        { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Garzon_Hiperahorro_San_Cristobal.html" }
                    ]
                },
                { 
                    id: 5, 
                    sucursal: "Luxor Círculo Militar", 
                    lat: 10.2670, lng: -67.5950,
                    images: [
                        { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Luxor_Circulo_Militar_Maracay.html" }
                    ]
                }
            ];

            /* * 4. INYECCIÓN DEL ECOSISTEMA Y LOGICA ESPACIAL */
            retailNodes.forEach(node => {
                
                const customPin = L.divIcon({
                    className: 'custom-leaflet-icon',
                    html: '<div class="comic-marker-pin"></div>',
                    iconSize: [32, 32], 
                    iconAnchor: [16, 32], 
                    popupAnchor: [0, -36] 
                });

                const marker = L.marker([node.lat, node.lng], { icon: customPin }).addTo(map);

                let imagesHtml = '<div class="popup-images-grid">';
                node.images.forEach(img => {
                    imagesHtml += `
                        <a href="${img.link}" target="_blank">
                            <img src="${img.src}" alt="Visitar ${node.sucursal}">
                        </a>
                    `;
                });
                imagesHtml += '</div>';

                const popupContent = `
                    <div>
                        ${imagesHtml}
                        <div class="popup-text-label">${node.sucursal}</div>
                    </div>
                `;

                marker.bindPopup(popupContent, {
                    offset: [0, -10],
                    maxWidth: 600, 
                    autoPanPadding: [20, 20] // Añade un ligero margen de respiro al auto-scroll
                });
                
                /*
                 * 5. FUNCIÓN CENTRAL PARA DECIDIR DÓNDE SE ABRE LA VENTANA
                 * Evaluamos si se acciona por hover o click.
                 */
                const evaluarPosicionEspacial = function() {
                    // Obtenemos los píxeles (X,Y) del marcador relativos al visor actual del mapa
                    const puntoPantalla = map.latLngToContainerPoint(this.getLatLng());
                    // Obtenemos la altura total del visor del mapa en píxeles
                    const alturaMapa = map.getSize().y;
                    
                    const popupAsociado = this.getPopup();
                    
                    // Si el punto 'Y' es menor a la mitad (está de la mitad hacia arriba)
                    if (puntoPantalla.y < (alturaMapa / 2)) {
                        popupAsociado.options.className = 'popup-opens-down';
                    } else {
                        // Si está de la mitad hacia abajo
                        popupAsociado.options.className = 'popup-opens-up';
                    }
                    
                    this.openPopup();
                };

                // Suscribimos la función inteligente a los eventos
                marker.on('mouseover', evaluarPosicionEspacial);
                marker.on('click', evaluarPosicionEspacial);
            });
            
        });
    </script>
</body>
</html>
