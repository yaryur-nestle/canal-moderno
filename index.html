<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <script src="https://code.highcharts.com/maps/highmaps.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.1/proj4.js"></script>
    <script src="https://code.highcharts.com/mapdata/countries/ve/ve-all.js"></script>
    
    <style>
        /* * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* * CONTENEDOR PRINCIPAL */
        #app-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative; /* Clave para que el panel lateral flote dentro de esta caja */
            overflow: hidden; 
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: transparent;
            position: relative;
            z-index: 1;
        }

        /* * CAPA SUPERIOR (No interactiva) */
        #capa-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
            user-select: none; 
            object-fit: cover; 
            opacity: 0.1;
        }

        /* * PANEL LATERAL DE INFORMACIÓN (NUEVO) */
        #info-panel {
            position: absolute;
            top: 0;
            right: -350px; /* Oculto fuera de la pantalla a la derecha */
            width: 320px;
            height: 100%;
            background-color: #ffffff;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 10000; /* Por encima de todo */
            transition: right 0.3s ease-in-out; /* Animación suave */
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        /* Clase para mostrar el panel */
        #info-panel.active {
            right: 0;
        }

        /* Botón de cerrar (X) */
        #close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            font-size: 24px;
            color: #999999;
            cursor: pointer;
            transition: color 0.2s;
            margin-bottom: 10px;
        }

        #close-btn:hover {
            color: #ff2a2a;
        }

        /* Título del Panel */
        #panel-title {
            font-size: 22px;
            font-weight: 600;
            color: #333333;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        /* Contenedor de Imágenes dentro del Panel */
        .panel-images-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .panel-images-container a {
            display: block;
            text-decoration: none;
            width: 100%;
            text-align: center;
        }

        .panel-images-container img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .panel-images-container img:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="map"></div>
        <img src="CAPA.png" id="capa-superior" alt="Capa Decorativa Superior">
        
        <div id="info-panel">
            <button id="close-btn">&times;</button>
            <h2 id="panel-title">Nombre Sucursal</h2>
            <div id="panel-images" class="panel-images-container">
                </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // Referencias a los elementos del panel lateral
            const panel = document.getElementById('info-panel');
            const panelTitle = document.getElementById('panel-title');
            const panelImages = document.getElementById('panel-images');
            const closeBtn = document.getElementById('close-btn');

            // Función para abrir el panel con datos dinámicos
            function abrirPanel(sucursal, images) {
                panelTitle.textContent = sucursal;
                
                // Limpiar imágenes anteriores
                panelImages.innerHTML = ''; 

                // Crear los enlaces e imágenes nuevas
                images.forEach(img => {
                    const enlace = document.createElement('a');
                    enlace.href = img.link;
                    enlace.target = "_blank"; // Abre en nueva pestaña
                    
                    const imagen = document.createElement('img');
                    imagen.src = img.src;
                    imagen.alt = `Visitar ${sucursal}`;

                    enlace.appendChild(imagen);
                    panelImages.appendChild(enlace);
                });

                // Deslizar el panel hacia la vista
                panel.classList.add('active');
            }

            // Función para cerrar el panel
            function cerrarPanel() {
                panel.classList.remove('active');
            }

            // Evento para cerrar al tocar la 'X'
            closeBtn.addEventListener('click', cerrarPanel);

            /* * 1. DATOS DE LOS NODOS (SUCURSALES) */
            const retailNodes = [
                { 
                    id: 1, sucursal: "Kromi Market", 
                    lat: 10.2225, lon: -68.0160,
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Kromi_Market_Valencia.html" } ]
                },
                { 
                    id: 2, sucursal: "Redvital San Diego", 
                    lat: 10.2540, lon: -67.9510,
                    images: [ { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_San_Diego_Valencia.html" } ]
                },
                { 
                    id: 3, sucursal: "Redvital La Yaguara", 
                    lat: 10.4772, lon: -66.9597,
                    images: [
                        { src: "NIDO.png", link: "https://yaryur-nestle.github.io/canal-moderno/NIDO_Redvital_La_Yaguara.html" },
                        { src: "RECETAS.png", link: "https://yaryur-nestle.github.io/canal-moderno/RECETAS_Redvital_La_Yaguara.html" }
                    ]
                },
                { 
                    id: 4, sucursal: "Garzón Hiperahorro", 
                    lat: 7.7669, lon: -72.2250,
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Garzon_Hiperahorro_San_Cristobal.html" } ]
                },
                { 
                    id: 5, sucursal: "Luxor Círculo Militar", 
                    lat: 10.2670, lon: -67.5950,
                    images: [ { src: "MULTIMARCA.png", link: "https://yaryur-nestle.github.io/canal-moderno/MULTIMARCA_Luxor_Circulo_Militar_Maracay.html" } ]
                }
            ];

            /* * 2. PREPARACIÓN DEL MAPA BASE DE VENEZUELA */
            const mapData = Highcharts.maps['countries/ve/ve-all'];
            const baseData = mapData.features.map(function(feature, index) {
                return [feature.properties['hc-key'], index];
            });

            /* * 3. INICIALIZACIÓN DEL MAPA DE HIGHCHARTS */
            Highcharts.mapChart('map', {
                chart: {
                    map: 'countries/ve/ve-all',
                    backgroundColor: 'transparent',
                    events: {
                        // Si el usuario hace clic en el fondo del mapa (océano o tierra vacía), cierra el panel
                        click: function () {
                            cerrarPanel();
                        }
                    }
                },
                title: { text: null },
                credits: { enabled: false },
                legend: { enabled: false },
                mapNavigation: {
                    enabled: true,
                    buttonOptions: { verticalAlign: 'bottom' }
                },
                
                plotOptions: {
                    series: {
                        states: { inactive: { opacity: 1 } }, // Evita que el mapa se ponga pálido
                        point: {
                            events: {
                                // EL EVENTO MÁGICO: Al hacer clic en un punto (estado o sucursal)
                                click: function () {
                                    // Si tiene la propiedad 'images', es una sucursal nuestra
                                    if (this.options && this.options.images) {
                                        abrirPanel(this.options.sucursal, this.options.images);
                                    } else {
                                        // Si hace clic en un Estado que no tiene sucursal, cerramos el panel
                                        cerrarPanel();
                                    }
                                }
                            }
                        }
                    }
                },
                
                // DESACTIVAMOS EL TOOLTIP FLOTANTE POR COMPLETO
                tooltip: {
                    enabled: false 
                },

                /* * 4. INYECCIÓN DEL ECOSISTEMA (Capas) */
                series: [
                    {
                        data: baseData,
                        name: 'Estado',
                        color: '#daccaa',
                        borderColor: '#ffffff',
                        borderWidth: 1,
                        states: { hover: { enabled: false } },
                        dataLabels: {
                            enabled: true,
                            format: '{point.name}',
                            style: { fontSize: '10px', fontWeight: 'normal', textOutline: 'none', color: '#666' }
                        }
                    },
                    {
                        type: 'mappoint',
                        name: 'Sucursales',
                        data: retailNodes,
                        cursor: 'pointer',
                        marker: {
                            symbol: 'circle',
                            radius: 8,
                            fillColor: '#ff2a2a',
                            lineColor: '#ffffff',
                            lineWidth: 2,
                            states: {
                                hover: {
                                    radius: 12,
                                    fillColor: '#ff2a2a'
                                }
                            }
                        }
                    }
                ]
            });
        });
    </script>
</body>
</html>
