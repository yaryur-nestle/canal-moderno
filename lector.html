<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Código de Barras</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e293b; /* Color oscuro por defecto */
            color: white;
            transition: background-color 0.3s ease;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        /* El input es casi invisible pero sigue ahí para recibir el código */
        #scannerInput {
            opacity: 0.01;
            position: absolute;
            top: -1000px;
        }

        /* Clases de estado */
        .bg-success {
            background-color: #22c55e !important; /* Verde victoria */
        }

        .bg-error {
            background-color: #ef4444 !important; /* Rojo error */
        }

        /* Animación de temblor */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body>

    <h1 id="statusTitle">Esperando lectura...</h1>
    <p id="statusSub">Escanea un código para comenzar</p>
    
    <input type="text" id="scannerInput" autofocus autocomplete="off">

    <script>
        const TARGET_CODE = "7591016955096";
        const input = document.getElementById('scannerInput');
        const statusTitle = document.getElementById('statusTitle');
        const statusSub = document.getElementById('statusSub');
        
        let resetTimeout;

        // --- MANTENER SIEMPRE EL FOCO ---
        // Esto asegura que el lector de barras siempre escriba en el input
        document.addEventListener('click', () => input.focus());
        input.addEventListener('blur', () => {
            setTimeout(() => input.focus(), 10);
        });

        // --- LÓGICA DE LECTURA ---
        input.addEventListener('keydown', function(event) {
            // El lector de barras simula presionar "Enter" al final
            if (event.key === 'Enter') {
                event.preventDefault();
                const scannedValue = input.value.trim();
                input.value = ''; // Borrar input de inmediato para el siguiente escaneo
                
                clearTimeout(resetTimeout); // Limpiar temporizadores anteriores

                if (scannedValue === TARGET_CODE) {
                    lanzarVictoria();
                } else if (scannedValue !== "") {
                    lanzarError();
                }
            }
        });

        // --- FUNCIÓN DE VICTORIA ---
        function lanzarVictoria() {
            // Estilos
            document.body.className = 'bg-success';
            statusTitle.innerText = "¡CÓDIGO CORRECTO!";
            statusSub.innerText = "¡Victoria! 🎉🎉";
            
            // Confeti de celebración
            let duration = 3 * 1000;
            let animationEnd = Date.now() + duration;
            let defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            let interval = setInterval(function() {
                let timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                let particleCount = 50 * (timeLeft / duration);
                // Lanzar confeti desde dos puntos (izquierda y derecha)
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // Volver al estado normal después de unos segundos (Opcional)
            resetTimeout = setTimeout(resetPantalla, 4000);
        }

        // --- FUNCIÓN DE ERROR ---
        function lanzarError() {
            // Quitar animación previa si existe para poder relanzarla
            document.body.classList.remove('shake');
            
            // Forzar un "reflow" para que la animación de temblor se reinicie
            void document.body.offsetWidth;
            
            // Aplicar estilos de error
            document.body.className = 'bg-error shake';
            statusTitle.innerText = "¡NO ES!";
            statusSub.innerText = "Código incorrecto ❌";

            // Volver al estado normal rápido
            resetTimeout = setTimeout(resetPantalla, 1500);
        }

        // --- FUNCIÓN PARA RESETEAR LA PANTALLA ---
        function resetPantalla() {
            document.body.className = ''; // Quitar clases de fondo
            statusTitle.innerText = "Esperando lectura...";
            statusSub.innerText = "Escanea un código para comenzar";
        }

    </script>
</body>
</html>
