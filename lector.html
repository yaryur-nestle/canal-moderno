<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Código de Barras - Recetas</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* Fondo negro para que resalten las imágenes */
            transition: background-color 0.3s ease;
            overflow: hidden;
        }

        /* La imagen ocupa toda la pantalla */
        #visorImagen {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 'contain' asegura que la imagen no se recorte. Puedes cambiarlo a 'cover' si prefieres que llene cada pixel aunque se recorte un poco */
        }

        /* El input es invisible pero sigue ahí para recibir el código */
        #scannerInput {
            opacity: 0.01;
            position: absolute;
            top: -1000px;
        }

        /* Clases de estado (opcional: para dar retroalimentación visual en errores) */
        .bg-error {
            background-color: #ef4444 !important; /* Rojo error */
        }

        /* Animación de temblor en caso de error */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body>

    <img id="visorImagen" src="TABLET 03.jpg" alt="Pantalla de inicio">
    
    <input type="text" id="scannerInput" autofocus autocomplete="off">

    <script>
        const imagenDefault = "TABLET 03.jpg";
        const visorImagen = document.getElementById('visorImagen');
        const input = document.getElementById('scannerInput');
        
        let resetTimeout;

        // Base de datos de códigos vinculados a su receta
        const baseDeDatos = {
            "7591016955096": "RECETA01.png",
            "7591016155097": "RECETA01.png",
            
            "7506475104425": "RECETA02.png",
            "17506475104422": "RECETA02.png",
            "789100107263": "RECETA02.png",
            
            "7591016206409": "RECETA03.png",
            "7591016406403": "RECETA03.png",
            "17591016206406": "RECETA03.png",
            
            "7591016204894": "RECETA04.png"
        };

        // --- MANTENER SIEMPRE EL FOCO ---
        document.addEventListener('click', () => input.focus());
        input.addEventListener('blur', () => {
            setTimeout(() => input.focus(), 10);
        });

        // --- LÓGICA DE LECTURA ---
        input.addEventListener('keydown', function(event) {
            // El lector de barras simula presionar "Enter" al final
            if (event.key === 'Enter') {
                event.preventDefault();
                const scannedValue = input.value.trim();
                input.value = ''; // Borrar input de inmediato
                
                clearTimeout(resetTimeout); // Limpiar temporizadores anteriores

                // Si el código está en nuestra base de datos
                if (baseDeDatos[scannedValue]) {
                    lanzarVictoria(baseDeDatos[scannedValue]);
                } else if (scannedValue !== "") {
                    lanzarError();
                }
            }
        });

        // --- FUNCIÓN DE ÉXITO ---
        function lanzarVictoria(imagenReceta) {
            // Quitar clases de error si las hubiera
            document.body.className = '';
            
            // Cambiar la imagen a la receta correspondiente
            visorImagen.src = imagenReceta;
            
            // Volver a la imagen de la tablet después de 3 segundos (3000 ms)
            resetTimeout = setTimeout(resetPantalla, 3000);
        }

        // --- FUNCIÓN DE ERROR (Opcional, mantiene la imagen de la tablet pero da un aviso visual) ---
        function lanzarError() {
            document.body.classList.remove('shake');
            void document.body.offsetWidth; // Forzar reinicio de animación
            
            document.body.className = 'bg-error shake';
            visorImagen.src = imagenDefault; // Asegurar que está en la imagen por defecto

            // Quitar el rojo de error rápido
            resetTimeout = setTimeout(resetPantalla, 1000);
        }

        // --- FUNCIÓN PARA RESETEAR LA PANTALLA ---
        function resetPantalla() {
            document.body.className = ''; // Quitar clases de fondo de error
            visorImagen.src = imagenDefault; // Volver a la tablet
        }

    </script>
</body>
</html>
