<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Código de Barras - Sincronizado</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            position: relative;
        }

        /* Imagen de fondo de la tablet */
        #visorImagen {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Capa superpuesta para la receta al 75% */
        #overlayReceta {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6); /* Fondo oscuro semitransparente */
            display: none; /* Oculto por defecto */
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #imgReceta {
            max-width: 75%;
            max-height: 75%;
            object-fit: contain;
        }

        /* Input invisible */
        #scannerInput {
            opacity: 0.01;
            position: absolute;
            top: -1000px;
        }

        /* Estilos de error */
        .bg-error { background-color: #ef4444 !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body>

    <img id="visorImagen" src="TABLET 03.jpg" alt="Pantalla de inicio">
    
    <div id="overlayReceta">
        <img id="imgReceta" src="" alt="Receta">
    </div>
    
    <input type="text" id="scannerInput" autofocus autocomplete="off">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
            authDomain: "canal-moderno-2655e.firebaseapp.com",
            databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
            projectId: "canal-moderno-2655e",
            storageBucket: "canal-moderno-2655e.firebasestorage.app",
            messagingSenderId: "947512040134",
            appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        // Referencia al estado de sincronización
        const estadoRef = ref(db, 'muebles/tablet_03/estado_actual');

        const input = document.getElementById('scannerInput');
        const overlayReceta = document.getElementById('overlayReceta');
        const imgReceta = document.getElementById('imgReceta');
        
        let resetTimeout;
        let confettiInterval;

        // Base de datos de códigos vinculados al ID de receta
        const baseDeDatos = {
            "7591016955096": "01",
            "7591016155097": "01",
            "7506475104425": "02",
            "17506475104422": "02",
            "7891000107263": "02",
            "7591016206409": "03",
            "7591016406403": "03",
            "17591016206406": "03",
            "7591016204894": "04"
        };

        // Iniciar sesión silenciosa para poder escribir/leer en DB
        signInAnonymously(auth).catch(error => console.error("Error Auth:", error));

        // --- MANTENER FOCO ---
        document.addEventListener('click', () => input.focus());
        input.addEventListener('blur', () => setTimeout(() => input.focus(), 10));

        // --- LÓGICA DE ESCANEO ---
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const scannedValue = input.value.trim();
                input.value = '';
                clearTimeout(resetTimeout);

                if (baseDeDatos[scannedValue]) {
                    const recetaID = baseDeDatos[scannedValue];
                    
                    // Disparamos el evento a Firebase (Esto actualiza AMBAS pantallas)
                    set(ref(db, 'muebles/tablet_03/estado_actual/recetaActiva'), recetaID);
                    
                    // Apagamos la receta en Firebase después de 3 segundos
                    resetTimeout = setTimeout(() => {
                        set(ref(db, 'muebles/tablet_03/estado_actual/recetaActiva'), "");
                    }, 3000);
                    
                } else if (scannedValue !== "") {
                    lanzarError();
                }
            }
        });

        // --- ESCUCHADOR DE FIREBASE (Para Confeti y Recetas) ---
        onValue(estadoRef, (snapshot) => {
            const estado = snapshot.val();
            if (!estado) return;

            // Lógica Confeti
            if (estado.hayPersonas) {
                if (!confettiInterval) {
                    confettiInterval = setInterval(() => {
                        confetti({ particleCount: 15, spread: 60, origin: { y: -0.1, x: Math.random() }, zIndex: 9999 });
                    }, 250);
                }
            } else {
                clearInterval(confettiInterval);
                confettiInterval = null;
            }

            // Lógica Mostrar Receta
            if (estado.recetaActiva && estado.recetaActiva !== "") {
                // El Lector muestra RECETA01.png
                imgReceta.src = `RECETA${estado.recetaActiva}.png`;
                overlayReceta.style.display = 'flex';
                document.body.className = ''; // Quita el error si había
            } else {
                overlayReceta.style.display = 'none';
                imgReceta.src = '';
            }
        });

        function lanzarError() {
            document.body.classList.remove('shake');
            void document.body.offsetWidth;
            document.body.className = 'bg-error shake';
            setTimeout(() => document.body.className = '', 1000);
        }
    </script>
</body>
</html>
