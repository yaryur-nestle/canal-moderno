<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Código de Barras - Sincronizado y Cámara</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: #000;
            overflow: hidden;
            position: relative;
            font-family: 'Courier New', Courier, monospace;
        }

        /* === ESTILOS DEL LOGIN === */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            border: 1px solid #00FFFF; padding: 40px; background: rgba(0, 255, 255, 0.05);
            text-align: center; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border-radius: 8px; backdrop-filter: blur(10px); width: 300px;
        }
        .login-box h2 { color: #00FFFF; margin-top: 0; margin-bottom: 25px; text-shadow: 0 0 5px #00FFFF; letter-spacing: 2px; }
        .login-box input {
            display: block; width: 100%; box-sizing: border-box; margin-bottom: 15px;
            padding: 12px; background: rgba(0, 0, 0, 0.8); border: 1px solid #00FFFF;
            color: #00FFFF; font-family: inherit; font-size: 1rem; text-align: center;
        }
        .login-box input:focus { outline: none; box-shadow: 0 0 10px rgba(0, 255, 255, 0.5); background: rgba(0, 255, 255, 0.1); }
        .login-box button {
            background: rgba(0, 255, 255, 0.15); border: 1px solid #00FFFF; color: #00FFFF;
            padding: 12px 20px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 1rem;
            width: 100%; transition: all 0.3s; letter-spacing: 1px;
        }
        .login-box button:hover { background: #00FFFF; color: #000; box-shadow: 0 0 15px #00FFFF; }
        .error-msg { color: #FF0055; margin-top: 15px; font-size: 0.85rem; display: none; text-shadow: 0 0 5px #FF0055; }

        /* === ESTILOS PANTALLA DE BIENVENIDA === */
        #welcome-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 3000;
            display: none; justify-content: center; align-items: center; flex-direction: column;
        }
        .welcome-btn {
            background: #00FFFF; color: #000; padding: 25px 50px; font-size: 1.5rem;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4); transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 2px; font-family: inherit;
        }
        .welcome-btn:hover {
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
            transform: scale(1.05);
        }
        .welcome-btn:active { transform: scale(0.95); }

        /* === ESTILOS DE LA APP === */
        #app-screen {
            display: none; 
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: pointer; 
        }

        #visorImagen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Contenedores de video superpuestos */
        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            background-color: #000;
            z-index: 2;
            display: none;
        }

        #videoReceta1, #videoReceta2, #videoReceta3, #videoReceta4 {
            z-index: 5;
        }

        /* === ESTILOS DEL ESCÁNER DE CÁMARA === */
        #camera-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000; 
        }
        .camera-container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            text-align: center;
            transition: background-color 0.3s ease;
        }
        .camera-container h3 {
            margin-top: 0; color: #000; font-family: sans-serif; transition: color 0.3s;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Clases de feedback visual */
        .bg-error { background-color: #ef4444 !important; }
        .bg-success-camera { background-color: #dcfce7 !important; }
        .bg-error-camera { background-color: #fee2e2 !important; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body>

    <audio id="beepSound" src="sound.mp3" preload="auto"></audio>

    <div id="login-screen">
        <div class="login-box">
            <h2>LECTOR RECETAS</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="Correo Electrónico" required autocomplete="email">
                <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                <button type="submit" id="login-btn">CONECTAR</button>
                <div id="error-msg" class="error-msg">Error de credenciales.</div>
            </form>
        </div>
    </div>

    <div id="welcome-screen">
        <button id="start-btn" class="welcome-btn">Comenzar a escanear</button>
    </div>

    <div id="app-screen">
        <img id="visorImagen" src="TABLET 03.jpg" alt="Pantalla de inicio">
        
        <video id="video1" class="video-player" src="VIDEO_01_reparado.mp4" preload="auto" playsinline></video>
        <video id="video2" class="video-player" src="VIDEO_02.mp4" preload="auto" playsinline></video>
        
        <video id="videoReceta1" class="video-player" src="VIDEO_RECETA1.mp4" preload="auto" playsinline></video>
        <video id="videoReceta2" class="video-player" src="VIDEO_RECETA2.mp4" preload="auto" playsinline></video>
        <video id="videoReceta3" class="video-player" src="VIDEO_RECETA3.mp4" preload="auto" playsinline></video>
        <video id="videoReceta4" class="video-player" src="VIDEO_RECETA4.mp4" preload="auto" playsinline></video>
    </div>

    <div id="camera-overlay">
        <div class="camera-container" id="camera-box">
            <h3 id="camera-title">Escanear Código</h3>
            <div id="reader"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
            authDomain: "canal-moderno-2655e.firebaseapp.com",
            databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
            projectId: "canal-moderno-2655e",
            storageBucket: "canal-moderno-2655e.firebasestorage.app",
            messagingSenderId: "947512040134",
            appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        const estadoRef = ref(db, 'muebles/tablet_03/estado_actual');

        const loginScreen = document.getElementById('login-screen');
        const welcomeScreen = document.getElementById('welcome-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const cameraOverlay = document.getElementById('camera-overlay');
        const cameraBox = document.getElementById('camera-box');
        const cameraTitle = document.getElementById('camera-title');
        
        const video1 = document.getElementById('video1');
        const video2 = document.getElementById('video2');
        
        // Diccionario de videos de Recetas igual que el TV
        const videosReceta = {
            "01": document.getElementById('videoReceta1'),
            "02": document.getElementById('videoReceta2'),
            "03": document.getElementById('videoReceta3'),
            "04": document.getElementById('videoReceta4')
        };

        const beepAudio = document.getElementById('beepSound'); 
        
        let personaDetectadaLocalmente = false;
        let isVideo1Playing = false;
        let isVideo2Playing = false;
        let estadoGlobalReceta = ""; 

        let scannerBuffer = "";
        let lastKeyTime = Date.now();
        let html5QrCode; 
        
        let ultimoCodigoEscaneado = "";
        let tiempoUltimoEscaneo = 0;

        // ====== GENERADOR DE SONIDO (BEEP LOCAL Y ERROR SINTÉTICO) ======
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function hacerPitido() {
            beepAudio.currentTime = 0; 
            beepAudio.play().catch(e => console.warn("Error al reproducir sound.mp3:", e));
        }

        // ====== FUNCIÓN PARA DETECTAR URL ======
        function esURL(texto) {
            const patronURL = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
            return patronURL.test(texto);
        }

        // ====== AUTENTICACIÓN Y FLUJO DE PANTALLAS ======
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                welcomeScreen.style.display = 'flex';
                iniciarSincronizacion();
            } else {
                loginScreen.style.display = 'flex';
                welcomeScreen.style.display = 'none';
                appScreen.style.display = 'none';
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            
            errorMsg.style.display = 'none';
            loginBtn.innerText = 'CARGANDO...';
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => { loginBtn.innerText = 'CONECTAR'; loginForm.reset(); })
                .catch((error) => {
                    loginBtn.innerText = 'CONECTAR';
                    errorMsg.innerText = "Error: Verifica tus credenciales.";
                    errorMsg.style.display = 'block';
                });
        });

        // ====== INICIO DE EXPERIENCIA (FULLSCREEN & AUDIO) ======
        document.getElementById('start-btn').addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.warn(`Error intentando activar fullscreen: ${err.message}`);
                });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            welcomeScreen.style.display = 'none';
            appScreen.style.display = 'block';
            iniciarCamara();
        });

        // ======= DICCIONARIO ORDENADO Y NORMALIZADO (Actualizado igual al TV) =======
        const baseDeDatos = {
            // LOTE 01 LECHE CONDENSADA - Video 1
            "7506475104425": "01", 
            "17506475104422": "01", 
            "7891000107263": "01", 

            // LOTE 02 CHOCOLATE SAVOY - Video 2
            "7591016155097": "02", 
            "7591016855096": "02", 

            // LOTE 03 - Video 3
            "7591016206409": "03", 
            "7591016406403": "03", 
            "17591016206406": "03", 

            // LOTE 04 SOPA DE POLLO - Video 4
            "7591016204894": "04"
        };

        // ====== FUNCIÓN CENTRAL PARA PROCESAR CÓDIGOS ======
        function procesarCodigoDeBarras(scannedValue) {
            if (baseDeDatos[scannedValue]) {
                const recetaID = baseDeDatos[scannedValue];
                
                // Activamos la receta en la base de datos de manera indefinida
                set(ref(db, 'muebles/tablet_03/estado_actual/recetaActiva'), recetaID);
                hacerPitido(); 
                
                if (cameraOverlay.style.display === 'flex') {
                    cameraTitle.innerText = "¡Código válido!";
                    cameraTitle.style.color = "#10b981"; 
                    cameraBox.classList.add('bg-success-camera'); 
                    
                    setTimeout(() => {
                        cameraTitle.innerText = "Escanear Código";
                        cameraTitle.style.color = "#000";
                        cameraBox.classList.remove('bg-success-camera');
                    }, 1500);
                }
            } 
            // NUEVO: Verificamos si es una URL (Código QR)
            else if (esURL(scannedValue)) {
                hacerPitido();
                
                if (cameraOverlay.style.display === 'flex') {
                    cameraTitle.innerText = "¡Redirigiendo...";
                    cameraTitle.style.color = "#3b82f6"; // Azul para URL
                    
                    setTimeout(() => {
                        cameraTitle.innerText = "Escanear Código";
                        cameraTitle.style.color = "#000";
                    }, 1500);
                }

                // Ajustamos el formato de la URL si le falta el http/https
                let urlFinal = scannedValue;
                if (!urlFinal.match(/^https?:\/\//i)) {
                    urlFinal = 'https://' + urlFinal;
                }
                
                // Redirección
                window.location.href = urlFinal;
            } 
            // Si no está en BD y tampoco es URL, lanza error
            else if (scannedValue !== "") {
                lanzarError();
            }
        }

        // LECTOR FÍSICO
        document.addEventListener('keydown', function(event) {
            if (appScreen.style.display !== 'block' || cameraOverlay.style.display === 'flex') return;

            const currentTime = Date.now();
            
            if (currentTime - lastKeyTime > 200) {
                scannerBuffer = "";
            }
            lastKeyTime = currentTime;

            if (event.key === 'Enter') {
                event.preventDefault();
                const scannedValue = scannerBuffer.trim();
                scannerBuffer = ''; 
                procesarCodigoDeBarras(scannedValue);
            } else if (event.key.length === 1) { 
                scannerBuffer += event.key;
            }
        });

        // ====== LÓGICA TRIPLE TOQUE PARA VOLVER A LA CÁMARA ======
        let tapCount = 0;
        let tapTimer;

        appScreen.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            tapCount++;
            if (tapCount === 1) {
                tapTimer = setTimeout(() => {
                    tapCount = 0;
                }, 1000);
            } else if (tapCount === 3) {
                clearTimeout(tapTimer);
                tapCount = 0;
                iniciarCamara();
            }
        });

        function iniciarCamara() {
            cameraOverlay.style.display = 'flex';
            
            video1.muted = true;
            video2.muted = true;
            Object.values(videosReceta).forEach(v => v.muted = true);
            
            html5QrCode = new Html5Qrcode("reader");
            
            const config = { 
                fps: 10, 
                qrbox: { width: 300, height: 150 },
                aspectRatio: 1.0,
                formatsToSupport: [ 
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.UPC_A,
                    // Añadimos QR_CODE para que la cámara no los ignore
                    Html5QrcodeSupportedFormats.QR_CODE 
                ]
            };

            const onScanSuccess = (decodedText, decodedResult) => {
                const now = Date.now();
                
                if (decodedText !== ultimoCodigoEscaneado || (now - tiempoUltimoEscaneo) > 2000) {
                    ultimoCodigoEscaneado = decodedText;
                    tiempoUltimoEscaneo = now;
                    
                    procesarCodigoDeBarras(decodedText);
                }
            };

            const onScanFailure = (errorMessage) => {
                // Silencioso
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).catch((err) => {
                console.error("Fallo total al iniciar la cámara:", err);
                alert("No se pudo acceder a la cámara.");
                apagarCamara();
            });
        }

        function apagarCamara() {
            cameraOverlay.style.display = 'none';
            ultimoCodigoEscaneado = ""; 
            
            video1.muted = false;
            video2.muted = false;
            Object.values(videosReceta).forEach(v => v.muted = false);

            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => {
                    console.error("Error al detener la cámara", err);
                });
            }
        }


        // ====== LÓGICA DE EVENTOS 'ENDED' DE LOS VIDEOS (Igual al TV) ======
        video1.addEventListener('ended', () => {
            isVideo1Playing = false;
            video1.style.display = 'none';

            if (personaDetectadaLocalmente && estadoGlobalReceta === "") {
                video2.style.display = 'block';
                video2.currentTime = 0;
                video2.play().catch(e => console.error("Error reproduciendo Video 02:", e));
                isVideo2Playing = true;
            }
        });

        video2.addEventListener('ended', () => {
            if (personaDetectadaLocalmente && estadoGlobalReceta === "") {
                video2.currentTime = 0;
                video2.play().catch(e => console.error("Error reproduciendo Video 02 en bucle:", e));
                isVideo2Playing = true;
            } else {
                isVideo2Playing = false;
                video2.style.display = 'none';
            }
        });

        // Asignamos el evento 'ended' a todos los videos de receta para limpiar el estado
        Object.values(videosReceta).forEach(video => {
            video.addEventListener('ended', () => {
                set(ref(db, 'muebles/tablet_03/estado_actual/recetaActiva'), "");
            });
        });

        function iniciarSincronizacion() {
            onValue(estadoRef, (snapshot) => {
                const estado = snapshot.val();
                if (!estado) return;

                estadoGlobalReceta = estado.recetaActiva || "";
                const deteccionRemota = estado.hayPersonas;

                // 1. Manejo de la Detección
                if (deteccionRemota && !personaDetectadaLocalmente) {
                    personaDetectadaLocalmente = true;
                    // Iniciamos Video 1 solo si todo lo demás está apagado y no hay receta
                    if (!isVideo1Playing && !isVideo2Playing && estadoGlobalReceta === "") {
                        video1.style.display = 'block';
                        video1.currentTime = 0;
                        video1.play().catch(e => console.error("Error reproduciendo Video 01:", e));
                        isVideo1Playing = true;
                    }
                } 
                else if (!deteccionRemota && personaDetectadaLocalmente) {
                    personaDetectadaLocalmente = false;
                }

                // 2. Manejo de la Receta en Pantalla
                if (estadoGlobalReceta && videosReceta[estadoGlobalReceta]) {
                    
                    // PRIORIDAD ABSOLUTA: Detiene videos de presencia
                    if (isVideo1Playing) {
                        video1.pause();
                        video1.style.display = 'none';
                        isVideo1Playing = false;
                    }
                    if (isVideo2Playing) {
                        video2.pause();
                        video2.style.display = 'none';
                        isVideo2Playing = false;
                    }

                    // Iteramos sobre todos los videos de recetas
                    Object.keys(videosReceta).forEach(key => {
                        const v = videosReceta[key];
                        if (key === estadoGlobalReceta) {
                            // Reproducimos el activo
                            v.style.display = 'block';
                            if (v.paused) {
                                v.currentTime = 0;
                                v.play().catch(e => console.error(`Error reproduciendo Receta ${key}:`, e));
                            }
                        } else {
                            // Pausamos los demás
                            if (!v.paused || v.style.display === 'block') {
                                v.pause();
                                v.style.display = 'none';
                            }
                        }
                    });

                } else {
                    // LIMPIEZA CUANDO LA RECETA DESAPARECE (Fin de cualquier video de receta)
                    let recetaVideoEstabaCorriendo = false;

                    // Cortamos cualquier video de receta si sigue en pantalla
                    Object.values(videosReceta).forEach(v => {
                        if (!v.paused || v.style.display === 'block') {
                            v.pause();
                            v.style.display = 'none';
                            recetaVideoEstabaCorriendo = true;
                        }
                    });
                    
                    // Si la persona sigue ahí parada tras terminar un video de receta, reanudamos el video 2
                    if (recetaVideoEstabaCorriendo && personaDetectadaLocalmente) {
                        video2.style.display = 'block';
                        video2.currentTime = 0;
                        video2.play().catch(e => console.error("Error reanudando Video 02:", e));
                        isVideo2Playing = true;
                    }
                }
            });
        }

        function lanzarError() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);

            if(cameraOverlay.style.display !== 'flex') {
                document.getElementById('app-screen').classList.remove('shake');
                void document.getElementById('app-screen').offsetWidth;
                document.body.className = 'bg-error';
                document.getElementById('app-screen').classList.add('shake');
                setTimeout(() => {
                    document.body.className = '';
                    document.getElementById('app-screen').classList.remove('shake');
                }, 1000);
            } else {
                cameraTitle.innerText = "¡Código no válido!";
                cameraTitle.style.color = "#ef4444"; 
                cameraBox.classList.add('bg-error-camera'); 
                
                setTimeout(() => {
                    cameraTitle.innerText = "Escanear Código";
                    cameraTitle.style.color = "#000";
                    cameraBox.classList.remove('bg-error-camera');
                }, 1500);
            }
        }
    </script>
</body>
</html>
