<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yar-Yur System Canal Moderno - Lista de Sucursales</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            padding: 40px 24px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-container {
            width: 100%;
            max-width: 1120px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f2ece1;
        }

        .brand-subtitle {
            color: #968157;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        h1 {
            color: #b39c6e;
            font-size: 1.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.35;
        }

        .summary-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: #777777;
            font-weight: 600;
        }

        .summary-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #fdfbf7;
            border: 1px solid #daccaa;
            padding: 6px 16px;
            border-radius: 20px;
            color: #6b5b3e;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 4px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px;
        }

        thead th {
            background-color: #b39c6e;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            padding: 14px 16px;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #b39c6e;
        }

        tbody td {
            background-color: #ffffff;
            padding: 12px 16px;
            vertical-align: middle;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #daccaa;
            transition: background-color 0.25s ease;
        }

        tbody tr:hover td {
            background-color: #fdfbf7;
        }

        .id-cell {
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: 700;
            font-size: 0.92rem;
            color: #6b5b3e;
            white-space: nowrap;
        }

        .id-cell a {
            color: inherit;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 4px;
            background: #f8f4ec;
            border: 1px solid #e6dec8;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .id-cell a:hover {
            background: #b39c6e;
            color: #ffffff;
            border-color: #b39c6e;
        }

        .sucursal-name-cell {
            text-align: left;
            font-weight: 600;
            font-size: 0.96rem;
            color: #2c2c2c;
        }

        .sucursal-sub {
            display: block;
            font-size: 0.78rem;
            font-weight: 400;
            color: #888888;
            margin-top: 2px;
        }

        .logo-cell {
            width: 140px;
        }

        .chain-logo {
            max-width: 105px;
            height: 44px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .location-cell {
            font-size: 0.9rem;
            color: #555555;
            font-weight: 500;
        }

        .brand-cell {
            width: 120px;
        }

        .brand-img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            border-radius: 6px;
        }

        .img-fallback {
            display: none;
            font-size: 0.78rem;
            font-weight: 700;
            color: #7d6840;
            background: #f5efe2;
            padding: 4px 10px;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px 40px;
            }
            h1 {
                font-size: 1.35rem;
            }
            thead th, tbody td {
                padding: 10px 8px;
            }
            .brand-img {
                width: 48px;
                height: 48px;
            }
            .chain-logo {
                max-width: 75px;
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <header>
            <div class="brand-subtitle">Yar-Yur System &bull; Canal Moderno</div>
            <h1>Yar-Yur System Canal Moderno Lista de Sucursales</h1>
        </header>

        <div class="summary-bar">
            <div class="summary-item">
                <span>Total Exhibiciones: <strong>16</strong></span>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID Sistema</th>
                        <th colspan="2">Cadena / Sucursal</th>
                        <th>Estado / Ciudad</th>
                        <th>Marca</th>
                    </tr>
                </thead>
                <tbody id="sucursales-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const sucursalesData = [
            { id: 1,  code: "tablet_01", html: "tablet01.html", sucursal: "Redvital La Yaguara", detalle: "Zona Industrial La Yaguara", logo: "logo-REDVITAL.jpg", estadoCiudad: "Distrito Capital / Caracas", marcaImg: "NIDO.png", marcaAlt: "NIDO" },
            { id: 2,  code: "tablet_02", html: "tablet02.html", sucursal: "Garzón Hiperahorro", detalle: "Av. Rotaria", logo: "logo-GARZON.jpg", estadoCiudad: "Táchira / San Cristóbal", marcaImg: "MULTIMARCA.png", marcaAlt: "MULTIMARCA" },
            { id: 3,  code: "tablet_03", html: "tablet03.html", sucursal: "Redvital La Yaguara", detalle: "Zona Industrial La Yaguara", logo: "logo-REDVITAL.jpg", estadoCiudad: "Distrito Capital / Caracas", marcaImg: "RECETAS.png", marcaAlt: "RECETAS" },
            { id: 4,  code: "tablet_04", html: "tablet04.html", sucursal: "Redvital San Diego", detalle: "Sector San Diego", logo: "logo-REDVITAL.jpg", estadoCiudad: "Carabobo / Valencia", marcaImg: "NIDO.png", marcaAlt: "NIDO" },
            { id: 5,  code: "tablet_05", html: "tablet05.html", sucursal: "Kromi Market Prebo", detalle: "Av. Prebo, C.C. Prebo", logo: "logo-KROMI.jpg", estadoCiudad: "Carabobo / Valencia", marcaImg: "NIDO.png", marcaAlt: "NIDO" },
            { id: 6,  code: "tablet_06", html: "tablet06.html", sucursal: "Euromercado Las Delicias", detalle: "C.C. Las Delicias", logo: "logo-EUROMERCADO.jpg", estadoCiudad: "Aragua / Maracay", marcaImg: "MULTIMARCA.png", marcaAlt: "MULTIMARCA" },
            { id: 7,  code: "tablet_07", html: "tablet07.html", sucursal: "Río Lomas del Sol", detalle: "Los Naranjos", logo: "logo-RIO.jpg", logoAltSrc: "rio.png", estadoCiudad: "Miranda / Caracas", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 8,  code: "tablet_08", html: "tablet08.html", sucursal: "Fresco Market Caurimare", detalle: "Av. Principal Caurimare", logo: "logo-FRESCOMARKET.jpg", logoAltSrc: "logo-FRESCO.jpg", estadoCiudad: "Miranda / Caracas", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 9,  code: "tablet_09", html: "tablet09.html", sucursal: "Kromi Market Mañongo", detalle: "Sector Mañongo", logo: "logo-KROMI.jpg", estadoCiudad: "Carabobo / Valencia", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 10, code: "tablet_10", html: "tablet10.html", sucursal: "Río El Cigarral", detalle: "Sector El Cigarral", logo: "logo-RIO.jpg", logoAltSrc: "rio.png", estadoCiudad: "Miranda / Caracas", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 11, code: "tablet_11", html: "tablet11.html", sucursal: "Río El Recreo", detalle: "C.C. El Recreo", logo: "logo-RIO.jpg", logoAltSrc: "rio.png", estadoCiudad: "Distrito Capital / Caracas", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 12, code: "tablet_12", html: "tablet12.html", sucursal: "Supermercado Baratta", detalle: "Av. Principal Ferrero Tamayo", logo: "logo-BARATTA.jpg", estadoCiudad: "Táchira / San Cristóbal", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 13, code: "tablet_13", html: "tablet13.html", sucursal: "Kromi Market Prebo", detalle: "Av. Prebo, C.C. Prebo", logo: "logo-KROMI.jpg", estadoCiudad: "Carabobo / Valencia", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 14, code: "tablet_14", html: "tablet14.html", sucursal: "Inversiones Yar-Yur (El Parral)", detalle: "El Chacal - Parral (Ubicación temporal)", logo: "logo-YARYUR.jpg", logoAltSrc: "logo-YARYUR.png", estadoCiudad: "Miranda / San Antonio de Los Altos", marcaImg: "MAGGI.png", marcaAlt: "MAGGI" },
            { id: 15, code: "tablet_15", html: "tablet15.html", sucursal: "Inversiones Yar-Yur (El Bosque)", detalle: "Granja - Bosque (Ubicación temporal)", logo: "logo-YARYUR.jpg", logoAltSrc: "logo-YARYUR.png", estadoCiudad: "Miranda / San Antonio de Los Altos", marcaImg: "MAGGI.png", marcaAlt: "MAGGI" },
            { id: 16, code: "tablet_16", html: "tablet16.html", sucursal: "Inversiones Yar-Yur (Las Chimeneas)", detalle: "Las Chimeneas Mañongo (Ubicación temporal)", logo: "logo-YARYUR.jpg", logoAltSrc: "logo-YARYUR.png", estadoCiudad: "Miranda / San Antonio de Los Altos", marcaImg: "MAGGI.png", marcaAlt: "MAGGI" }
        ];

        const tbody = document.getElementById('sucursales-tbody');

        function renderTable() {
            tbody.innerHTML = '';
            sucursalesData.forEach(item => {
                const tr = document.createElement('tr');
                const fallbackAttr = item.logoAltSrc
                    ? `onerror="if(!this.dataset.triedAlt){this.dataset.triedAlt='1';this.src='${item.logoAltSrc}';}else{this.style.display='none';this.nextElementSibling.style.display='inline-block';}"`
                    : `onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block';"`;

                tr.innerHTML = `
                    <td class="id-cell">
                        <a href="${item.html}" target="_blank" title="Abrir ${item.html}">${item.code}</a>
                    </td>
                    <td class="sucursal-name-cell">
                        ${item.sucursal}
                        <span class="sucursal-sub">${item.detalle}</span>
                    </td>
                    <td class="logo-cell">
                        <img src="${item.logo}" alt="${item.sucursal}" class="chain-logo" ${fallbackAttr}>
                        <span class="img-fallback">${item.sucursal}</span>
                    </td>
                    <td class="location-cell">${item.estadoCiudad}</td>
                    <td class="brand-cell">
                        <img src="${item.marcaImg}" alt="${item.marcaAlt}" class="brand-img" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block';">
                        <span class="img-fallback">${item.marcaAlt}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable();
    </script>
</body>
</html>
