<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yar-Yur System Canal Moderno - Lista de Sucursales</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            padding: 40px 24px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            text-align: center;
            margin-bottom: 36px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f2ece1;
        }

        h1 {
            color: #b39c6e;
            font-size: 1.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.35;
        }

        .summary-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: #777777;
            font-weight: 600;
        }

        .summary-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #fdfbf7;
            border: 1px solid #e6dec8;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.online {
            background-color: #1ec71e;
            box-shadow: 0 0 6px rgba(30, 199, 30, 0.7);
        }

        .dot.offline {
            background-color: #daccaa;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 4px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px;
        }

        thead th {
            background-color: #b39c6e;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            padding: 14px 16px;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #b39c6e;
        }

        tbody td {
            background-color: #ffffff;
            padding: 12px 16px;
            vertical-align: middle;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #daccaa;
            transition: border-color 0.35s ease, box-shadow 0.35s ease, background-color 0.35s ease;
        }

        tbody tr:hover td {
            background-color: #fdfbf7;
        }

        /* Estado OFFLINE (Beige por defecto) */
        tbody tr.row-offline td {
            border-color: #daccaa;
        }

        /* Estado ONLINE (Verde Intenso) */
        tbody tr.row-online td {
            border-color: #1bb91b;
            box-shadow: 0 0 8px rgba(27, 185, 27, 0.22);
            background-color: #f9fff9;
        }

        .id-cell {
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: 700;
            font-size: 0.92rem;
            color: #6b5b3e;
            white-space: nowrap;
        }

        .id-cell a {
            color: inherit;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 4px;
            background: #f8f4ec;
            border: 1px solid #e6dec8;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .id-cell a:hover {
            background: #b39c6e;
            color: #ffffff;
            border-color: #b39c6e;
        }

        .sucursal-name-cell {
            text-align: left;
            font-weight: 600;
            font-size: 0.96rem;
            color: #2c2c2c;
        }

        .sucursal-sub {
            display: block;
            font-size: 0.78rem;
            font-weight: 400;
            color: #888888;
            margin-top: 2px;
        }

        .logo-cell {
            width: 130px;
        }

        .chain-logo {
            max-width: 100px;
            height: 42px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .location-cell {
            font-size: 0.9rem;
            color: #555555;
            font-weight: 500;
        }

        .brand-cell {
            width: 110px;
        }

        .brand-img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            border-radius: 6px;
        }

        .status-cell {
            width: 130px;
            font-weight: 700;
            font-size: 0.84rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            min-width: 96px;
            transition: all 0.3s ease;
        }

        .status-badge.offline {
            background-color: #f7f3eb;
            color: #968157;
            border: 1px solid #daccaa;
        }

        .status-badge.online {
            background-color: #e8fbe8;
            color: #138a13;
            border: 1px solid #1bb91b;
            box-shadow: 0 0 8px rgba(27, 185, 27, 0.25);
        }

        /* Modal sutil de autenticación sólo si las reglas de Firebase lo requieren */
        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: #ffffff;
            padding: 36px;
            border-radius: 12px;
            text-align: center;
            width: 340px;
            border: 2px solid #daccaa;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .login-box h2 {
            color: #b39c6e;
            margin-bottom: 18px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-box input {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 12px;
            border: 1px solid #daccaa;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .login-box input:focus {
            border-color: #b39c6e;
        }

        .login-box button {
            width: 100%;
            padding: 11px;
            background: #b39c6e;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #968157;
        }

        #login-error {
            color: #d32f2f;
            margin-top: 10px;
            font-size: 0.82rem;
            display: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px 40px;
            }
            h1 {
                font-size: 1.35rem;
            }
            thead th, tbody td {
                padding: 10px 8px;
            }
            .brand-img {
                width: 48px;
                height: 48px;
            }
            .chain-logo {
                max-width: 75px;
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <div id="auth-modal">
        <div class="login-box">
            <h2>Yar-Yur System</h2>
            <input type="email" id="email-input" placeholder="Correo electrónico">
            <input type="password" id="password-input" placeholder="Contraseña">
            <button id="btn-login">Ingresar</button>
            <div id="login-error">Credenciales incorrectas.</div>
        </div>
    </div>

    <div class="page-container">
        <header>
            <h1>Yar-Yur System Canal Moderno Lista de Sucursales</h1>
        </header>

        <div class="summary-bar">
            <div class="summary-item">
                <span>Total Exhibiciones: <strong>16</strong></span>
            </div>
            <div class="summary-item">
                <span class="dot online"></span>
                <span>Online: <strong id="count-online">0</strong></span>
            </div>
            <div class="summary-item">
                <span class="dot offline"></span>
                <span>Offline: <strong id="count-offline">16</strong></span>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID Sistema</th>
                        <th colspan="2">Cadena / Sucursal</th>
                        <th>Estado / Ciudad</th>
                        <th>Marca</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="sucursales-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
            authDomain: "canal-moderno-2655e.firebaseapp.com",
            databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
            projectId: "canal-moderno-2655e",
            storageBucket: "canal-moderno-2655e.firebasestorage.app",
            messagingSenderId: "947512040134",
            appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const sucursalesData = [
            { id: 1,  code: "tablet_01", html: "tablet01.html", sucursal: "Redvital La Yaguara", detalle: "Zona Industrial La Yaguara", logo: "logo-REDVITAL.jpg", estadoCiudad: "Distrito Capital / Caracas", marcaImg: "NIDO.png", marcaAlt: "NIDO" },
            { id: 2,  code: "tablet_02", html: "tablet02.html", sucursal: "Garzón Hiperahorro", detalle: "Av. Rotaria", logo: "logo-GARZON.jpg", estadoCiudad: "Táchira / San Cristóbal", marcaImg: "MULTIMARCA.png", marcaAlt: "MULTIMARCA" },
            { id: 3,  code: "tablet_03", html: "tablet03.html", sucursal: "Redvital La Yaguara", detalle: "Zona Industrial La Yaguara", logo: "logo-REDVITAL.jpg", estadoCiudad: "Distrito Capital / Caracas", marcaImg: "RECETAS.png", marcaAlt: "RECETAS" },
            { id: 4,  code: "tablet_04", html: "tablet04.html", sucursal: "Redvital San Diego", detalle: "Sector San Diego", logo: "logo-REDVITAL.jpg", estadoCiudad: "Carabobo / Valencia", marcaImg: "NIDO.png", marcaAlt: "NIDO" },
            { id: 5,  code: "tablet_05", html: "tablet05.html", sucursal: "Kromi Market Prebo", detalle: "Av. Prebo, C.C. Prebo", logo: "logo-KROMI.jpg", estadoCiudad: "Carabobo / Valencia", marcaImg: "NIDO.png", marcaAlt: "NIDO" },
            { id: 6,  code: "tablet_06", html: "tablet06.html", sucursal: "Euromercado Las Delicias", detalle: "C.C. Las Delicias", logo: "logo-EUROMERCADO.jpg", estadoCiudad: "Aragua / Maracay", marcaImg: "MULTIMARCA.png", marcaAlt: "MULTIMARCA" },
            { id: 7,  code: "tablet_07", html: "tablet07.html", sucursal: "Río Lomas del Sol", detalle: "Los Naranjos", logo: "rio.png", estadoCiudad: "Miranda / Caracas", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 8,  code: "tablet_08", html: "tablet08.html", sucursal: "Fresco Market Caurimare", detalle: "Av. Principal Caurimare", logo: "logo-FRESCO.jpg", estadoCiudad: "Miranda / Caracas", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 9,  code: "tablet_09", html: "tablet09.html", sucursal: "Kromi Market Mañongo", detalle: "Sector Mañongo", logo: "logo-KROMI.jpg", estadoCiudad: "Carabobo / Valencia", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 10, code: "tablet_10", html: "tablet10.html", sucursal: "Río El Cigarral", detalle: "Sector El Cigarral", logo: "rio.png", estadoCiudad: "Miranda / Caracas", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 11, code: "tablet_11", html: "tablet11.html", sucursal: "Río El Recreo", detalle: "C.C. El Recreo", logo: "rio.png", estadoCiudad: "Distrito Capital / Caracas", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 12, code: "tablet_12", html: "tablet12.html", sucursal: "Supermercado Baratta", detalle: "Av. Principal Ferrero Tamayo", logo: "logo-BARATTA.jpg", estadoCiudad: "Táchira / San Cristóbal", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 13, code: "tablet_13", html: "tablet13.html", sucursal: "Kromi Market Prebo", detalle: "Av. Prebo, C.C. Prebo", logo: "logo-KROMI.jpg", estadoCiudad: "Carabobo / Valencia", marcaImg: "SAVOY.png", marcaAlt: "SAVOY" },
            { id: 14, code: "tablet_14", html: "tablet14.html", sucursal: "Inversiones Yar-Yur (El Parral)", detalle: "El Chacal - Parral (Ubicación temporal)", logo: "logo-YARYUR.png", estadoCiudad: "Miranda / San Antonio de Los Altos", marcaImg: "MAGGI.png", marcaAlt: "MAGGI" },
            { id: 15, code: "tablet_15", html: "tablet15.html", sucursal: "Inversiones Yar-Yur (El Bosque)", detalle: "Granja - Bosque (Ubicación temporal)", logo: "logo-YARYUR.png", estadoCiudad: "Miranda / San Antonio de Los Altos", marcaImg: "MAGGI.png", marcaAlt: "MAGGI" },
            { id: 16, code: "tablet_16", html: "tablet16.html", sucursal: "Inversiones Yar-Yur (Las Chimeneas)", detalle: "Las Chimeneas Mañongo (Ubicación temporal)", logo: "logo-YARYUR.png", estadoCiudad: "Miranda / San Antonio de Los Altos", marcaImg: "MAGGI.png", marcaAlt: "MAGGI" }
        ];

        const tbody = document.getElementById('sucursales-tbody');
        const statuses = {};

        function renderTable() {
            tbody.innerHTML = '';
            sucursalesData.forEach(item => {
                statuses[item.id] = 'OFFLINE';
                const tr = document.createElement('tr');
                tr.id = `row-tablet-${item.id}`;
                tr.className = 'row-offline';

                tr.innerHTML = `
                    <td class="id-cell">
                        <a href="${item.html}" target="_blank" title="Abrir ${item.html}">${item.code}</a>
                    </td>
                    <td class="sucursal-name-cell">
                        ${item.sucursal}
                        <span class="sucursal-sub">${item.detalle}</span>
                    </td>
                    <td class="logo-cell">
                        <img src="${item.logo}" alt="${item.sucursal}" class="chain-logo">
                    </td>
                    <td class="location-cell">${item.estadoCiudad}</td>
                    <td class="brand-cell">
                        <img src="${item.marcaImg}" alt="${item.marcaAlt}" class="brand-img">
                    </td>
                    <td class="status-cell">
                        <span id="badge-tablet-${item.id}" class="status-badge offline">
                            <span class="dot offline" id="dot-tablet-${item.id}"></span>
                            <span id="text-tablet-${item.id}">Offline</span>
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        let activeUnsubs = [];
        function iniciarEscuchaRealtime() {
            activeUnsubs.forEach(unsub => unsub());
            activeUnsubs = [];

            sucursalesData.forEach(item => {
                const numFormat = item.id.toString().padStart(2, '0');
                const statusRef = ref(db, `muebles/tablet_${numFormat}/status`);
                const unsub = onValue(statusRef, (snapshot) => {
                    actualizarFilaEstado(item.id, snapshot.val());
                }, (error) => {
                    if (error && error.code === 'PERMISSION_DENIED') {
                        document.getElementById('auth-modal').style.display = 'flex';
                    }
                });
                activeUnsubs.push(unsub);
            });
        }

        function actualizarFilaEstado(id, rawStatus) {
            const isOnline = String(rawStatus || '').toUpperCase() === 'ONLINE';
            statuses[id] = isOnline ? 'ONLINE' : 'OFFLINE';

            const row = document.getElementById(`row-tablet-${id}`);
            const badge = document.getElementById(`badge-tablet-${id}`);
            const dot = document.getElementById(`dot-tablet-${id}`);
            const text = document.getElementById(`text-tablet-${id}`);

            if (row) {
                row.classList.toggle('row-online', isOnline);
                row.classList.toggle('row-offline', !isOnline);
            }
            if (badge) {
                badge.classList.toggle('online', isOnline);
                badge.classList.toggle('offline', !isOnline);
            }
            if (dot) {
                dot.classList.toggle('online', isOnline);
                dot.classList.toggle('offline', !isOnline);
            }
            if (text) {
                text.textContent = isOnline ? 'Online' : 'Offline';
            }

            let onlineTotal = 0;
            for (let i = 1; i <= 16; i++) {
                if (statuses[i] === 'ONLINE') onlineTotal++;
            }
            document.getElementById('count-online').textContent = onlineTotal;
            document.getElementById('count-offline').textContent = 16 - onlineTotal;
        }

        renderTable();
        iniciarEscuchaRealtime();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-modal').style.display = 'none';
                iniciarEscuchaRealtime();
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('password-input').value;
            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    document.getElementById('login-error').style.display = 'none';
                    document.getElementById('auth-modal').style.display = 'none';
                })
                .catch(() => {
                    document.getElementById('login-error').style.display = 'block';
                });
        });
    </script>
</body>
</html>
