<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yar-Yur System - Monitor Interactivo</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; 
    }

    /* --- Botón Pantalla Completa --- */
    .fullscreen-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      cursor: pointer;
      z-index: 1000;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.5); }
    .fullscreen-btn svg { width: 24px; height: 24px; fill: white; }

    /* --- Contenedor Principal (Efecto Flip 3D) --- */
    .flip-container {
      perspective: 1500px;
      width: 100vw;
      height: 100vh;
    }

    .flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.68, -0.15, 0.265, 1.15); 
    }

    .flip-container.flipped .flipper {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden; 
    }

    .front { pointer-events: auto; background-color: #ffffff; }
    .back { pointer-events: none; } 
    
    .flip-container.flipped .front { pointer-events: none; } 
    .flip-container.flipped .back { pointer-events: auto; } 

    /* Imágenes */
    .base-img, .person-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
      pointer-events: none; 
    }

    .person-img { opacity: 0; transition: opacity 1.5s ease-in-out; }
    .person-img.active { opacity: 1; }

    /* Zonas interactivas frontales */
    .click-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 33.33%;
      cursor: pointer;
      z-index: 50;
    }
    .click-zone.left { left: 0; }

    /* --- Interfaz Overlay EN VIVO --- */
    .live-overlay {
      position: absolute;
      top: 50%;
      left: 40%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
      pointer-events: none; 
    }

    .en-vivo-badge {
      color: #ff3333;
      border: 3px solid #ff3333;
      border-radius: 50px;
      padding: 5px 25px;
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff3333;
      box-shadow: 0 0 10px #ff3333, inset 0 0 10px #ff3333;
      animation: heartbeat 2s infinite;
      margin-bottom: 10px;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); opacity: 1; }
      10% { transform: scale(1.1); opacity: 0.8; }
      20% { transform: scale(1); opacity: 1; }
      30% { transform: scale(1.1); opacity: 0.8; }
      40% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .live-count {
      font-size: 4.5rem;
      font-weight: 900;
      color: #000000;
      margin-bottom: 0px;
      text-transform: uppercase;
    }

    .live-timer {
      font-size: 3.5rem;
      font-weight: 900;
      color: #d4af37;
      font-variant-numeric: tabular-nums;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
      transition: color 0.1s;
      transform-origin: center;
      transform: scale(1); 
    }

    .live-timer.recorded {
      color: #2aa12a; 
      animation: timerPulseTwice 0.8s forwards ease-in-out; 
    }

    @keyframes timerPulseTwice {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.3); }  
      50%  { transform: scale(1.05); } 
      75%  { transform: scale(1.3); }   
      100% { transform: scale(1.2); }   
    }

    .live-datetime {
      font-size: 1.3rem;
      color: #bbbbbb;
      margin-top: 5px;
      font-weight: 600;
    }

    .fade-out-up { animation: fadeOutUp 0.5s forwards ease-in; }

    @keyframes fadeOutUp {
      0% { opacity: 1; transform: translateY(-50%); }
      100% { opacity: 0; transform: translateY(-70%); }
    }

    /* --- Cara Trasera (Gráficos) --- */
    .back {
      transform: rotateY(180deg); 
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      box-sizing: border-box;
    }

    .back-content {
      background: #f8f9fa;
      padding: 40px 60px;
      border-radius: 20px;
      width: 95%;
      max-width: 1400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
      text-align: center;
      position: relative;
    }

    /* Controles Superiores */
    .top-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 5px;
      position: relative;
    }

    h1 {
      color: #111;
      letter-spacing: 3px;
      margin: 0;
      text-transform: uppercase;
      font-weight: 800;
      font-size: 2.2rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 1.2rem;
    }

    /* Botones de Icono (Zoom y Métrica) */
    .icon-btn {
      background: #ffffff;
      border: 2px solid #ddd;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .icon-btn:hover { background: #f0f0f0; transform: scale(1.1); }
    .icon-btn svg { width: 22px; height: 22px; fill: #333; }

    .metric-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 55px;
      height: 55px;
      border-color: #ccc;
    }

    /* Contenedor del Gráfico y Flechas */
    .chart-layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 50vh;
      position: relative;
      overflow: hidden; 
    }

    .nav-arrow {
      background: rgba(0, 0, 0, 0.05);
      border: none;
      border-radius: 12px;
      width: 50px;
      height: 100px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, transform 0.2s;
      z-index: 10;
    }
    .nav-arrow:hover { background: rgba(0, 0, 0, 0.15); transform: scale(1.05); }
    .nav-arrow svg { width: 30px; height: 30px; fill: #555; }
    .nav-arrow:disabled { opacity: 0; cursor: default; pointer-events: none; }

    .chart-container {
      position: relative;
      height: 100%;
      flex-grow: 1;
      padding: 0 20px;
      box-sizing: border-box;
      will-change: transform, opacity;
    }

    /* Animaciones de Navegación del Gráfico */
    .slide-out-left { animation: slideOutLeft 0.4s forwards ease-in-out; }
    .slide-in-right { animation: slideInRight 0.4s forwards ease-in-out; }
    .slide-out-right { animation: slideOutRight 0.4s forwards ease-in-out; }
    .slide-in-left { animation: slideInLeft 0.4s forwards ease-in-out; }

    @keyframes slideOutLeft { to { transform: translateX(-100%); opacity: 0; } }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOutRight { to { transform: translateX(100%); opacity: 0; } }
    @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .hint {
      margin-top: 25px;
      color: #888;
      font-size: 0.9rem;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
      cursor: pointer;
      padding: 10px 20px;
      display: inline-block;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
    }
    .hint:hover { background-color: rgba(0,0,0,0.05); color: #333; }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, query, orderByChild, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
      authDomain: "canal-moderno-2655e.firebaseapp.com",
      databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
      projectId: "canal-moderno-2655e",
      storageBucket: "canal-moderno-2655e.firebasestorage.app",
      messagingSenderId: "947512040134",
      appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        elem.requestFullscreen?.() || elem.webkitRequestFullscreen?.() || elem.msRequestFullscreen?.();
      } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.msExitFullscreen?.();
      }
    });

    const configTablets = {
      1: { ids: [1, 2, 3, 4, 5], colorBg: 'rgba(255, 206, 86, 0.8)', colorBorder: 'rgb(255, 206, 86)', name: 'NIDO REDVITAL LA YAGUARA' },
      2: { ids: [1, 2, 3, 4, 5], colorBg: 'rgba(54, 162, 235, 0.8)', colorBorder: 'rgb(54, 162, 235)', name: 'MUEBLE MULTICATEGORÍA' },
      3: { ids: [1, 2, 3, 4, 5], colorBg: 'rgba(255, 99, 132, 0.8)', colorBorder: 'rgb(255, 99, 132)', name: 'MUEBLE RECETAS' }
    };

    // --- VARIABLES GLOBALES DEL HISTORIAL Y CÁLCULO FIFO ---
    let tabletActualEnGrafico = null; 
    const todosLosEventos = { 1: [], 2: [], 3: [] }; 
    const llegadasPendientes = { 1: [], 2: [], 3: [] }; // Cola FIFO para calcular tiempos de permanencia reales
    
    const VIEW_LEVELS = ['hour', 'day', 'month', 'year'];
    let currentViewLevel = 'hour'; 
    let currentViewDate = new Date(); 
    let currentMetric = 'count'; 

    // --- VARIABLES DEL OVERLAY EN VIVO ---
    const estadoVisual = { 1: [], 2: [], 3: [] }; 
    let conteosActuales = { 1: 0, 2: 0, 3: 0 };
    let isOverlayActive = false;
    let overlayStartTime = 0;
    let overlayTimerInterval = null;
    let stopTimeout1 = null;
    let stopTimeout2 = null;
    let isInitialLoad = true;

    setTimeout(() => { 
      isInitialLoad = false; 
      updateLiveOverlay(); 
    }, 1500);

    // Formateador Helper
    function formatHourAMPM(date, includeMinutes = false) {
      let hours = date.getHours();
      let minutes = date.getMinutes();
      const ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12;
      hours = hours ? hours : 12; 
      if(includeMinutes) {
        return `${hours}:${minutes.toString().padStart(2, '0')}${ampm}`;
      }
      return `${hours}${ampm}`;
    }

    // Inicialización del Gráfico Chart.js
    const ctx = document.getElementById('main-chart').getContext('2d');
    const mainChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: [], datasets: [{ label: 'Data', data: [], backgroundColor: '#000', borderRadius: 4 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 400, easing: 'easeOutQuart' },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#eaeaea' } },
          x: { grid: { display: false } }
        },
        interaction: { mode: 'index', intersect: false },
        plugins: { 
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(0, 0, 0, 0.8)', titleFont: { size: 16 }, bodyFont: { size: 14 }, padding: 12, displayColors: false,
            callbacks: {
              title: function(context) { return context[0].label; },
              label: function(context) {
                const val = context.raw;
                if(currentMetric === 'time') return val + ' segs (promedio)';
                return val === 1 ? '1 persona' : val + ' personas';
              }
            }
          }
        }
      }
    });

    // Función principal para procesar datos y actualizar gráfico
    function updateChartDisplay(skipAnimation = false) {
      if (!tabletActualEnGrafico) return;

      const events = todosLosEventos[tabletActualEnGrafico];
      const date = new Date(currentViewDate);
      let labels = [];
      let dataBuckets = [];
      let countBuckets = []; 
      let titlePrefix = "";
      let titleSuffix = "";

      // Definir rangos y etiquetas
      if (currentViewLevel === 'hour') {
        titlePrefix = "HORA:";
        titleSuffix = `${formatHourAMPM(date, true).replace(/:\d+/, ':00')} - ${formatHourAMPM(date, true).replace(/:\d+/, ':59')} (${date.toLocaleDateString('es-ES')})`;
        for(let i=0; i<60; i++) {
          let d = new Date(date); d.setMinutes(i);
          labels.push(formatHourAMPM(d, true));
        }
        dataBuckets = new Array(60).fill(0);
        countBuckets = new Array(60).fill(0);
      } 
      else if (currentViewLevel === 'day') {
        titlePrefix = "DÍA:";
        titleSuffix = date.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        for(let i=0; i<24; i++) {
          let d = new Date(date); d.setHours(i);
          labels.push(formatHourAMPM(d, false));
        }
        dataBuckets = new Array(24).fill(0);
        countBuckets = new Array(24).fill(0);
      }
      else if (currentViewLevel === 'month') {
        titlePrefix = "MES:";
        titleSuffix = date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
        const daysInMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        for(let i=1; i<=daysInMonth; i++) labels.push(`${i}`);
        dataBuckets = new Array(daysInMonth).fill(0);
        countBuckets = new Array(daysInMonth).fill(0);
      }
      else if (currentViewLevel === 'year') {
        titlePrefix = "AÑO:";
        titleSuffix = date.getFullYear().toString();
        labels = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        dataBuckets = new Array(12).fill(0);
        countBuckets = new Array(12).fill(0);
      }

      // Procesar eventos para el gráfico actual
      events.forEach(ev => {
        const evDate = new Date(ev.timestamp);
        // Filtros de fecha
        if (currentViewLevel === 'hour' && (evDate.getFullYear() !== date.getFullYear() || evDate.getMonth() !== date.getMonth() || evDate.getDate() !== date.getDate() || evDate.getHours() !== date.getHours())) return;
        if (currentViewLevel === 'day' && (evDate.getFullYear() !== date.getFullYear() || evDate.getMonth() !== date.getMonth() || evDate.getDate() !== date.getDate())) return;
        if (currentViewLevel === 'month' && (evDate.getFullYear() !== date.getFullYear() || evDate.getMonth() !== date.getMonth())) return;
        if (currentViewLevel === 'year' && (evDate.getFullYear() !== date.getFullYear())) return;

        const conteoPrevio = ev.conteoAnterior || 0;
        
        // Solo analizamos las LLEGADAS (cuando el sistema sumó +1 o más a la barra amarilla)
        if (ev.conteoActual > conteoPrevio) {
          const nuevasDetecciones = ev.conteoActual - conteoPrevio;
          
          let idx = 0;
          if (currentViewLevel === 'hour') idx = evDate.getMinutes();
          else if (currentViewLevel === 'day') idx = evDate.getHours();
          else if (currentViewLevel === 'month') idx = evDate.getDate() - 1;
          else if (currentViewLevel === 'year') idx = evDate.getMonth();

          if (currentMetric === 'count') {
            // Métrica: Cantidad de Personas (Barra Amarilla)
            dataBuckets[idx] += nuevasDetecciones;
          } else {
            // Métrica: Tiempo Promedio (Barra Verde)
            // IMPORTANTE: Por cada persona detectada en este evento (nuevasDetecciones), debemos sumar un tiempo.
            // Así garantizamos que si subió 1 la barra amarilla, obligatoriamente suba el contador de la verde.
            for (let k = 0; k < nuevasDetecciones; k++) {
              let duracion = 0;
              
              if (ev.duracionesReales && ev.duracionesReales[k] !== undefined) {
                // Si la persona ya se fue (ya existe el salto 1 a 0 correspondiente)
                duracion = ev.duracionesReales[k];
              } else {
                // Si la persona sigue frente al monitor (no ha habido salto de 1 a 0),
                // Calculamos el tiempo desde que llegó hasta este preciso segundo.
                duracion = (Date.now() - ev.timestamp) / 1000;
              }
              
              dataBuckets[idx] += duracion;
              countBuckets[idx] += 1;
            }
          }
        }
      });

      // Calcular promedios matemáticos solo para la métrica de tiempo
      if (currentMetric === 'time') {
        for(let i=0; i<dataBuckets.length; i++) {
          if (countBuckets[i] > 0) {
            dataBuckets[i] = Math.round(dataBuckets[i] / countBuckets[i]);
          }
        }
      }

      // Actualizar UI
      document.getElementById('chart-title').innerText = configTablets[tabletActualEnGrafico].name;
      document.getElementById('chart-subtitle').innerText = `${titlePrefix} ${titleSuffix}`;

      const idxLevel = VIEW_LEVELS.indexOf(currentViewLevel);
      document.getElementById('btn-zoom-in').style.display = idxLevel > 0 ? 'flex' : 'none';
      document.getElementById('btn-zoom-out').style.display = idxLevel < VIEW_LEVELS.length - 1 ? 'flex' : 'none';

      const now = new Date();
      let isCurrent = false;
      if (currentViewLevel === 'hour') isCurrent = (date.getHours() === now.getHours() && date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear());
      if (currentViewLevel === 'day') isCurrent = (date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear());
      if (currentViewLevel === 'month') isCurrent = (date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear());
      if (currentViewLevel === 'year') isCurrent = (date.getFullYear() === now.getFullYear());
      
      document.getElementById('btn-next').disabled = isCurrent;

      const colorAmarillo = configTablets[tabletActualEnGrafico].colorBg || '#FFCE56';
      const colorVerde = 'rgba(42, 161, 42, 0.8)'; 
      
      mainChart.data.labels = labels;
      mainChart.data.datasets[0].data = dataBuckets;
      mainChart.data.datasets[0].backgroundColor = currentMetric === 'count' ? colorAmarillo : colorVerde;
      
      if (skipAnimation) mainChart.options.animation = false;
      else mainChart.options.animation = { duration: 400, easing: 'easeOutQuart' };
      
      mainChart.update();
      mainChart.options.animation = { duration: 400, easing: 'easeOutQuart' }; 
    }

    // --- CONTROLES DE INTERFAZ ---
    document.getElementById('btn-metric').addEventListener('click', () => {
      currentMetric = currentMetric === 'count' ? 'time' : 'count';
      document.getElementById('icon-chrono').style.display = currentMetric === 'count' ? 'block' : 'none';
      document.getElementById('icon-user').style.display = currentMetric === 'time' ? 'block' : 'none';
      updateChartDisplay();
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      let idx = VIEW_LEVELS.indexOf(currentViewLevel);
      if (idx < VIEW_LEVELS.length - 1) {
        currentViewLevel = VIEW_LEVELS[idx + 1];
        updateChartDisplay();
      }
    });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      let idx = VIEW_LEVELS.indexOf(currentViewLevel);
      if (idx > 0) {
        currentViewLevel = VIEW_LEVELS[idx - 1];
        currentViewDate = new Date(); 
        updateChartDisplay();
      }
    });

    function changeTime(direction) { 
      const wrapper = document.getElementById('chart-wrapper');
      wrapper.classList.add(direction < 0 ? 'slide-out-right' : 'slide-out-left');
      
      setTimeout(() => {
        const d = new Date(currentViewDate);
        if (currentViewLevel === 'hour') d.setHours(d.getHours() + direction);
        if (currentViewLevel === 'day') d.setDate(d.getDate() + direction);
        if (currentViewLevel === 'month') d.setMonth(d.getMonth() + direction);
        if (currentViewLevel === 'year') d.setFullYear(d.getFullYear() + direction);
        currentViewDate = d;
        
        updateChartDisplay(true); 

        wrapper.classList.remove('slide-out-right', 'slide-out-left');
        wrapper.classList.add(direction < 0 ? 'slide-in-left' : 'slide-in-right');
        
        setTimeout(() => { wrapper.classList.remove('slide-in-left', 'slide-in-right'); }, 400); 
      }, 400);
    }

    document.getElementById('btn-prev').addEventListener('click', () => changeTime(-1));
    document.getElementById('btn-next').addEventListener('click', () => changeTime(1));

    window.flipToChart = function(tabletId) {
      tabletActualEnGrafico = tabletId;
      currentViewLevel = 'hour'; 
      currentViewDate = new Date(); 
      currentMetric = 'count'; 
      document.getElementById('icon-chrono').style.display = 'block';
      document.getElementById('icon-user').style.display = 'none';

      updateChartDisplay();
      document.getElementById('flip-container').classList.add('flipped');
    }

    window.flipToFront = function() {
      document.getElementById('flip-container').classList.remove('flipped');
      setTimeout(() => { tabletActualEnGrafico = null; }, 500); 
    }

    // --- LÓGICA OVERLAY Y SILUETAS ---
    function renderTimer() {
      const now = Date.now();
      const diff = now - overlayStartTime;
      document.getElementById('live-timer').innerText = (diff / 1000).toFixed(1);
      
      const dateObj = new Date();
      const dateString = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
      const timeString = dateObj.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('live-datetime').innerText = `${dateString} | ${timeString}`;
    }

    function updateLiveOverlay() {
      const total = conteosActuales[1] + conteosActuales[2] + conteosActuales[3];
      const overlayEl = document.getElementById('live-overlay');
      const countEl = document.getElementById('live-count');
      const timerEl = document.getElementById('live-timer');

      if (total > 0) {
        clearTimeout(stopTimeout1);
        clearTimeout(stopTimeout2);
        
        if (!isOverlayActive) {
          isOverlayActive = true;
          overlayEl.classList.remove('fade-out-up');
          overlayEl.style.display = 'flex';
          timerEl.classList.remove('recorded');
          overlayStartTime = Date.now();
          overlayTimerInterval = setInterval(renderTimer, 47); 
        }
        countEl.innerText = total === 1 ? "1 persona" : `${total} personas`;
      } else {
        if (isOverlayActive) {
          isOverlayActive = false;
          clearInterval(overlayTimerInterval);
          timerEl.classList.add('recorded'); 
          
          stopTimeout1 = setTimeout(() => {
            overlayEl.classList.add('fade-out-up'); 
            stopTimeout2 = setTimeout(() => {
              overlayEl.style.display = 'none';
              overlayEl.classList.remove('fade-out-up');
            }, 500); 
          }, 1500); 
        }
      }
    }

    function actualizarSiluetas(tabletId, nuevoConteo) {
      const objetivo = Math.min(nuevoConteo, 5); 
      let activasActuales = estadoVisual[tabletId];

      if (objetivo > activasActuales.length) {
        const cantidadAEncender = objetivo - activasActuales.length;
        let inactivas = configTablets[tabletId].ids.filter(id => !activasActuales.includes(id));
        inactivas = inactivas.sort(() => Math.random() - 0.5);

        for (let j = 0; j < cantidadAEncender; j++) {
          const imgId = inactivas[j];
          if (imgId) {
            document.getElementById(`img-${tabletId}-${imgId}`).classList.add('active');
            activasActuales.push(imgId);
          }
        }
      } else if (objetivo < activasActuales.length) {
        const cantidadAApagar = activasActuales.length - objetivo;
        activasActuales = activasActuales.sort(() => Math.random() - 0.5);
        const paraApagar = activasActuales.splice(0, cantidadAApagar); 
        
        for (let j = 0; j < paraApagar.length; j++) {
          const imgId = paraApagar[j];
          document.getElementById(`img-${tabletId}-${imgId}`).classList.remove('active');
        }
      }
      estadoVisual[tabletId] = activasActuales; 
    }

    // --- CONEXIÓN FIREBASE Y PROCESAMIENTO FIFO DE TIEMPOS ---
    for (let i = 1; i <= 3; i++) {
      const numFormat = i.toString().padStart(2, '0'); 
      const eventosQuery = query(ref(db, `muebles/tablet_${numFormat}/eventos`), orderByChild('timestamp'));

      onChildAdded(eventosQuery, (snapshot) => {
        const data = snapshot.val();
        
        if (data && data.timestamp && data.conteoActual !== undefined) {
          
          data.duracionesReales = []; // Aquí almacenaremos el tiempo de la visita cuando termine
          todosLosEventos[i].push(data);

          const conteoAnterior = data.conteoAnterior || 0;
          const conteoActual = data.conteoActual;

          // LÓGICA FIFO PARA ESTAMPAS DE TIEMPO
          if (conteoActual > conteoAnterior) {
            // Si llegan personas, las empujamos a la cola de "Llegadas Pendientes"
            const diferencia = conteoActual - conteoAnterior;
            for (let k = 0; k < diferencia; k++) {
              llegadasPendientes[i].push(data);
            }
          } else if (conteoActual < conteoAnterior) {
            // Si se van personas, sacamos de la cola de pendientes y calculamos el tiempo
            const diferencia = conteoAnterior - conteoActual;
            for (let k = 0; k < diferencia; k++) {
              if (llegadasPendientes[i].length > 0) {
                // Saca el primer evento de llegada que ocurrió
                const eventoLlegada = llegadasPendientes[i].shift(); 
                
                // Resta de las estampas de tiempo (milisegundos a segundos)
                const duracionSegundos = (data.timestamp - eventoLlegada.timestamp) / 1000;
                
                // Se lo asignamos al objeto original de llegada para que la gráfica lo lea
                eventoLlegada.duracionesReales.push(duracionSegundos);
              }
            }
          }

          // Lógica en VIVO para el Monitor Frontal
          actualizarSiluetas(i, conteoActual);
          conteosActuales[i] = conteoActual;
          
          if (!isInitialLoad) {
            updateLiveOverlay();
            if (tabletActualEnGrafico === i) {
               // Si estamos viendo el gráfico en verde, forzamos un redibujado contínuo del último segundo
               updateChartDisplay(); 
            }
          }
        }
      });
      
      // Función extra para hacer "tictac" a los usuarios que siguen activos mientras vemos la gráfica verde
      setInterval(() => {
          if (tabletActualEnGrafico === i && currentMetric === 'time' && llegadasPendientes[i].length > 0) {
              updateChartDisplay(true); // actualiza en vivo sin animación para ver crecer el tiempo
          }
      }, 1000);
    }
  </script>
