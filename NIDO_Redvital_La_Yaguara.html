<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yar-Yur System - Monitor Interactivo</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; 
    }

    /* --- Botón Pantalla Completa --- */
    .fullscreen-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      cursor: pointer;
      z-index: 1000;
      transition: background 0.3s;
    }
    .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.5); }

    /* --- Contenedor Principal (Efecto Flip 3D) --- */
    .flip-container {
      perspective: 1500px;
      width: 100vw;
      height: 100vh;
    }

    .flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.68, -0.15, 0.265, 1.15); 
    }

    .flip-container.flipped .flipper {
      transform: rotateY(180deg);
    }

    /* Caras del interactivo */
    .front, .back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden; 
    }

    .front { pointer-events: auto; background-color: #ffffff; }
    .back { pointer-events: none; } 
    
    .flip-container.flipped .front { pointer-events: none; } 
    .flip-container.flipped .back { pointer-events: auto; } 

    /* Imágenes */
    .base-img, .person-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
      pointer-events: none; 
    }

    .person-img {
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .person-img.active {
      opacity: 1;
    }

    /* Zonas interactivas frontales (Solo botón izquierdo) */
    .click-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 33.33%;
      cursor: pointer;
      z-index: 50;
    }
    .click-zone.left { left: 0; }

    /* --- Interfaz Overlay EN VIVO --- */
    .live-overlay {
      position: absolute;
      top: 50%;
      left: 40%; /* Descentrado hacia la derecha */
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
      pointer-events: none; /* No interfiere con los clics de las zonas */
    }

    .en-vivo-badge {
      color: #ff3333;
      border: 3px solid #ff3333;
      border-radius: 50px;
      padding: 5px 25px;
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff3333;
      box-shadow: 0 0 10px #ff3333, inset 0 0 10px #ff3333;
      /* Modificado: Duración más larga para dar sensación de pausa */
      animation: heartbeat 2s infinite;
      margin-bottom: 10px;
    }

    /* Modificado: Latido concentrado al principio y descanso al final */
    @keyframes heartbeat {
      0% { transform: scale(1); opacity: 1; }
      10% { transform: scale(1.1); opacity: 0.8; }
      20% { transform: scale(1); opacity: 1; }
      30% { transform: scale(1.1); opacity: 0.8; }
      40% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .live-count {
      font-size: 4.5rem;
      font-weight: 900;
      color: #000000;
      margin-bottom: 0px;
      text-transform: uppercase;
    }

    .live-timer {
      font-size: 3.5rem;
      font-weight: 900;
      color: #d4af37; /* Amarillo oscuro/dorado */
      font-variant-numeric: tabular-nums;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
      transition: color 0.1s;
      transform-origin: center; /* Asegura que el latido crezca desde el centro */
    }

    /* Modificado: Verde más oscuro y animación de latido */
    .live-timer.recorded {
      color: #2aa12a; /* Verde grama un poco más oscuro */
      animation: timerPulse 0.5s infinite ease-in-out; 
    }

    /* Nueva animación de latido para el temporizador verde */
    @keyframes timerPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); } /* Crece el número un 15% */
      100% { transform: scale(1); }
    }

    .live-datetime {
      font-size: 1.3rem;
      color: #bbbbbb;
      margin-top: 5px;
      font-weight: 600;
    }

    /* Animación de desaparición (guardado) */
    .fade-out-up {
      animation: fadeOutUp 0.5s forwards ease-in;
    }

    @keyframes fadeOutUp {
      0% { opacity: 1; transform: translateY(-50%); }
      100% { opacity: 0; transform: translateY(-70%); }
    }


    /* --- Cara trasera --- */
    .back {
      transform: rotateY(180deg); 
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      box-sizing: border-box;
    }

    .back-content {
      background: #f8f9fa;
      padding: 40px;
      border-radius: 20px;
      width: 90%;
      max-width: 1200px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
      text-align: center;
    }

    h1 {
      color: #111;
      letter-spacing: 3px;
      margin-top: 0;
      margin-bottom: 10px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .chart-container {
      position: relative;
      height: 50vh;
      width: 100%;
    }

    .hint {
      margin-top: 30px;
      color: #888;
      font-size: 0.9rem;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
      cursor: pointer;
      padding: 10px 20px;
      display: inline-block;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
    }

    .hint:hover {
      background-color: rgba(0,0,0,0.05);
      color: #333;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <button id="fullscreen-btn" class="fullscreen-btn" title="Pantalla Completa"></button>

  <div class="flip-container" id="flip-container">
    <div class="flipper">
      
      <div class="front">
        <img src="NIDO_MONITOR fondo.jpg" class="base-img" alt="Exhibidores Yar-Yur">
        
        <img src="persona 1.png" class="person-img" id="img-1-1">
        <img src="persona 2.png" class="person-img" id="img-1-2">
        <img src="persona 3.png" class="person-img" id="img-1-3">
        <img src="persona 4.png" class="person-img" id="img-1-4">
        <img src="persona 5.png" class="person-img" id="img-1-5">

        <img src="2-1.png" class="person-img" id="img-2-1">
        <img src="2-2.png" class="person-img" id="img-2-2">
        <img src="2-3.png" class="person-img" id="img-2-3">
        <img src="2-4.png" class="person-img" id="img-2-4">
        <img src="2-5.png" class="person-img" id="img-2-5">

        <img src="3-1.png" class="person-img" id="img-3-1">
        <img src="3-2.png" class="person-img" id="img-3-2">
        <img src="3-3.png" class="person-img" id="img-3-3">
        <img src="3-4.png" class="person-img" id="img-3-4">
        <img src="3-5.png" class="person-img" id="img-3-5">

        <div class="live-overlay" id="live-overlay" style="display: none;">
          <div class="en-vivo-badge">EN VIVO</div>
          <div class="live-count" id="live-count">1 persona</div>
          <div class="live-timer" id="live-timer">0.0</div>
          <div class="live-datetime" id="live-datetime">--</div>
        </div>

        <div class="click-zone left" onclick="flipToChart(1)"></div>
      </div>

      <div class="back">
        <div class="back-content">
          <h1 id="chart-title">YAR-YUR SYSTEM</h1>
          <div id="chart-subtitle" class="subtitle">Tráfico de personas</div>
          <div class="chart-container">
            <canvas id="main-chart"></canvas>
          </div>
          <div class="hint" onclick="flipToFront()">Toca aquí para volver al exhibidor interactivo</div>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, query, orderByChild, startAt, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
      authDomain: "canal-moderno-2655e.firebaseapp.com",
      databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
      projectId: "canal-moderno-2655e",
      storageBucket: "canal-moderno-2655e.firebasestorage.app",
      messagingSenderId: "947512040134",
      appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        elem.requestFullscreen?.() || elem.webkitRequestFullscreen?.() || elem.msRequestFullscreen?.();
      } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.msExitFullscreen?.();
      }
    });

    const currentHour = new Date().getHours();
    setInterval(() => {
      if (new Date().getHours() !== currentHour) location.reload(); 
    }, 60000);

    const startOfHourDate = new Date();
    startOfHourDate.setMinutes(0, 0, 0);
    const startTimestamp = startOfHourDate.getTime();
    const labelsMinutos = Array.from({length: 60}, (_, i) => i.toString().padStart(2, '0'));

    const configTablets = {
      1: { ids: [1, 2, 3, 4, 5], colorBg: 'rgba(255, 206, 86, 0.8)', colorBorder: 'rgb(255, 206, 86)', name: 'MUEBLE NIDO' },
      2: { ids: [1, 2, 3, 4, 5], colorBg: 'rgba(54, 162, 235, 0.8)', colorBorder: 'rgb(54, 162, 235)', name: 'MUEBLE MULTICATEGORÍA' },
      3: { ids: [1, 2, 3, 4, 5], colorBg: 'rgba(255, 99, 132, 0.8)', colorBorder: 'rgb(255, 99, 132)', name: 'MUEBLE RECETAS' }
    };

    const estadoVisual = { 1: [], 2: [], 3: [] }; 
    const dataHistogramas = { 1: new Array(60).fill(0), 2: new Array(60).fill(0), 3: new Array(60).fill(0) };
    let tabletActualEnGrafico = null; 

    // --- VARIABLES DEL OVERLAY EN VIVO ---
    let conteosActuales = { 1: 0, 2: 0, 3: 0 };
    let isOverlayActive = false;
    let overlayStartTime = 0;
    let overlayTimerInterval = null;
    let stopTimeout1 = null;
    let stopTimeout2 = null;
    
    // Bandera para evitar que la carga masiva del historial dispare la interfaz de "EN VIVO"
    let isInitialLoad = true;
    setTimeout(() => { 
      isInitialLoad = false; 
      updateLiveOverlay(); 
    }, 1500);

    function renderTimer() {
      const now = Date.now();
      const diff = now - overlayStartTime;
      
      // Modificado: Se formatea a 1 solo decimal
      document.getElementById('live-timer').innerText = (diff / 1000).toFixed(1);
      
      const dateObj = new Date();
      const dateString = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
      const timeString = dateObj.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('live-datetime').innerText = `${dateString} | ${timeString}`;
    }

    function updateLiveOverlay() {
      const total = conteosActuales[1] + conteosActuales[2] + conteosActuales[3];
      const overlayEl = document.getElementById('live-overlay');
      const countEl = document.getElementById('live-count');
      const timerEl = document.getElementById('live-timer');

      if (total > 0) {
        // Cancelar secuencias de apagado si las hay
        clearTimeout(stopTimeout1);
        clearTimeout(stopTimeout2);
        
        if (!isOverlayActive) {
          isOverlayActive = true;
          overlayEl.classList.remove('fade-out-up');
          overlayEl.style.display = 'flex';
          timerEl.classList.remove('recorded');
          
          overlayStartTime = Date.now();
          overlayTimerInterval = setInterval(renderTimer, 47); // Refresco rápido
        }
        
        countEl.innerText = total === 1 ? "1 persona" : `${total} personas`;
        
      } else {
        if (isOverlayActive) {
          isOverlayActive = false;
          clearInterval(overlayTimerInterval);
          
          // Se vuelve verde el contador (y empieza a latir por el CSS)
          timerEl.classList.add('recorded'); 
          
          // Secuencia de salida "Guardado"
          stopTimeout1 = setTimeout(() => {
            overlayEl.classList.add('fade-out-up'); 
            
            stopTimeout2 = setTimeout(() => {
              overlayEl.style.display = 'none';
              overlayEl.classList.remove('fade-out-up');
            }, 500); 
            
          }, 1500); // Mantiene los 1.5 segundos en pantalla latiendo en verde
        }
      }
    }


    const ctx = document.getElementById('main-chart').getContext('2d');
    const mainChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labelsMinutos,
        datasets: [{
          label: 'Personas',
          data: [],
          backgroundColor: '#000',
          borderColor: '#000',
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 500, easing: 'easeOutQuart' },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 }, grid: { color: '#eaeaea' } },
          x: { grid: { display: false } }
        },
        interaction: { mode: 'index', intersect: false },
        plugins: { 
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(0, 0, 0, 0.8)',
            titleFont: { size: 16, family: "'Segoe UI', sans-serif" },
            bodyFont: { size: 14, family: "'Segoe UI', sans-serif" },
            padding: 12,
            displayColors: false,
            callbacks: {
              title: function(context) {
                const minuto = context[0].label;
                let hr = currentHour;
                const ampm = hr >= 12 ? 'pm' : 'am';
                hr = hr % 12;
                hr = hr ? hr : 12; 
                return `${hr}:${minuto}${ampm}`;
              },
              label: function(context) {
                const cantidad = context.raw;
                if(cantidad === 1) return cantidad + ' persona';
                return cantidad + ' personas';
              }
            }
          }
        }
      }
    });

    window.flipToChart = function(tabletId) {
      tabletActualEnGrafico = tabletId;
      
      let hr = currentHour % 12;
      hr = hr ? hr : 12;
      const ampm = currentHour >= 12 ? 'pm' : 'am';
      const formatTime = `${hr}:00${ampm} - ${hr}:59${ampm}`;
      
      document.getElementById('chart-title').innerText = configTablets[tabletId].name;
      document.getElementById('chart-subtitle').innerText = `Hora: ${formatTime}`;
      
      mainChart.data.datasets[0].data = dataHistogramas[tabletId];
      mainChart.data.datasets[0].backgroundColor = configTablets[tabletId].colorBg;
      mainChart.data.datasets[0].borderColor = configTablets[tabletId].colorBorder;
      mainChart.update();

      document.getElementById('flip-container').classList.add('flipped');
    }

    window.flipToFront = function() {
      document.getElementById('flip-container').classList.remove('flipped');
      tabletActualEnGrafico = null;
    }

    function actualizarSiluetas(tabletId, nuevoConteo) {
      const objetivo = Math.min(nuevoConteo, 5); 
      let activasActuales = estadoVisual[tabletId];

      if (objetivo > activasActuales.length) {
        const cantidadAEncender = objetivo - activasActuales.length;
        let inactivas = configTablets[tabletId].ids.filter(id => !activasActuales.includes(id));
        inactivas = inactivas.sort(() => Math.random() - 0.5);

        for (let j = 0; j < cantidadAEncender; j++) {
          const imgId = inactivas[j];
          if (imgId) {
            document.getElementById(`img-${tabletId}-${imgId}`).classList.add('active');
            activasActuales.push(imgId);
          }
        }
      } else if (objetivo < activasActuales.length) {
        const cantidadAApagar = activasActuales.length - objetivo;
        activasActuales = activasActuales.sort(() => Math.random() - 0.5);
        const paraApagar = activasActuales.splice(0, cantidadAApagar); 
        
        for (let j = 0; j < paraApagar.length; j++) {
          const imgId = paraApagar[j];
          document.getElementById(`img-${tabletId}-${imgId}`).classList.remove('active');
        }
      }
      
      estadoVisual[tabletId] = activasActuales; 
    }

    for (let i = 1; i <= 3; i++) {
      const numFormat = i.toString().padStart(2, '0'); 
      
      const eventosQuery = query(
        ref(db, `muebles/tablet_${numFormat}/eventos`), 
        orderByChild('timestamp'), 
        startAt(startTimestamp)
      );

      onChildAdded(eventosQuery, (snapshot) => {
        const data = snapshot.val();
        
        if (data && data.timestamp && data.conteoActual !== undefined) {
          
          actualizarSiluetas(i, data.conteoActual);

          // Actualiza el estado global de la tablet para el Overlay
          conteosActuales[i] = data.conteoActual;
          if (!isInitialLoad) {
            updateLiveOverlay();
          }

          const conteoAnterior = data.conteoAnterior || 0;
          if (data.conteoActual > conteoAnterior) {
            const eventDate = new Date(data.timestamp);
            const minutoDelEvento = eventDate.getMinutes();
            
            const nuevasDetecciones = data.conteoActual - conteoAnterior;
            dataHistogramas[i][minutoDelEvento] += nuevasDetecciones;
            
            if (tabletActualEnGrafico === i) {
              mainChart.update(); 
            }
          }
        }
      });
    }
  </script>
</body>
</html>
