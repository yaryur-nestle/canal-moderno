<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <!-- Integración de la biblioteca principal de Leaflet.js (CSS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        /* 
         * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL
         * Reseteo de márgenes para asegurar el uso total del área de visualización.
         */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 
         * ESTÉTICA DEL LIENZO BASE
         * El fondo blanco puro responde al requerimiento de minimalismo extremo.
         * La tipografía cursiva/informal establece el tono "caricaturesco".
         */
        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 
         * CONTENEDOR DEL MAPA (VIÑETA DE CÓMIC)
         * El área cartográfica se enmarca con un borde masivo y una sombra no difuminada
         * (solid drop-shadow) típica de la impresión de tiras cómicas de mediados de siglo.
         */
        #map-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 6px solid #000000;
            border-radius: 20px;
            box-shadow: 15px 15px 0px #000000;
            position: relative;
            z-index: 1;
        }

        /* Instancia interna donde el motor SVG operará */
        #map {
            width: 100%;
            height: 100%;
            border-radius: 14px; 
            background-color: transparent;
        }

        /* 
         * INGENIERÍA DE MARCADORES PERSONALIZADOS (L.divIcon)
         * Se purgan los fondos automáticos que Leaflet impone a las capas de iconos div.
         */
        .leaflet-div-icon {
            background: transparent !important;
            border: none !important;
        }

        /*
         * DISEÑO DEL PIN CARICATURESCO
         * Círculo con relleno vibrante, contorno pesado y sombra dura proyectada
         * generada mediante el procesamiento de filtros SVG en el navegador.
         */
        .comic-marker-pin {
            width: 28px;
            height: 28px;
            background-color: #ff2a2a; 
            border: 4px solid #000000; 
            border-radius: 50%; 
            filter: drop-shadow(5px 5px 0px rgba(0,0,0,1));
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            left: -14px; /* Centrado absoluto respecto al ancla espacial */
            top: -14px;
        }

        /* 
         * MICRO-INTERACCIONES (HOVER STATE)
         * Al interactuar, el marcador se expande, rota levemente y altera su color,
         * transmitiendo una retroalimentación visual elástica e informal.
         */
        .comic-marker-pin:hover {
            transform: scale(1.4) rotate(-15deg);
            background-color: #ffd700; 
            z-index: 1000 !important;
        }

        /* 
         * REESCRITURA DE LA HERRAMIENTA EMERGENTE (TOOLTIP)
         * Se asalta el bloque de clases nativo de Leaflet para imponer el estilo de la interfaz.
         */
        .leaflet-tooltip.comic-speech-bubble {
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 15px;
            color: #000000;
            font-family: inherit;
            font-size: 20px; /* Tamaño maximizado para legibilidad inmediata */
            font-weight: 900;
            padding: 12px 20px;
            box-shadow: 8px 8px 0px #000000; /* Sombra sólida desplazada */
            white-space: nowrap;
            text-align: center;
            text-transform: uppercase;
        }

        /* 
         * SUPRESIÓN DE LA FLECHA NATIVA DEL TOOLTIP
         * Las especificaciones exigen una burbuja flotante pura; los bordes direccionales
         * generados por pseudo-elementos arruinan la ilusión de la tinta sólida negra.
         */
        .leaflet-tooltip-left.comic-speech-bubble::before,
        .leaflet-tooltip-right.comic-speech-bubble::before,
        .leaflet-tooltip-top.comic-speech-bubble::before,
        .leaflet-tooltip-bottom.comic-speech-bubble::before {
            display: none !important;
        }

        /* Fuerza la opacidad total independientemente de la transición del motor de Leaflet */
        .leaflet-tooltip {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <!-- Marco principal que encapsula el escenario cartográfico -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Carga del motor JavaScript de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* 
             * 1. INICIALIZACIÓN DEL SISTEMA DE REFERENCIA DE COORDENADAS (CRS)
             * Construcción del objeto mapa. Se posiciona el centro de la cámara
             * en un vector promedio que abarca la extensión latitudinal y longitudinal
             * de Venezuela. Se desactivan los controles predeterminados.
             */
            const map = L.map('map', {
                center: [7.5, -66.0],     // Epicentro aproximado del país
                zoom: 6,                  // Nivel de escala inicial
                zoomControl: false,       // Inhabilitación de botones interactivos de zoom
                attributionControl: false // Eliminación de hipervínculos de atribución
            });

            /* 
             * 2. MODELADO DE DATOS DE LOS NODOS COMERCIALES
             * Matriz de objetos que representa las cinco localizaciones dictaminadas.
             * Las coordenadas geodésicas han sido previamente auditadas y estructuradas.
             */
            const retailNodes = [
                { id: 1, sucursal: "Kromi Market", lat: 10.2225, lng: -68.0160 },
                { id: 2, sucursal: "Red Vital San Diego", lat: 10.2540, lng: -67.9510 },
                { id: 3, sucursal: "Red Vital La Yaguara", lat: 10.4772, lng: -66.9597 },
                { id: 4, sucursal: "Garzón Hiperahorro", lat: 7.7669, lng: -72.2250 },
                { id: 5, sucursal: "Luxor Círculo Militar", lat: 10.2670, lng: -67.5950 }
            ];

            /* 
             * 3. ADQUISICIÓN DE LA GEOMETRÍA NACIONAL (GEOJSON ASÍNCRONO)
             * Se realiza una petición de red a un repositorio público que provee
             * un mapeo poligonal altamente simplificado de los bordes nacionales.
             */
            const geojsonEndpoint = 'https://raw.githubusercontent.com/glynnbird/countriesgeojson/master/venezuela.geojson';

            fetch(geojsonEndpoint)
                .then(response => {
                    if (!response.ok) throw new Error("Fallo en la adquisición de la topología nacional.");
                    return response.json();
                })
                .then(data => {
                    /*
                     * 4. ESTILIZACIÓN Y PROYECCIÓN VECTORIAL
                     * La conversión del JSON en rutas SVG inyectadas directamente en el DOM.
                     * El trazado se define con bordes gruesos e interiores vacíos para
                     * amalgamar el territorio con el lienzo blanco.
                     */
                    L.geoJSON(data, {
                        style: (feature) => ({
                            color: "#000000",       // Contorno negro carbón
                            weight: 4,              // Ancho exagerado del trazo fronterizo
                            fillColor: "#ffffff",   // Mantenimiento estricto del minimalismo (relleno blanco)
                            fillOpacity: 1,         // Máxima opacidad
                            dashArray: "15 10"      // Alternancia de trazo discontínuo estilo costura/dibujo
                        })
                    }).addTo(map);

                    /*
                     * 5. INYECCIÓN DEL ECOSISTEMA DE MARCADORES
                     * Iteración sobre la base de datos de sucursales para instanciar
                     * los componentes visuales y vincular los eventos de interacción.
                     */
                    retailNodes.forEach(node => {
                        
                        // Creación del envoltorio HTML que actuará como marcador espacial
                        const customPin = L.divIcon({
                            html: '<div class="comic-marker-pin"></div>',
                            iconSize: [0, 0], // El tamaño real se maneja por la clase CSS asignada al div interno
                            iconAnchor: [0, 0] // Anclaje centrado para garantizar precisión trigonométrica
                        });

                        // Despliegue del marcador en la proyección Web Mercator subyacente
                        const marker = L.marker([node.lat, node.lng], { icon: customPin }).addTo(map);

                        /*
                         * 6. DESPLIEGUE EXCLUSIVO DE LA MARCA (TOOLTIP)
                         * Satisfaciendo el requerimiento explícito, el tooltip exhibirá
                         * estrictamente el string correspondiente a la denominación de la sucursal.
                         */
                        marker.bindTooltip(node.sucursal, {
                            className: 'comic-speech-bubble', // Aplicación de la hoja de estilos personalizada
                            direction: 'top',                 // Elevación de la burbuja por encima del pin
                            offset: [0, -25],                 // Distancia de separación en el eje vertical
                            permanent: false,                 // Ocultamiento garantizado hasta que ocurra el evento hover
                            opacity: 1
                        });
                    });
                })
                .catch(err => {
                    // Gestión de errores de transferencia para evitar un fallo catastrófico del renderizado
                    console.error('Interrupción del flujo de datos GeoJSON:', err);
                    alert("Aviso Técnico: El polígono geográfico de Venezuela no pudo ser procesado por problemas de red. Sin embargo, el motor continuará inyectando los nodos comerciales en sus coordenadas geodésicas respectivas.");
                });
        });
    </script>
</body>
</html>
