<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #map-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 6px solid #000000;
            border-radius: 20px;
            box-shadow: 15px 15px 0px #000000;
            position: relative;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 14px; 
            background-color: transparent;
        }

        .leaflet-div-icon {
            background: transparent !important;
            border: none !important;
        }

        .comic-marker-pin {
            width: 28px;
            height: 28px;
            background-color: #ff2a2a; 
            border: 4px solid #000000; 
            border-radius: 50%; 
            filter: drop-shadow(5px 5px 0px rgba(0,0,0,1));
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            left: -14px; 
            top: -14px;
        }

        .comic-marker-pin:hover {
            transform: scale(1.4) rotate(-15deg);
            background-color: #ffd700; 
            z-index: 1000 !important;
        }

        .leaflet-tooltip.comic-speech-bubble {
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 15px;
            color: #000000;
            font-family: inherit;
            font-size: 20px; 
            font-weight: 900;
            padding: 12px 20px;
            box-shadow: 8px 8px 0px #000000; 
            white-space: nowrap;
            text-align: center;
            text-transform: uppercase;
        }

        .leaflet-tooltip-left.comic-speech-bubble::before,
        .leaflet-tooltip-right.comic-speech-bubble::before,
        .leaflet-tooltip-top.comic-speech-bubble::before,
        .leaflet-tooltip-bottom.comic-speech-bubble::before {
            display: none !important;
        }

        .leaflet-tooltip {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* 1. INICIALIZACIÓN DEL MAPA */
            const map = L.map('map', {
                center: [6.5, -64.5],     
                zoom: 5.5,                
                zoomControl: true,        
                attributionControl: false 
            });

            /* 2. MAPA BASE (TILE LAYER) */
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            /* 3. LÓGICA DE LA MÁSCARA (POLÍGONO INVERTIDO) */
            // Usamos CDN jsDelivr para mayor estabilidad de red
            const geojsonEndpoint = 'https://cdn.jsdelivr.net/gh/Veneu/venezuela-geojson@master/estados.geojson';

            fetch(geojsonEndpoint)
                .then(response => {
                    if (!response.ok) throw new Error("Fallo en la red al cargar las fronteras.");
                    return response.json();
                })
                .then(data => {
                    // a. Creamos las coordenadas de un cuadrado gigante que tapa todo el mundo
                    const worldCoords = [
                        [90, -180], [90, 180], [-90, 180], [-90, -180], [90, -180]
                    ];
                    
                    // b. Iniciamos el arreglo que contendrá el mundo + los "huecos" de Venezuela
                    let maskCoords = [worldCoords];

                    // c. Iteramos sobre cada estado de Venezuela para recortarlo de la sábana blanca
                    data.features.forEach(feature => {
                        const type = feature.geometry.type;
                        const coords = feature.geometry.coordinates;

                        if (type === 'Polygon') {
                            // Leaflet usa [Lat, Lng] pero GeoJSON viene en [Lng, Lat], así que lo invertimos
                            let hole = coords[0].map(c => [c[1], c[0]]);
                            maskCoords.push(hole);
                        } else if (type === 'MultiPolygon') {
                            coords.forEach(poly => {
                                let hole = poly[0].map(c => [c[1], c[0]]);
                                maskCoords.push(hole);
                            });
                        }
                    });

                    // d. Renderizamos la sábana blanca gigante sobre el mapa
                    L.polygon(maskCoords, {
                        color: "#000000",      // Color de las líneas que dividen los estados (el borde del hueco)
                        weight: 1,             // Línea delgada y continua
                        fillColor: "#ffffff",  // El color que tapará a los demás países (blanco puro)
                        fillOpacity: 1         // 100% de opacidad para que no se vea nada a través de la máscara
                    }).addTo(map);
                })
                .catch(err => {
                    console.error('No se pudo aplicar la máscara de países:', err);
                    // Si esto falla por red, simplemente se verán los demás países, pero el mapa no se romperá.
                });

            /* 4. MARCADORES DE LAS SUCURSALES */
            const retailNodes = [
                { id: 1, sucursal: "Kromi Market", lat: 10.2225, lng: -68.0160 },
                { id: 2, sucursal: "Red Vital San Diego", lat: 10.2540, lng: -67.9510 },
                { id: 3, sucursal: "Red Vital La Yaguara", lat: 10.4772, lng: -66.9597 },
                { id: 4, sucursal: "Garzón Hiperahorro", lat: 7.7669, lng: -72.2250 },
                { id: 5, sucursal: "Luxor Círculo Militar", lat: 10.2670, lng: -67.5950 }
            ];

            retailNodes.forEach(node => {
                const customPin = L.divIcon({
                    html: '<div class="comic-marker-pin"></div>',
                    iconSize: [0, 0], 
                    iconAnchor: [0, 0] 
                });

                const marker = L.marker([node.lat, node.lng], { icon: customPin }).addTo(map);

                marker.bindTooltip(node.sucursal, {
                    className: 'comic-speech-bubble', 
                    direction: 'top',                 
                    offset: [0, -25],                 
                    permanent: false,                 
                    opacity: 1
                });
            });
            
        });
    </script>
</body>
</html>
