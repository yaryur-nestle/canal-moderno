<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Minimalista: Red Comercial Venezuela</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        /* * NORMALIZACIÓN Y ESTILIZACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* * ESTÉTICA DEL LIENZO BASE */
        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* * CONTENEDOR DEL MAPA (VIÑETA DE CÓMIC) */
        #map-container {
            width: 90vw;
            height: 90vh;
            background-color: #ffffff;
            border: 6px solid #000000;
            border-radius: 20px;
            box-shadow: 15px 15px 0px #000000;
            position: relative;
            z-index: 1;
        }

        /* Instancia interna donde el motor SVG operará */
        #map {
            width: 100%;
            height: 100%;
            border-radius: 14px; 
            background-color: transparent;
        }

        /* * INGENIERÍA DE MARCADORES PERSONALIZADOS (L.divIcon) */
        .leaflet-div-icon {
            background: transparent !important;
            border: none !important;
        }

        /* * DISEÑO DEL PIN CARICATURESCO */
        .comic-marker-pin {
            width: 28px;
            height: 28px;
            background-color: #ff2a2a; 
            border: 4px solid #000000; 
            border-radius: 50%; 
            filter: drop-shadow(5px 5px 0px rgba(0,0,0,1));
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            left: -14px; 
            top: -14px;
        }

        /* * MICRO-INTERACCIONES (HOVER STATE) */
        .comic-marker-pin:hover {
            transform: scale(1.4) rotate(-15deg);
            background-color: #ffd700; 
            z-index: 1000 !important;
        }

        /* * REESCRITURA DE LA HERRAMIENTA EMERGENTE (TOOLTIP) */
        .leaflet-tooltip.comic-speech-bubble {
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 15px;
            color: #000000;
            font-family: inherit;
            font-size: 20px; 
            font-weight: 900;
            padding: 12px 20px;
            box-shadow: 8px 8px 0px #000000; 
            white-space: nowrap;
            text-align: center;
            text-transform: uppercase;
        }

        /* * SUPRESIÓN DE LA FLECHA NATIVA DEL TOOLTIP */
        .leaflet-tooltip-left.comic-speech-bubble::before,
        .leaflet-tooltip-right.comic-speech-bubble::before,
        .leaflet-tooltip-top.comic-speech-bubble::before,
        .leaflet-tooltip-bottom.comic-speech-bubble::before {
            display: none !important;
        }

        /* Fuerza la opacidad total */
        .leaflet-tooltip {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* 1. INICIALIZACIÓN DEL MAPA */
            const map = L.map('map', {
                center: [6.5, -64.5],     
                zoom: 5.5,                
                zoomControl: true,        
                attributionControl: false 
            });

            /* 2. MAPA BASE: GRIS OSCURO SIN LETRAS (DARK MATTER NO LABELS) */
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            /* 3. SUPERPOSICIÓN DE VENEZUELA (GEOJSON CLARO)
             * Enlace infalible al repositorio global de GeoBoundaries. 
             */
            const geojsonEndpoint = 'https://raw.githubusercontent.com/wmgeolab/geoBoundaries/main/releaseData/gbOpen/VEN/ADM1/geoBoundaries-VEN-ADM1_simplified.geojson';

            fetch(geojsonEndpoint)
                .then(response => {
                    if (!response.ok) throw new Error("Fallo en la red al cargar las fronteras.");
                    return response.json();
                })
                .then(data => {
                    /*
                     * Dibujamos la silueta de los estados de Venezuela sobre el mapa oscuro.
                     * El color blanco ocultará el mapa gris subyacente.
                     */
                    L.geoJSON(data, {
                        style: (feature) => ({
                            color: "#000000",      // Línea divisoria de los estados (Negra)
                            weight: 1,             // Línea delgada y continua
                            fillColor: "#ffffff",  // Relleno de Venezuela (Blanco puro)
                            fillOpacity: 1         // 100% opaco
                        })
                    }).addTo(map);
                })
                .catch(err => {
                    console.error('No se pudo cargar el archivo de las fronteras:', err);
                    alert("No se pudieron cargar las fronteras. Verifica tu conexión a internet o posibles bloqueos de red.");
                });

            /* 4. MARCADORES DE LAS SUCURSALES */
            const retailNodes = [
                { id: 1, sucursal: "Kromi Market", lat: 10.2225, lng: -68.0160 },
                { id: 2, sucursal: "Red Vital San Diego", lat: 10.2540, lng: -67.9510 },
                { id: 3, sucursal: "Red Vital La Yaguara", lat: 10.4772, lng: -66.9597 },
                { id: 4, sucursal: "Garzón Hiperahorro", lat: 7.7669, lng: -72.2250 },
                { id: 5, sucursal: "Luxor Círculo Militar", lat: 10.2670, lng: -67.5950 }
            ];

            retailNodes.forEach(node => {
                const customPin = L.divIcon({
                    html: '<div class="comic-marker-pin"></div>',
                    iconSize: [0, 0], 
                    iconAnchor: [0, 0] 
                });

                const marker = L.marker([node.lat, node.lng], { icon: customPin }).addTo(map);

                marker.bindTooltip(node.sucursal, {
                    className: 'comic-speech-bubble', 
                    direction: 'top',                 
                    offset: [0, -25],                 
                    permanent: false,                 
                    opacity: 1
                });
            });
            
        });
    </script>
</body>
</html>
