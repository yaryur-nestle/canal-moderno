<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Remoto - Yar-Yur System</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-color: #ffffff;
      color: #333333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Botón Pantalla Completa Invisible */
    .fullscreen-btn {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      z-index: 100;
    }

    h1 {
      color: #111;
      letter-spacing: 2px;
      margin-top: 30px;
      margin-bottom: 5px;
      text-align: center;
      text-transform: uppercase;
      font-weight: 800;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .dashboard-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1600px;
    }

    .mueble-col {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .status-badge {
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 15px;
      letter-spacing: 1px;
      width: 80%;
      text-align: center;
      transition: all 0.3s ease;
    }

    .online { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .offline { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }
  </style>
</head>
<body>

  <button id="fullscreen-btn" class="fullscreen-btn" title="Pantalla Completa"></button>

  <h1>Yar-Yur System</h1>
  <div id="hour-subtitle" class="subtitle">Tráfico de personas (Hora Actual)</div>

  <div class="dashboard-container">
    
    <div class="mueble-col">
      <div id="badge-1" class="status-badge offline">TABLET 01 OFFLINE</div>
      <div class="chart-container">
        <canvas id="chart-1"></canvas>
      </div>
    </div>

    <div class="mueble-col">
      <div id="badge-2" class="status-badge offline">TABLET 02 OFFLINE</div>
      <div class="chart-container">
        <canvas id="chart-2"></canvas>
      </div>
    </div>

    <div class="mueble-col">
      <div id="badge-3" class="status-badge offline">TABLET 03 OFFLINE</div>
      <div class="chart-container">
        <canvas id="chart-3"></canvas>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, query, orderByChild, startAt, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBjbMwDALsz7nKRna6W6owbmd6NLCJpEx0",
      authDomain: "canal-moderno-2655e.firebaseapp.com",
      databaseURL: "https://canal-moderno-2655e-default-rtdb.firebaseio.com",
      projectId: "canal-moderno-2655e",
      storageBucket: "canal-moderno-2655e.firebasestorage.app",
      messagingSenderId: "947512040134",
      appId: "1:947512040134:web:f56ba403a9fcd04f3615c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- LÓGICA DE PANTALLA COMPLETA ---
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    });

    // --- CONFIGURACIÓN DEL TIEMPO ---
    const currentHour = new Date().getHours();
    setInterval(() => {
      if (new Date().getHours() !== currentHour) {
        location.reload(); 
      }
    }, 60000);

    const hourStr = currentHour.toString().padStart(2, '0');
    document.getElementById('hour-subtitle').innerText = `Tráfico de personas (${hourStr}:00 - ${hourStr}:59)`;

    const startOfHourDate = new Date();
    startOfHourDate.setMinutes(0, 0, 0);
    const startTimestamp = startOfHourDate.getTime();

    const labelsMinutos = Array.from({length: 60}, (_, i) => i.toString().padStart(2, '0'));

    const configColores = {
      1: { bg: 'rgba(255, 206, 86, 0.8)', border: 'rgb(255, 206, 86)' }, 
      2: { bg: 'rgba(54, 162, 235, 0.8)', border: 'rgb(54, 162, 235)' }, 
      3: { bg: 'rgba(255, 99, 132, 0.8)', border: 'rgb(255, 99, 132)' }  
    };

    const charts = {};

    for (let i = 1; i <= 3; i++) {
      const numFormat = i.toString().padStart(2, '0'); 
      
      const ctx = document.getElementById(`chart-${i}`).getContext('2d');
      const datosIniciales = new Array(60).fill(0);

      charts[i] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labelsMinutos,
          datasets: [{
            label: 'Personas detectadas',
            data: datosIniciales,
            backgroundColor: configColores[i].bg,
            borderColor: configColores[i].border,
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 500,
            easing: 'easeOutQuart'
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                stepSize: 1,
                precision: 0
              },
              grid: { color: '#eaeaea' }
            },
            x: {
              grid: { display: false }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });

      // CONECTAR CON FIREBASE - STATUS
      const statusRef = ref(db, `muebles/tablet_${numFormat}/status`);
      onValue(statusRef, (snapshot) => {
        const status = snapshot.val();
        const badge = document.getElementById(`badge-${i}`);
        
        if (status === 'ONLINE') {
          badge.textContent = `TABLET ${numFormat} ONLINE`;
          badge.className = 'status-badge online';
        } else {
          badge.textContent = `TABLET ${numFormat} OFFLINE`;
          badge.className = 'status-badge offline';
        }
      });

      // CONECTAR CON FIREBASE - EVENTOS (HISTOGRAMA EN TIEMPO REAL)
      const eventosQuery = query(
        ref(db, `muebles/tablet_${numFormat}/eventos`), 
        orderByChild('timestamp'), 
        startAt(startTimestamp)
      );

      onChildAdded(eventosQuery, (snapshot) => {
        const data = snapshot.val();
        
        if (data && data.timestamp && data.conteoActual !== undefined) {
          const eventDate = new Date(data.timestamp);
          const minutoDelEvento = eventDate.getMinutes();

          // LÓGICA CORREGIDA:
          // Solo sumamos cuando hay una detección nueva (el conteo sube)
          // Si el conteo baja (alguien sale del rango de la cámara), lo ignoramos.
          const conteoAnterior = data.conteoAnterior || 0;
          
          if (data.conteoActual > conteoAnterior) {
            // Calculamos cuántas personas nuevas entraron en este evento en particular
            const nuevasDetecciones = data.conteoActual - conteoAnterior;
            
            // Sumamos esa cantidad a la barra correspondiente de ese minuto
            charts[i].data.datasets[0].data[minutoDelEvento] += nuevasDetecciones;
            
            // Actualizamos la vista
            charts[i].update(); 
          }
        }
      });
    }
  </script>
</body>
</html>
