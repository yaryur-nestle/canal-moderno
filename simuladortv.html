<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de TV</title>
    <style>
        /* Estilos generales de la página */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* Fondo blanco */
            color: #DACCAA; /* Color de texto base */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* Evita que aparezcan barras de desplazamiento al girar */
        }

        /* Contenedor maestro que gira todo el contenido */
        .rotate-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Gira el contenido 270 grados (equivalente a -90 grados) para enderezar el texto */
            transform: rotate(270deg); 
            
            /* Invertimos el ancho y alto para que calcen perfecto con la pantalla física */
            width: 100vh;
            height: 100vw;
        }

        /* Estilo del título (ahora interactivo) */
        h1 {
            font-size: 3rem;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            color: #DACCAA; 
            cursor: pointer; /* Cambia el cursor a la "manito" */
            transition: opacity 0.2s ease, transform 0.2s ease;
            user-select: none; /* Evita que el texto se seleccione accidentalmente al hacer doble clic */
        }

        /* Efecto al pasar el mouse por encima del título */
        h1:hover {
            opacity: 0.8;
            transform: scale(1.05); /* Lo hace crecer un poquito para indicar que es un botón */
        }

        /* Contenedor principal del botón */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Estilo del botón único */
        .btn-tv {
            background-color: #DACCAA; 
            color: #ffffff; /* Texto blanco en el botón */
            text-decoration: none;
            padding: 25px 50px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 450px;
            display: inline-block;
        }

        /* Efecto al pasar el mouse por encima del botón */
        .btn-tv:hover {
            transform: translateY(-4px); 
            opacity: 0.9;
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
        }

        /* Adaptación para pantallas pequeñas */
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 30px;
            }
            .btn-tv {
                font-size: 1.1rem;
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="rotate-wrapper">
        <h1 onclick="toggleFullScreen()" title="Haz clic para alternar pantalla completa">Simulador de TV</h1>

        <div class="container">
            <a href="https://yaryur-nestle.github.io/canal-moderno/lector" target="_blank" class="btn-tv">
                RECETAS Redvital la Yaguara
            </a>
        </div>
    </div>

    <script>
        function toggleFullScreen() {
            // Comprueba si ya estamos en pantalla completa
            if (!document.fullscreenElement &&    // alternativa estándar
                !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement ) {  
                
                // Si no lo estamos, entramos a pantalla completa
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
            } else {
                // Si ya lo estamos, salimos de pantalla completa
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
