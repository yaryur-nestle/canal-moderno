<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de TV</title>
    <style>
        /* Estilos generales de la página */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #DACCAA;
            
            /* Ajustamos el body al tamaño exacto de la pantalla física */
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Evita que aparezcan barras de desplazamiento */
            position: relative; /* Vital para que el centrado absoluto funcione */
        }

        /* Contenedor maestro que gira todo el contenido */
        .rotate-wrapper {
            /* CENTRADO ABSOLUTO: Esta es la clave para que no se corte el texto */
            position: absolute;
            top: 50%;
            left: 50%;
            
            /* 1. translate(-50%, -50%) centra el bloque perfectamente en la pantalla */
            /* 2. rotate(270deg) aplica el giro que necesitas */
            transform: translate(-50%, -50%) rotate(270deg); 
            
            /* Invertimos el ancho y alto para que calcen perfecto con la pantalla física */
            width: 100vh;
            height: 100vw;

            /* Mantenemos el flexbox interno para centrar el título y el botón */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px; /* Margen de seguridad interno */
        }

        /* Estilo del título (interactivo para pantalla completa) */
        h1 {
            font-size: 3rem;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            color: #DACCAA; 
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
            user-select: none;
            /* white-space: nowrap evita que el título se divida en dos líneas si la pantalla es muy estrecha */
            white-space: nowrap; 
        }

        /* Efecto al pasar el mouse por encima del título */
        h1:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        /* Contenedor principal del botón */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        /* Estilo del botón único */
        .btn-tv {
            background-color: #DACCAA; 
            color: #ffffff;
            text-decoration: none;
            padding: 25px 50px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 450px;
            display: inline-block;
        }

        /* Efecto al pasar el mouse por encima del botón */
        .btn-tv:hover {
            transform: translateY(-4px); 
            opacity: 0.9;
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
        }

        /* Adaptación para pantallas pequeñas */
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 30px;
            }
            .btn-tv {
                font-size: 1.1rem;
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="rotate-wrapper">
        <h1 onclick="toggleFullScreen()" title="Haz clic para alternar pantalla completa">Simulador de TV</h1>

        <div class="container">
            <a href="https://yaryur-nestle.github.io/canal-moderno/lector" target="_blank" class="btn-tv">
                RECETAS Redvital la Yaguara
            </a>
        </div>
    </div>

    <script>
        function toggleFullScreen() {
            if (!document.fullscreenElement && 
                !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement ) {  
                
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
